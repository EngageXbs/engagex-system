// Builds a simple indented org chart from each employee's "Reports to" (managerId) field.
EX.buildReportingWorkflow = function(){
  const emps = EX.get('employees');
  if(!emps.length) return EX.empty('No employees yet');
  const byManager = {};
  emps.forEach(e=>{ if(e.managerId) (byManager[e.managerId]=byManager[e.managerId]||[]).push(e); });
  const topLevel = emps.filter(e=>!e.managerId || !EX.byId('employees', e.managerId));
  const seen = new Set();
  function renderNode(e, depth){
    if(seen.has(e.id)) return ''; // guard against accidental cycles
    seen.add(e.id);
    const reports = (byManager[e.id]||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    return `<div style="margin-left:${depth*18}px;border-color:var(--ex-line)" class="py-1 border-l ${depth?'':'border-transparent'}">
      <div class="flex items-center gap-2 text-sm py-0.5" style="padding-left:${depth?10:0}px">
        <span class="ex-pill ex-pill-neutral">${(EX.ROLES[e.role]||{}).label||e.role}</span>
        <span class="font-medium">${e.name}</span>
      </div>
      ${reports.map(r=>renderNode(r, depth+1)).join('')}
    </div>`;
  }
  const html = topLevel.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e=>renderNode(e,0)).join('');
  return html || EX.empty('No reporting structure set yet','Set "Reports to" on each employee to build this chart.');
};

EX.submitLeadForm = async function(ev, existingId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, EX.LEAD_FIELDS);
  data.goals = EX.GOALS.filter(g=> ev.target.querySelector(`[name="goal_${g}"]`).checked);
  const compRaw = new FormData(ev.target).get('competitors')||'';
  data.competitors = compRaw.split(',').map(s=>s.trim()).filter(Boolean);
  EX.closeModal();
  if(existingId){
    const before = EX.byId('leads', existingId);
    await EX.patch('leads', existingId, data);
    await EX.addAudit('Edited lead','leads',existingId, before, data);
    EX.toast('Lead updated','good');
  } else {
    data.stage='New'; data.activities=[{ts:EX.now(), note:'Lead created', byName: EX.currentEmployee()?.name}];
    const id = await EX.add('leads', data);
    await EX.addNotification({targetRole:'sales_exec', message:`New lead assigned: ${data.company}`, link:'crm'});
    await EX.addAudit('Created lead','leads',id,null,data);
    EX.toast('Lead created','good');
    EX.route('crm', id);
  }
};

  const lead = EX.byId('leads', leadId);
  const btn = document.getElementById('ai-analysis-btn');
  const out = document.getElementById('ai-analysis-out');
  if(btn) btn.disabled = true;
  if(out) out.innerHTML = `<div class="flex items-center gap-2 text-sm" style="color:var(--ex-ink-soft)">${EX.spinner(true)} Analyzing…</div>`;
  const prompt = `You are a growth-marketing analyst at Engage X Business Solutions. Analyze this SALES LEAD using ONLY the facts given below — you cannot browse the internet, so never invent facts about their actual website, competitors, or performance. Where you must infer or recommend rather than state a known fact, phrase it as a recommendation, not an observation.

LEAD FACTS:
Company: ${lead.company}
Industry: ${lead.industry||'unknown'}
Location: ${lead.location||''}, ${lead.country||''}
Website: ${lead.website||'not provided'}
Stated requirements: ${lead.requirements||'none provided'}
Goals: ${(lead.goals||[]).join(', ')||'none provided'}
Budget: ${lead.budget?('approx '+lead.budget):'not provided'}
Timeline: ${lead.timeline||'not provided'}
Competitors they mentioned: ${(lead.competitors||[]).join(', ')||'none mentioned / unknown'}
Notes from sales: ${lead.notes||'none'}

Reply with ONLY a JSON object with these keys (arrays of short strings unless noted):
overview (string, 2-3 sentences restating only the given facts), digitalPresenceAudit (array, cautious inferences clearly hedged e.g. "Likely..." — say plainly if there isn't enough info), topProblems (array, max 5), topOpportunities (array, max 5), priorities90d (array, max 5), recommendedServices (array, service names from a typical digital marketing agency catalog), leadTemp (one of "Hot","Warm","Cold"), rationale (1-2 sentences on why that temperature, referencing budget/timeline/fit).`;
  try{
    const analysis = await EX.askAIJson(prompt, {modelTier:'default'});
    analysis.generatedAt = EX.now();
    await EX.patch('leads', leadId, {aiAnalysis: analysis, leadScore: lead.leadScore || (analysis.leadTemp==='Hot'?80:analysis.leadTemp==='Warm'?55:30)});
    await EX.addAudit('Ran AI prospect analysis','leads',leadId,null,{leadTemp:analysis.leadTemp});
    EX.toast('AI analysis complete','good');
  }catch(e){
    if(out) out.innerHTML = `<div class="text-sm" style="color:var(--ex-bad)">${EX.friendlySampleError(e)}</div>`;
  } finally { if(btn) btn.disabled=false; }
};

EX.askSalesAssistant = async function(ev, leadId){

  ev.target.reset();
  const lead = EX.byId('leads', leadId);
  const log = document.getElementById('sales-chat-log');
  const hist = EX.salesChatHistory[leadId] = EX.salesChatHistory[leadId]||[];
  const rowUser = document.createElement('div'); rowUser.className='text-sm'; rowUser.innerHTML = `<div class="font-semibold text-xs mb-0.5">You</div><div>${q}</div>`;
  log.appendChild(rowUser);
  const rowAi = document.createElement('div'); rowAi.className='text-sm'; rowAi.innerHTML = `<div class="font-semibold text-xs mb-0.5" style="color:var(--ex-blue-600)">AI Sales Assistant</div><div class="ai-live">Thinking…</div>`;
  log.appendChild(rowAi); log.scrollTop = log.scrollHeight;
  const context = `Lead: ${lead.company}, industry ${lead.industry||'unknown'}, requirements: ${lead.requirements||'none'}, goals: ${(lead.goals||[]).join(', ')}, budget: ${lead.budget||'unknown'}, competitors mentioned: ${(lead.competitors||[]).join(', ')||'none'}. Notes: ${lead.notes||'none'}.`;
  hist.push({role:'user', content: (hist.length?q: `You are a senior sales coach at Engage X Business Solutions, a 360° marketing/tech/AI growth agency. Give concrete, specific sales advice for THIS lead. Keep answers under 150 words, practical, no fluff. Never approve pricing or discounts yourself — you may only suggest. Context:\n${context}\n\nQuestion: ${q}`)});

EX.proposalActions = function(p, role, isAdmin){
  const canSalesReview = ['sales_exec','ops_head','creative_head','super_admin'].includes(role);
  const btn = (label,fn,cls)=>`<button onclick="${fn}" class="ex-btn ${cls||'ex-btn-ghost'} ex-btn-sm">${label}</button>`;
  const out = [];
  if(p.status==='Draft'||p.status==='Proposal Draft') out.push(btn('Submit for Sales Review', `EX.setProposalStatus('${p.id}','Sales Review')`, 'ex-btn-primary'));
  if(p.status==='Sales Review' && canSalesReview) out.push(btn('Request Admin Approval', `EX.setProposalStatus('${p.id}','Admin Approval')`, 'ex-btn-primary'));
  if(p.status==='Admin Approval' && isAdmin) { out.push(btn('Approve', `EX.setProposalStatus('${p.id}','Approved')`, 'ex-btn-primary')); out.push(btn('Send back to Draft', `EX.setProposalStatus('${p.id}','Proposal Draft')`)); }
  if(p.status==='Admin Approval' && !isAdmin){
    const admins = EX.get('employees').filter(e=>EX.effRole(e.role)==='super_admin' && e.status!=='Inactive').map(e=>e.name);
    const who = admins.length? admins.join(' or ') : 'a Super Admin';
    out.push(`<span class="text-xs" style="color:var(--ex-ink-soft)">Waiting on ${who} to approve</span>`);
  }
  if(p.status==='Approved') out.push(btn('Mark as Sent', `EX.setProposalStatus('${p.id}','Sent')`, 'ex-btn-primary'));
  if(['Sent'].includes(p.status)) out.push(btn('Move to Negotiation', `EX.setProposalStatus('${p.id}','Negotiation')`));
  if(['Sent','Negotiation'].includes(p.status)){
    out.push(btn('Mark Won → Convert to Client', `EX.convertLeadToClient('${p.id}')`, 'ex-btn-primary'));
    out.push(btn('Mark Lost', `EX.setProposalStatus('${p.id}','Lost')`, 'ex-btn-danger'));
    out.push(btn('Put On Hold', `EX.setProposalStatus('${p.id}','On Hold')`));
  }
  if(p.status==='On Hold') out.push(btn('Resume — back to Negotiation', `EX.setProposalStatus('${p.id}','Negotiation')`, 'ex-btn-primary'));
  return out.join('');
};
EX.setProposalStatus = async function(id, status){
  const p = EX.byId('proposals', id);
  const versions = (p.versions||[]).concat([{ts:EX.now(), note:`Status → ${status}`, byName:EX.currentEmployee()?.name}]).slice(-30);
  await EX.patch('proposals', id, {status, versions});
  await EX.addAudit('Proposal status changed','proposals',id,{status:p.status},{status});
  if(status==='Admin Approval') await EX.addNotification({targetRole:'super_admin', message:`Proposal for ${p.company} needs your approval.`, link:'proposals'});
  if(status==='Sent') await EX.addNotification({targetRole:'sales_exec', message:`Proposal for ${p.company} marked Sent — track opens & follow up.`, link:'proposals'});
  EX.toast(`Status → ${status}`,'good');
};

  const text = `ENGAGE X BUSINESS SOLUTIONS — PROPOSAL\nPrepared for: ${p.company}\nDate: ${EX.fmtDate(EX.now())}\nStatus: ${p.status}\n\nEXECUTIVE SUMMARY\n${s.executiveSummary||''}\n\nMARKET & COMPETITOR CONTEXT\n${s.marketAnalysis||''}\n\nGROWTH OPPORTUNITIES\n${s.growthOpportunities||''}\n\nRECOMMENDED STRATEGY\n${s.recommendedStrategy||''}\n\n90-DAY ROADMAP\n${s.roadmap||''}\n\nKPIs\n${s.kpis||''}\n\nWHY ENGAGE X\n${s.whyEngageX||''}\n\nSERVICES\n${(p.services||[]).map(x=>'- '+x.item+(x.qty?(' ('+x.qty+'/mo)'):'')).join('\n')}\n\nCOMMERCIALS\nEngage X Service Fee (monthly): ${EX.fmtMoney(p.monthlyFee||0)}\nOne-time fee: ${EX.fmtMoney(p.oneTimeFee||0)}\nThird-party ad spend (pass-through): ${EX.fmtMoney(p.adSpend||0)}\nPayment terms: ${p.paymentTerms||''}\n`;
  await EX.downloadFile(`Proposal-${p.company.replace(/\s+/g,'-')}.txt`, text);
};

EX.submitAddClient = async function(ev){
  ev.preventDefault();
  if(!EX.canSeeFinancials()){ EX.toast('You do not have permission to add clients.','bad'); return; }
  const data = EX.readForm(ev.target, EX.clientFields());
  data.services=[]; data.platforms=[]; data.contractStart=EX.now(); data.durationMonths=12; data.serviceStatus='Active';
  let id;
  try{ id = await EX.add('clients', data); }catch(e){ return; }
  await EX.addAudit('Added client directly','clients',id,null,data);
  EX.closeModal(); EX.toast('Client created','good'); EX.route('clients', id);
};

/* ---- Ads campaigns, CPL and social platforms (per client, per month) ---- */
// Stored inside the client record as monthlyData[YYYY-MM] = {campaigns:[{id,name,platform,amount,leads}], audience:{Instagram:n,...}}
EX.SOCIAL_PLATFORMS = [
  {key:'Instagram', label:'Instagram', audience:'Instagram followers'},
  {key:'Facebook', label:'Facebook', audience:'Facebook followers'},
  {key:'YouTube', label:'YouTube', audience:'YouTube subscribers'},
  {key:'LinkedIn', label:'LinkedIn', audience:'LinkedIn followers'},
  {key:'TikTok', label:'TikTok', audience:'TikTok followers'},
  {key:'GBP', label:'Google Business Profile (GMB / GBP)', audience:null},
];
EX.AD_PLATFORMS = ['Meta (Facebook / Instagram)','Instagram','Facebook','Google Ads','YouTube Ads','LinkedIn Ads','TikTok Ads','Other'];
EX.canEditAds = ()=> ['super_admin','ops_head','creative_head','dme'].includes(EX.currentRole());
EX.platformLabel = (k)=> (EX.SOCIAL_PLATFORMS.find(p=>p.key===k)||{label:k}).label;
EX.adsSummary = function(c, ym){
  const md = (c.monthlyData||{})[ym] || {};
  const camps = (md.campaigns||[]);
  const amount = camps.reduce((n,x)=>n+(Number(x.amount)||0),0);
  const leads = camps.reduce((n,x)=>n+(Number(x.leads)||0),0);
  const cpl = leads>0 ? amount/leads : null;
  const audience = md.audience || {};
  const prevAud = ((c.monthlyData||{})[EX.shiftMonth(ym,-1)]||{}).audience || {};
  return {campaigns:camps, count:camps.length, amount, leads, cpl, audience, prevAudience:prevAud};
};
EX.fmtCpl = (v,ccy)=> v===null||v===undefined? '—' : EX.fmtMoney(v,ccy);
// Read-modify-write the whole monthlyData object (EX.patch is a shallow merge, so nested edits must send the full object).
EX.updateMonthlyData = async function(clientId, ym, mutate){
  const c = EX.byId('clients', clientId); if(!c) return false;
  const md = JSON.parse(JSON.stringify(c.monthlyData||{}));
  md[ym] = md[ym] || {};
  md[ym].campaigns = md[ym].campaigns || [];
  md[ym].audience = md[ym].audience || {};
  mutate(md[ym]);
  try{ await EX.patch('clients', clientId, {monthlyData: md}); }catch(e){ return false; }
  return true;
};
EX.toggleSocialPlatform = async function(clientId, key, on){
  if(!EX.canEditAds()){ EX.toast('You do not have permission to change platforms.','bad'); return; }
  const c = EX.byId('clients', clientId); if(!c) return;
  let list = (c.socialPlatforms||[]).filter(k=>k!==key); if(on) list.push(key);
  list = EX.SOCIAL_PLATFORMS.map(p=>p.key).filter(k=>list.includes(k));
  try{ await EX.patch('clients', clientId, {socialPlatforms:list}); }catch(e){ return; }
  await EX.addAudit('Social platforms changed','clients',clientId,{socialPlatforms:c.socialPlatforms||[]},{socialPlatforms:list});
};

  const ym = EX.ui.contentMonth || EX.monthKey();
  const edit = EX.canEditAds();
  const sum = EX.adsSummary(c, ym);

EX.saveCampaign = async function(ev, clientId, ym, campId){
  ev.preventDefault();
  const d = EX.readForm(ev.target, [{key:'name'},{key:'platform'},{key:'amount',type:'number'},{key:'leads',type:'number'}]);
  d.name = (d.name||'').trim();
  if(!d.name){ EX.toast('Campaign name is required.','bad'); return; }
  if(!(d.amount>=0) || !(d.leads>=0)){ EX.toast('Amount and leads cannot be negative.','bad'); return; }
  d.leads = Math.round(d.leads);
  const ok = await EX.updateMonthlyData(clientId, ym, (m)=>{
    if(campId){ const i = m.campaigns.findIndex(k=>k.id===campId); if(i>=0) m.campaigns[i] = Object.assign({}, m.campaigns[i], d); else m.campaigns.push(Object.assign({id:campId},d)); }
    else m.campaigns.push(Object.assign({id:EX.uid('cmp'), addedBy:(EX.currentEmployee()||{}).name||''}, d));
  });
  if(!ok) return;
  await EX.addAudit(campId?'Edited ad campaign':'Added ad campaign','clients',clientId,null,Object.assign({ym},d));
  EX.closeModal(); EX.toast('Campaign saved','good');
};

// Any overlap between a pause and the given month (YYYY-MM)? Returns the pause record or null.
EX.pauseOverlap = function(c, ym){
  if(!c) return null;
  const mStart = ym+'-01', mEnd = ym+'-31';
  const list = (c.pauseHistory||[]).slice();
  if(c.serviceStatus==='On Hold' && c.pause && !list.some(h=>h.at===c.pause.at)) list.push(c.pause);
  for(const h of list){
    const from = h.from || '0000-00-00';
    const to = h.resumedDate || (h.resumedAt? EX.todayKey(new Date(h.resumedAt)) : '9999-12-31');
    if(from<=mEnd && to>=mStart) return Object.assign({}, h, {_from:from, _to:to});
  }
  return null;
};
// Is the client effectively "paused" for this month? Yes when a pause covers the WHOLE month, or the month is the
// current one and the client is on hold right now. A short pause that has already ended is only a note (pauseOverlap).
EX.pausedInMonth = function(c, ym){
  const h = EX.pauseOverlap(c, ym); if(!h) return null;
  const mStart = ym+'-01', mEnd = ym+'-31';
  if(h._from<=mStart && h._to>=mEnd) return h;
  if(ym===EX.monthKey() && c.serviceStatus==='On Hold') return h;
  return null;
};

EX.performDeleteClient = async function(id){
  const c = EX.byId('clients', id); if(!c) return;
  if(!EX.canDelete()) return;
  const withFin = !!(document.getElementById('delClientFin') && document.getElementById('delClientFin').checked);
  const cols = EX.CLIENT_CASCADE.concat(withFin? EX.CLIENT_FINANCE_CASCADE : []);
  EX.closeModal();
  const removed = {};
  try{
    for(const [col] of cols){
      const rows = EX.get(col).filter(x=>x.clientId===id);
      for(const r of rows){ await EX.remove(col, r.id); removed[col]=(removed[col]||0)+1; }
    }
    if(!withFin){
      // keep accounting history readable after the client record is gone
      for(const [col] of EX.CLIENT_FINANCE_CASCADE){ for(const r of EX.get(col).filter(x=>x.clientId===id)){ await EX.patch(col, r.id, {deletedClientName:c.companyName}); } }
    }
    await EX.remove('clients', id);
  }catch(e){ EX.toast('Delete stopped part-way — some records may already be removed. Open the client list and try the delete again.','bad'); return; }
  await EX.addAudit('Deleted client','clients',id,{companyName:c.companyName,status:c.status,monthlyFee:c.monthlyFee||0,removed},null);
  EX.toast(c.companyName+' deleted','good');
  EX.route('clients');
};

  const t = EX.contentTrackerFor(c, ym);
  const kpi = (l,v,col)=>`<div class="ex-card p-3"><div class="ex-label">${l}</div><div class="font-display text-lg font-bold tnum" style="color:${col||'var(--ex-ink)'}">${v}</div></div>`;

  ${t.pausedPartly?`<div class="rounded-xl p-3 mb-3 text-sm" style="background:var(--ex-warn-bg);color:var(--ex-warn)">Work ${t.paused?'is paused':'was paused for part of the month'} for this client in ${EX.monthLabel(ym)}${t.pausedPartly.reason?' ('+EX.esc(t.pausedPartly.reason)+')':''}${t.paused?' — commitments are not being chased.':'.'}</div>`:''}

      <div><div class="text-xs mb-1" style="color:var(--ex-ink-soft)">Delivery progress (delivered of committed)</div>${EX.trackerBar(t.tot.delivered, t.target)}</div>
      <div><div class="text-xs mb-1" style="color:var(--ex-ink-soft)">Client approval progress (approved of committed)</div>${EX.trackerBar(t.tot.approved, t.target, 'var(--ex-blue-500)')}</div></div>

  <div class="flex items-center justify-between mb-3"><div class="font-display font-bold text-sm">Content Pipeline (all months)</div><button onclick="EX.addContentModal('${c.id}')" class="ex-btn ex-btn-primary ex-btn-sm">${EX.icon('plus','w-3.5 h-3.5')} New content item</button></div>
  ${EX.dataTable({id:'contentTable_'+c.id, rows:items, searchKey:x=>x.title+x.type, filterOptions:EX.CONTENT_STATUSES, filterKey:x=>x.status, filterLabel:'status',
    rowClick:x=>`EX.openContentDrawer('${x.id}')`,
    columns:[
      {label:'Title', get:x=>EX.esc(x.title)},
      {label:'Type', get:x=>EX.esc(x.type)},
      {label:'For month', get:x=>EX.monthLabel(EX.contentMonth(x))},
      {label:'Status', get:x=>EX.pill(x.status)},
      {label:'Client approval', get:x=>EX.approvalPill(EX.contentApproval(x))},
      {label:'Deadline', get:x=>EX.fmtDate(x.deadline)},
      {label:'Assigned', get:x=>{const e=EX.byId('employees',x.assignedTo); return e?EX.esc(e.name):'—';}},

EX.addContentModal = function(clientId){
  EX.openModal(`${EX.modalHeader('New content item')}
    <form onsubmit="EX.saveContent(event,'${clientId}')" class="p-5 space-y-3">
      ${EX.formGrid([
        {key:'title',label:'Title',required:true},
        {key:'type',label:'Type',type:'select',options:EX.allContentTypes()},
        {key:'forMonth',label:'Counts towards month',type:'month',hint:'Which month\'s committed deliverables this item belongs to.'},
        {key:'assignedTo',label:'Assigned to',type:'select',options:EX.get('employees').filter(e=>['graphic_designer','video_editor','dme','dm_manager','parttime','intern','outsourced_editor'].includes(e.role)).map(e=>({value:e.id,label:e.name}))},
        {key:'deadline',label:'Deadline',type:'date'},
      ],{forMonth:EX.ui.contentMonth||EX.monthKey()},2)}
      <div class="flex justify-end gap-2 pt-2"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Create</button></div>
    </form>`);

EX.saveContent = async function(ev, clientId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, [{key:'title'},{key:'type'},{key:'forMonth'},{key:'assignedTo'},{key:'deadline',type:'date'}]);
  if(!/^\d{4}-\d{2}$/.test(data.forMonth||'')) data.forMonth = data.deadline? EX.monthKey(new Date(data.deadline)) : (EX.ui.contentMonth||EX.monthKey());
  data.clientId = clientId; data.status='Draft'; data.comments=[]; data.clientApproval='Pending';
  const id = await EX.add('content', data);
  if(data.assignedTo) await EX.addNotification({targetEmployeeId:data.assignedTo, message:`New content assigned: ${data.title}`, link:'content'});
  await EX.addAudit('Created content item','content',id,null,data);
  EX.closeModal(); EX.toast('Content item created','good');
};
EX.openContentDrawer = function(id){
  const x = EX.byId('content', id); if(!x) return;
  const c = EX.byId('clients', x.clientId);
  const appr = EX.contentApproval(x);
  const assignee = EX.byId('employees', x.assignedTo);
  EX.openModal(`<div id="contentDrawerRoot">${EX.modalHeader(EX.esc(x.title), (c?EX.esc(c.companyName):'')+' · '+EX.esc(x.type||''))}
    <div class="p-5 max-h-[75vh] overflow-y-auto">
      <div class="flex flex-wrap items-center gap-2 mb-2">${EX.pill(x.status)}${EX.approvalPill(appr)}<span class="text-xs" style="color:var(--ex-ink-soft)">Deadline ${EX.fmtDate(x.deadline)}</span></div>
      <div class="text-xs mb-3" style="color:var(--ex-ink-soft)">Created by <b>${EX.esc(EX.contentCreatorLabel(x))}</b>${x._createdAt?' on '+EX.fmtDate(x._createdAt):''}${assignee?' · Assigned to <b>'+EX.esc(assignee.name)+'</b>':''}${x.clientApprovalAt?' · Client approval recorded '+EX.fmtDate(x.clientApprovalAt)+(x.clientApprovalBy?' by '+EX.esc(x.clientApprovalBy):''):''}</div>
      <div class="ex-label">Work status</div>
      <div class="flex flex-wrap gap-1.5 mb-4">${EX.CONTENT_STATUSES.map(s=>`<button onclick="EX.setContentStatus('${id}','${s}')" class="ex-btn ex-btn-sm ${x.status===s?'ex-btn-primary':'ex-btn-ghost'}">${s}</button>`).join('')}</div>
      <div class="ex-label">Client approval <span class="font-normal" style="color:var(--ex-ink-soft)">— what the client has said about this item</span></div>
      <div class="flex flex-wrap gap-1.5 mb-4">${EX.CLIENT_APPROVALS.map(a=>`<button onclick="EX.setClientApproval('${id}','${a}')" class="ex-btn ex-btn-sm ${appr===a?(a==='Approved'?'ex-btn-primary':a==='Re-work'?'ex-btn-danger':'ex-btn-primary'):'ex-btn-ghost'}">${a}</button>`).join('')}</div>
      <div class="grid grid-cols-2 gap-3 mb-4"><div><label class="ex-label">Counts towards month</label><input type="month" value="${EX.contentMonth(x)}" onchange="EX.setContentForMonth('${id}',this.value)" class="ex-input"/></div></div>
      <div class="ex-label">Comments</div>
      <div class="space-y-2 mb-3 max-h-40 overflow-y-auto">${(x.comments||[]).map(cm=>`<div class="text-sm"><b>${EX.esc(cm.by)}:</b> ${EX.esc(cm.text)}</div>`).join('')||'<div class="text-xs" style="color:var(--ex-ink-soft)">No comments yet</div>'}</div>
      <form onsubmit="EX.addContentComment(event,'${id}')" class="flex gap-2"><input name="text" class="ex-input" placeholder="Add a comment or revision note…" required/><button class="ex-btn ex-btn-primary shrink-0">${EX.icon('send','w-3.5 h-3.5')}</button></form>
      ${EX.canDelete()?`<div class="mt-4 pt-3 border-t" style="border-color:var(--ex-line)"><button onclick="EX.closeModal();EX.deleteContent('${id}')" class="ex-btn ex-btn-ghost ex-btn-sm" style="color:var(--ex-bad)">${EX.icon('trash','w-3.5 h-3.5')} Delete content item</button></div>`:''}
    </div></div>`);
};
EX.setContentForMonth = async function(id, ym){
  if(!/^\d{4}-\d{2}$/.test(ym||'')) return;
  await EX.patch('content', id, {forMonth: ym}); EX.toast('Month updated','good');
};
// Moving the work status also keeps the client-approval flag honest (Approved -> Approved, Revision/Rejected -> Re-work, Draft/Submitted -> Pending).
EX.approvalForStatus = (status)=> ({Approved:'Approved',Revision:'Re-work',Rejected:'Re-work',Submitted:'Pending',Draft:'Pending'})[status] || null;
EX.setContentStatus = async function(id, status){
  const x = EX.byId('content', id);
  const isLate = x.deadline && EX.now()>x.deadline && status==='Published';
  if(isLate && !x.lateReason){ EX.closeModal(); return EX.lateReasonModal(id, status); }
  const sync = EX.approvalForStatus(status);
  await EX.patch('content', id, Object.assign({status}, sync?{clientApproval:sync}:{}));
  await EX.addAudit('Content status changed','content',id,{status:x.status},{status});
  EX.closeModal(); EX.toast(`Status → ${status}`,'good');
};
EX.lateReasonModal = function(id, status){
  EX.openModal(`${EX.modalHeader('Late delivery — reason required')}
    <form onsubmit="EX.saveLateReason(event,'${id}','${status}')" class="p-5 space-y-3">
      <textarea required name="reason" class="ex-textarea" rows="3" placeholder="Why was this delivered after the deadline?"></textarea>
      <div class="flex justify-end gap-2"><button class="ex-btn ex-btn-primary">Save & update status</button></div>
    </form>`);
};
EX.saveLateReason = async function(ev,id,status){
  ev.preventDefault();
  const reason = new FormData(ev.target).get('reason');
  await EX.patch('content', id, Object.assign({status, lateReason:reason}, EX.approvalForStatus(status)?{clientApproval:EX.approvalForStatus(status)}:{}));
  await EX.addAudit('Content delivered late','content',id,null,{reason});
  EX.closeModal(); EX.toast('Status updated','good');
};
EX.addContentComment = async function(ev,id){
  ev.preventDefault();
  const text = new FormData(ev.target).get('text');
  const x = EX.byId('content', id);
  const comments = (x.comments||[]).concat([{by:EX.currentEmployee()?EX.currentEmployee().name:(EX.session.mode==='portal'?'Client':'—'), text, ts:EX.now()}]).slice(-30);
  await EX.setId('content', id, Object.assign({}, x, {comments}));
  EX.openContentDrawer(id);
};

EX.saveMeeting = async function(ev, clientId){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const id = await EX.add('meetings', {clientId, date:new Date(fd.get('date')).getTime(), notes:fd.get('notes'), status:'Scheduled'});
  await EX.addNotification({targetRole:'ops_head', message:`Review meeting scheduled with ${EX.byId('clients',clientId).companyName}.`, link:'clients'});

EX.setMeetingStatus = async function(id, status){
  if(!status) return;
  await EX.patch('meetings', id, {status});
  const m = EX.byId('meetings', id);
  if(status==='Client Absent'){
    const past = EX.get('meetings').filter(x=>x.clientId===m.clientId && x.status==='Client Absent').length;
    if(past>=2) await EX.addNotification({targetRole:'ops_head', message:`${EX.byId('clients',m.clientId).companyName} has missed multiple review meetings — a professional notice on the importance of these meetings is recommended.`, link:'clients'});
  }
  EX.toast('Meeting updated','good');
};

EX.saveWorkRequest = async function(ev, clientId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, [{key:'description'},{key:'preferredTimeline'}]);
  const c = EX.byId('clients', clientId);
  const requestedBy = EX.session.mode==='portal' ? 'Client' : (EX.currentEmployee()?EX.currentEmployee().name:'Staff');
  const id = await EX.add('workRequests', {clientId, description:data.description, notes:data.preferredTimeline?('Preferred timeline: '+data.preferredTimeline):'', status:'Requested', requestedBy});

  await EX.addNotification({targetRole:'sales_exec', message:`${c?c.companyName:'A client'} requested additional work — may need a quote.`, link:'clients'});
  await EX.addAudit('Additional work requested','workRequests',id,null,data);
  EX.closeModal(); EX.toast('Request submitted','good');
};

};
EX.saveWorkRequestUpdate = async function(ev, id){
  ev.preventDefault();
  const data = EX.readForm(ev.target, [{key:'status'},{key:'estimatedDeliveryDate',type:'date'},{key:'quoteAmount',type:'number'},{key:'notes'}]);
  const before = EX.byId('workRequests', id);
  await EX.patch('workRequests', id, data);
  await EX.addAudit('Additional work request updated','workRequests',id,{status:before.status},{status:data.status});
  EX.closeModal(); EX.toast('Updated','good');

/* ================= CONTENT STUDIO (global) ================= */
/* ---- Content tracking model: committed (from the client's package) vs created vs delivered vs approved, per month ---- */
EX.CONTENT_TYPES = ['Poster','Carousel','Reel','YouTube Video','Infographic','AI Video','Video','Photo','Blog','Story'];
EX.SERVICE_TO_CONTENT = {'Graphic Design (Posters)':'Poster','Carousels':'Carousel','Infographics':'Infographic','Reels':'Reel','Video Editing':'Video','AI Videos':'AI Video','Photography':'Photo','Videography':'Video','Blogs':'Blog','YouTube Videos':'YouTube Video'};
EX.CLIENT_APPROVALS = ['Pending','Approved','Re-work'];
EX.APPROVAL_TONE = {'Pending':'warn','Approved':'good','Re-work':'bad'};
EX.approvalPill = (a)=> `<span class="ex-pill ex-pill-${EX.APPROVAL_TONE[a]||'neutral'}">${a}</span>`;
EX.contentMonth = (x)=> x.forMonth || EX.monthKey(new Date(x.deadline || x._createdAt || EX.now()));
// "Delivered" = handed to the client for review (Submitted or later). Draft work and internally rejected work is not delivered yet.
EX.isDelivered = (x)=> !['Draft','Rejected'].includes(x.status);
EX.contentApproval = function(x){
  if(x.clientApproval) return x.clientApproval;
  if(['Approved','Scheduled','Published'].includes(x.status)) return 'Approved';
  if(['Revision','Rejected'].includes(x.status)) return 'Re-work';
  return 'Pending';
};
/* Monthly committed deliverables per client.
   client.deliverablePlan = { base:{Reel:12,...}|null, months:{ '2026-10':{...} } }
   Resolution order for a month: that month's own plan -> the client's default plan -> quantities in the client's package (Services tab). */
EX.DELIVERABLE_PRESETS = ['Reel','Poster','YouTube Video'];
EX.cleanPlan = (o)=>{ const out={}; Object.keys(o||{}).forEach(k=>{ const n=Math.round(Number(o[k])); if(k && n>0) out[k]=n; }); return out; };
EX.allContentTypes = function(){
  const set = EX.CONTENT_TYPES.slice();
  EX.get('clients').forEach(c=>{ const p=c.deliverablePlan||{}; [p.base].concat(Object.values(p.months||{})).forEach(o=>Object.keys(o||{}).forEach(k=>{ if(!set.some(x=>x.toLowerCase()===k.toLowerCase())) set.push(k); })); });
  return set;
};
EX.committedSource = function(c, ym){
  const p = c.deliverablePlan||{};
  if(p.months && p.months[ym]) return 'month';
  if(p.base) return 'default';
  return 'package';
};
EX.clientCommitted = function(c, ym){
  ym = ym || EX.monthKey();
  const p = c.deliverablePlan||{}, src = EX.committedSource(c, ym);
  if(src==='month') return EX.cleanPlan(p.months[ym]);
  if(src==='default') return EX.cleanPlan(p.base);
  const out = {};
  (c.services||[]).forEach(sv=>{ const t = EX.SERVICE_TO_CONTENT[sv.item]; if(t && Number(sv.qty)>0) out[t] = (out[t]||0) + Number(sv.qty); });
  return out;
};
EX.committedSourceLabel = (src)=> ({month:'Custom plan for this month', default:'Default monthly plan', package:'From package quantities'}[src]);
EX.editDeliverablesModal = function(clientId, ym){
  if(!EX.canEditDeliverables()){ EX.toast('Only the Super Admin / MD, CEO / Operations Head can change committed deliverables.','bad'); return; }
  const c = EX.byId('clients', clientId); if(!c) return;
  ym = ym || EX.ui.contentMonth || EX.monthKey();
  const cur = EX.clientCommitted(c, ym), src = EX.committedSource(c, ym);
  const keys = EX.DELIVERABLE_PRESETS.slice(); Object.keys(cur).forEach(k=>{ if(!keys.includes(k)) keys.push(k); });
  const rowHtml = (k, locked)=>`<div data-plan-row class="grid grid-cols-[1fr_110px] gap-2 items-center"><input data-plan-type class="ex-input" value="${EX.esc(k)}" ${locked?'readonly':''} placeholder="Deliverable name (e.g. Brochure)" maxlength="40"/><input data-plan-qty type="number" min="0" step="1" class="ex-input" value="${cur[k]||''}" placeholder="per month"/></div>`;
  EX.openModal(`${EX.modalHeader('Monthly committed deliverables', EX.esc(c.companyName))}
    <form onsubmit="EX.saveDeliverables(event,'${clientId}','${ym}')" class="p-5 space-y-3 max-h-[70vh] overflow-y-auto">
      <div class="text-xs" style="color:var(--ex-ink-soft)">How many of each deliverable has this client been promised every month? Leave a quantity empty (or 0) to remove it. Add any other deliverable from the client's package with the button below.</div>
      <div id="planRows" class="space-y-2">${keys.map(k=>rowHtml(k, EX.DELIVERABLE_PRESETS.includes(k))).join('')}</div>
      <button type="button" class="ex-btn ex-btn-ghost ex-btn-sm" onclick="EX.addPlanRow()">${EX.icon('plus','w-3.5 h-3.5')} Add another deliverable</button>
      <div class="rounded-xl p-3 text-sm space-y-1.5" style="background:var(--ex-blue-50)">
        <label class="flex items-start gap-2"><input type="radio" name="scope" value="base" ${src==='month'?'':'checked'} class="mt-1"/><span><b>Every month</b> (default plan) — applies to all months that don't have their own custom plan.</span></label>
        <label class="flex items-start gap-2"><input type="radio" name="scope" value="month" ${src==='month'?'checked':''} class="mt-1"/><span><b>Only ${EX.monthLabel(ym)}</b> — a one-off change for this month.</span></label>
      </div>
      <div class="flex justify-between gap-2 pt-2 border-t" style="border-color:var(--ex-line)"><div>${src==='month'?`<button type="button" class="ex-btn ex-btn-ghost" style="color:var(--ex-bad)" onclick="EX.clearMonthDeliverables('${clientId}','${ym}')">Remove this month's custom plan</button>`:''}</div><div class="flex gap-2"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Save commitments</button></div></div>
    </form>`);
};
EX.addPlanRow = function(){
  const box = document.getElementById('planRows'); if(!box) return;
  const d = document.createElement('div'); d.setAttribute('data-plan-row',''); d.className='grid grid-cols-[1fr_110px] gap-2 items-center';
  d.innerHTML = '<input data-plan-type class="ex-input" placeholder="Deliverable name (e.g. Brochure)" maxlength="40"/><input data-plan-qty type="number" min="0" step="1" class="ex-input" placeholder="per month"/>';
  box.appendChild(d); d.querySelector('input').focus();
};
EX.saveDeliverables = async function(ev, clientId, ym){
  ev.preventDefault();
  if(!EX.canEditDeliverables()){ EX.toast('Only the Super Admin / MD, CEO / Operations Head can change committed deliverables.','bad'); return; }
  const c = EX.byId('clients', clientId); if(!c) return;
  const known = EX.allContentTypes();
  const obj = {};
  ev.target.querySelectorAll('[data-plan-row]').forEach(r=>{
    let name = (r.querySelector('[data-plan-type]').value||'').trim().slice(0,40);
    const qty = Math.round(Number(r.querySelector('[data-plan-qty]').value));
    if(!name || !(qty>0)) return;
    const match = known.find(x=>x.toLowerCase()===name.toLowerCase()); if(match) name = match;
    obj[name] = (obj[name]||0) + qty;
  });
  const scope = new FormData(ev.target).get('scope')==='month' ? 'month' : 'base';
  const before = c.deliverablePlan||null;
  const plan = JSON.parse(JSON.stringify(before||{base:null, months:{}})); plan.months = plan.months||{};
  if(scope==='base') plan.base = obj; else plan.months[ym] = obj;
  try{ await EX.patch('clients', clientId, {deliverablePlan: plan}); }catch(e){ return; }
  await EX.addAudit('Committed deliverables changed','clients',clientId,{plan:before},{scope, month: scope==='month'?ym:null, committed:obj});
  EX.closeModal(); EX.toast('Committed deliverables saved','good');
};
EX.clearMonthDeliverables = async function(clientId, ym){
  if(!EX.canEditDeliverables()) return;
  const c = EX.byId('clients', clientId); if(!c || !c.deliverablePlan) return;
  const before = c.deliverablePlan;
  const plan = JSON.parse(JSON.stringify(before)); if(plan.months) delete plan.months[ym];
  try{ await EX.patch('clients', clientId, {deliverablePlan: plan}); }catch(e){ return; }
  await EX.addAudit('Month-specific deliverables removed','clients',clientId,{month:ym,committed:(before.months||{})[ym]},null);
  EX.closeModal(); EX.toast('Custom plan removed — back to the default','good');
};

EX.deliverablePlanBar = function(c, ym){
  const src = EX.committedSource(c, ym);

    ${EX.canEditDeliverables()? `<button onclick="EX.editDeliverablesModal('${c.id}','${ym}')" class="ex-btn ex-btn-ghost ex-btn-sm">${EX.icon('edit','w-3.5 h-3.5')} Edit committed deliverables</button>`
      : `<span class="ex-pill ex-pill-neutral" title="Only Super Admin / MD and CEO / Operations Head can change commitments">${EX.icon('lock','w-3 h-3 inline mr-1')}View only</span>`}</div>`;
};
EX.contentTrackerFor = function(c, ym){
  const committed = EX.clientCommitted(c, ym);
  const items = EX.get('content').filter(x=>x.clientId===c.id && EX.contentMonth(x)===ym);
  const types = Object.keys(committed); items.forEach(x=>{ const t=x.type||'Other'; if(!types.includes(t)) types.push(t); });
  const rows = types.map(t=>{
    const its = items.filter(x=>(x.type||'Other')===t);
    const approved = its.filter(x=>EX.contentApproval(x)==='Approved').length;
    const rework = its.filter(x=>EX.contentApproval(x)==='Re-work').length;
    const delivered = its.filter(x=>EX.isDelivered(x) || EX.contentApproval(x)==='Approved').length;
    const pending = its.filter(x=>(EX.isDelivered(x) || EX.contentApproval(x)==='Approved') && EX.contentApproval(x)==='Pending').length;
    const commit = committed[t]||0;
    return {type:t, committed:commit, created:its.length, delivered, approved, rework, pending, shortfall: Math.max(0, commit-delivered), extra: Math.max(0, delivered-commit)};
  });
  const sum = (k)=> rows.reduce((n,r)=>n+r[k],0);
  const tot = {committed:sum('committed'), created:sum('created'), delivered:sum('delivered'), approved:sum('approved'), rework:sum('rework'), pending:sum('pending'), shortfall:sum('shortfall')};
  const paused = EX.pausedInMonth(c, ym);
  const pausedPartly = EX.pauseOverlap(c, ym);
  const target = tot.committed || tot.created;
  let label;
  if(paused) label = 'Paused';
  else if(!target) label = 'No deliverables';
  else if(tot.approved>=target) label = 'Fully approved';
  else if(tot.approved>0) label = 'Partially approved';
  else if(tot.delivered>0) label = 'Awaiting approval';
  else label = 'Not started';
  const tone = {'Fully approved':'good','Partially approved':'warn','Awaiting approval':'info','Not started':'neutral','Paused':'warn','No deliverables':'neutral'}[label];
  const labelFull = (label==='Partially approved') ? `Partially approved (${tot.approved} of ${target})` : label;
  return {client:c, ym, rows, tot, label, labelFull, tone, paused, pausedPartly, items, target};
};
EX.trackerClients = function(){
  const role = EX.currentRole();
  let cl = EX.get('clients').filter(c=>c.status!=='Churned');
  if(role==='dme') cl = cl.filter(c=>c.assignedDme===EX.session.employeeId);
  return cl.slice().sort((a,b)=>(a.companyName||'').localeCompare(b.companyName||''));
};

};

EX.ui.contentExpand = EX.ui.contentExpand || {};

EX.contentTrackerSection = function(){
  const ym = EX.ui.contentMonth || EX.monthKey();
  const trs = EX.trackerClients().map(c=>EX.contentTrackerFor(c, ym));
  const k = trs.filter(t=>!t.paused).reduce((a,t)=>{ a.committed+=t.tot.committed; a.delivered+=t.tot.delivered; a.approved+=t.tot.approved; a.rework+=t.tot.rework; a.pending+=t.tot.pending; return a; }, {committed:0,delivered:0,approved:0,rework:0,pending:0});

      ${kpi('Committed',k.committed)}${kpi('Delivered',k.delivered+' / '+k.committed)}${kpi('Client approved',k.approved,'var(--ex-good)')}${kpi('Re-work',k.rework,k.rework?'var(--ex-bad)':'')}${kpi('Pending approval',k.pending,k.pending?'var(--ex-warn)':'')}
    </div>
    <div class="ex-card overflow-hidden mb-5"><div class="overflow-x-auto"><table class="ex-table">
      <thead><tr><th>Client</th><th class="text-right">Committed</th><th class="text-right">Delivered</th><th class="text-right">Approved</th><th class="text-right">Re-work</th><th class="text-right">Pending</th><th style="min-width:130px">Delivery progress</th><th>Approval status</th></tr></thead>
      <tbody>${trs.length? trs.map(t=>{ const c=t.client, open=!!EX.ui.contentExpand[c.id];
        return `<tr style="cursor:pointer" onclick="EX.toggleTrackerRow('${c.id}')">
          <td><div class="flex items-center gap-2">${EX.avatar(c.companyName,24)}<div><div class="font-medium">${EX.esc(c.companyName)}</div>${t.paused?`<div class="text-[11px]" style="color:var(--ex-warn)">Work paused${t.paused.reason?' · '+EX.esc(t.paused.reason):''}</div>`:''}</div></div></td>
          <td class="text-right tnum">${t.tot.committed}</td><td class="text-right tnum">${t.tot.delivered}</td><td class="text-right tnum" style="color:var(--ex-good)">${t.tot.approved}</td><td class="text-right tnum" style="color:${t.tot.rework?'var(--ex-bad)':'inherit'}">${t.tot.rework}</td><td class="text-right tnum">${t.tot.pending}</td>
          <td>${EX.trackerBar(t.tot.delivered, t.target)}</td><td><span class="ex-pill ex-pill-${t.tone}">${EX.esc(t.labelFull)}</span></td></tr>
          ${open?`<tr><td colspan="8" style="background:var(--ex-blue-50)"><div class="p-2">${EX.trackerTypeTable(t)}<div class="mt-2"><a href="#/clients/${c.id}" onclick="EX.ui.clientTab='content'" class="text-xs font-semibold" style="color:var(--ex-blue-600)">Open ${EX.esc(c.companyName)} content &rarr;</a></div></div></td></tr>`:''}`;
      }).join('') : `<tr><td colspan="8">${EX.empty('No clients to track yet')}</td></tr>`}</tbody></table></div></div>`;
};

EX.deleteContent = function(id){
  const x = EX.byId('content', id); if(!x) return;
  if(!EX.canDelete()){ EX.toast('Only Super Admin / MD, Operations Head / Digital Marketing Manager and Creative Head can delete content.','bad'); return; }
  EX.confirmAction('Delete this content item?', `<b>${EX.esc(x.title)}</b> (${EX.esc(x.type||'')}) will be permanently removed. Created by ${EX.contentCreatorLabel(x)}. This cannot be undone.`, async ()=>{
    await EX.remove('content', id);
    await EX.addAudit('Deleted content item','content',id,{title:x.title,type:x.type,clientId:x.clientId,status:x.status,createdByName:x._createdByName||null},null);
    EX.toast('Content item deleted','good');
  }, true);
};
EX.setClientApproval = async function(id, val){
  const x = EX.byId('content', id); if(!x) return;
  if(!EX.CLIENT_APPROVALS.includes(val)) return;
  const emp = EX.currentEmployee();
  const patch = {clientApproval: val, clientApprovalAt: EX.now(), clientApprovalBy: emp? emp.name : (EX.session.mode==='portal'?'Client':'')};
  if(val==='Approved' && ['Draft','Submitted','Revision','Rejected'].includes(x.status)) patch.status = 'Approved';
  if(val==='Re-work' && ['Draft','Submitted','Approved'].includes(x.status)) { patch.status = 'Revision'; patch.revisionCount = (x.revisionCount||0)+1; }
  if(val==='Pending' && ['Approved','Revision','Rejected'].includes(x.status)) patch.status = 'Submitted';
  try{ await EX.patch('content', id, patch); }catch(e){ return; }
  await EX.addAudit('Client approval recorded','content',id,{clientApproval:EX.contentApproval(x)},{clientApproval:val});
  EX.toast('Client approval: '+val, val==='Approved'?'good':val==='Re-work'?'warn':'good');
  if(EX.byId('content',id) && document.getElementById('contentDrawerRoot')) EX.openContentDrawer(id);
};

EX.views['shoots'] = function(){

EX.TASK_FIELDS = [

// Who is allowed to assign a task TO a given target employee. Digital Marketing
// Executives/Interns can only be assigned tasks by a DME or the Ops Head/MD;
// the Creative Head's own team (Interns/Part-Timers/Video Editors who are not
// digital-marketing interns) can only be assigned tasks by the Creative Head or
// Ops Head/MD. Every other target has no extra restriction.
EX.canAssignTo = function(targetEmp){
  if(!targetEmp) return true;
  const role = EX.currentRole();
  if(['super_admin','ops_head','creative_head'].includes(role)) return true;
  if(targetEmp.role==='dme' || EX.isDmIntern(targetEmp)){
    return role==='dme';
  }
  if(EX.isCreativeTeamMember(targetEmp)){
    return role==='creative_head';
  }
  return true;
};
EX.taskCreatorLabel = (t)=> t._createdByName || t.createdByName || '—';
EX.taskActionCell = (t)=> EX.canDelete()? `<button title="Delete task" onclick="event.stopPropagation();EX.deleteTask('${t.id}')" class="ex-btn ex-btn-ghost ex-btn-sm !p-1.5" style="color:var(--ex-bad)">${EX.icon('trash','w-4 h-4')}</button>` : '';
EX.deleteTask = function(id){
  const t = EX.byId('tasks', id); if(!t) return;
  if(!EX.canDelete()){ EX.toast('Only Super Admin / MD, Operations Head / Digital Marketing Manager and Creative Head can delete tasks.', 'bad'); return; }
  EX.confirmAction('Delete this task?', `<b>${EX.esc?EX.esc(t.title):t.title}</b> will be permanently removed${t.assignedToName?` from ${t.assignedToName}'s list`:''}. Created by ${EX.taskCreatorLabel(t)}. This cannot be undone.`, async ()=>{
    await EX.remove('tasks', id);
    await EX.addAudit('Deleted task','tasks',id,{title:t.title,clientId:t.clientId||null,assignedToName:t.assignedToName||null,status:t.status,createdByName:t._createdByName||null},null);
    EX.toast('Task deleted','good');
  }, true);
};
EX.canCreateTasks = function(role){ role = role || EX.currentRole(); return !['intern','parttime'].includes(role); };

EX.showAddTaskModal = function(taskId, clientId){
  const t = taskId? EX.byId('tasks', taskId) : (clientId? {clientId} : null);
  const fields = EX.TASK_FIELDS.map(f=>{
    if(f.key==='clientId') return Object.assign({},f,{options:EX.get('clients').map(c=>({value:c.id,label:c.companyName}))});
    if(f.key==='assignedTo') return Object.assign({},f,{options:EX.get('employees').filter(e=>e.status==='Active' && EX.canAssignTo(e)).map(e=>({value:e.id,label:e.name}))});
    return f;
  });
  EX.openModal(`${EX.modalHeader(taskId?'Edit task':'New task')}
    <form onsubmit="EX.saveTask(event${taskId?`,'${taskId}'`:''})" class="p-5 max-h-[70vh] overflow-y-auto">${EX.formGrid(fields, t||{priority:'Medium'}, 2)}

EX.saveTask = async function(ev, taskId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, EX.TASK_FIELDS);
  const emp = data.assignedTo? EX.byId('employees', data.assignedTo) : null;
  if(emp && !EX.canAssignTo(emp)){ EX.toast(`You are not permitted to assign tasks to ${emp.name}.`, 'bad'); return; }
  data.assignedToName = emp? emp.name : null;
  if(taskId){ await EX.patch('tasks', taskId, data); }
  else { data.status='To Do'; data.revisionCount=0; const id = await EX.add('tasks', data);
    if(data.assignedTo) await EX.addNotification({targetEmployeeId:data.assignedTo, message:`New task assigned: ${data.title}`, link:'tasks'});
  }
  EX.closeModal(); EX.toast('Saved','good');
};

EX.saveInvoice = async function(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const client = EX.byId('clients', fd.get('clientId'));
  const rows = Array.from(document.querySelectorAll('#lineItemsBox > div'));
  const lineItems = rows.map(r=>{ const desc=r.querySelector('.li-desc').value; const qty=Number(r.querySelector('.li-qty').value||1); const rate=Number(r.querySelector('.li-rate').value||0); return {desc,qty,rate,amount:qty*rate}; }).filter(l=>l.desc);
  const subtotal = lineItems.reduce((s,l)=>s+l.amount,0);
  const taxRate = Number(fd.get('taxRate')||0);
  const taxAmount = Math.round(subtotal*taxRate/100);
  const id = await EX.add('invoices', {clientId:client.id, invoiceNumber:EX.seqNumber('invoices','INV'), billingPeriod:fd.get('billingPeriod'),
    lineItems, subtotal, taxRate, taxAmount, total:subtotal+taxAmount, currency:client.currency||'INR', dueDate:new Date(fd.get('dueDate')).getTime(), status:'Generated', notes:fd.get('notes')});
  await EX.addNotification({targetRole:'accounts', message:`Invoice ${EX.byId('invoices',id).invoiceNumber} generated for ${client.companyName}.`, link:'invoices'});
  await EX.addAudit('Invoice created','invoices',id,null,{total:subtotal+taxAmount});
  EX.closeModal(); EX.toast('Invoice created','good'); EX.route('invoices', id);
};

EX.views['finance'] = function(){

  const monthly = months.map(m=>{
    const rev = invs.filter(i=>i._createdAt && EX.monthKey(new Date(i._createdAt))===m.ym).reduce((s,i)=>s+(i.total||0),0);
    const exp = EX.get('expenses').filter(e=>e.date && EX.monthKey(new Date(e.date))===m.ym).reduce((s,e)=>s+(e.amount||0),0);
    return Object.assign({},m,{rev,exp,profit:rev-exp});
  });
  const maxV = Math.max(1,...monthly.map(m=>Math.max(m.rev,m.exp)));
  const aging = {'0-7':0,'8-30':0,'31-60':0,'61-90':0,'90+':0};
  invs.filter(i=>!['Draft','Cancelled','Refunded','Paid'].includes(i.status)).forEach(i=>{
    const bal = i.total-EX.paidTotalForInvoice(i.id); if(bal<=0) return;
    const days = Math.floor((EX.now()-(i.dueDate||EX.now()))/86400000);
    if(days<=7) aging['0-7']+=bal; else if(days<=30) aging['8-30']+=bal; else if(days<=60) aging['31-60']+=bal; else if(days<=90) aging['61-90']+=bal; else aging['90+']+=bal;

    ${EX.statCard('Payables (vendor + pending)', EX.fmtMoney(k.vendorPayables),'','warn','truck')}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-5">
    <div class="lg:col-span-2 ex-card p-5">
      <div class="font-display font-bold text-sm mb-3">Revenue vs Expenses vs Profit — last 6 months</div>
      <div class="flex items-end gap-3 h-40">
        ${monthly.map(m=>`<div class="flex-1 flex flex-col items-center justify-end gap-1">
          <div class="flex items-end gap-0.5 h-32">
            <div title="Revenue" style="width:10px;height:${Math.max(2,m.rev/maxV*128)}px;background:var(--ex-blue-500);border-radius:2px 2px 0 0"></div>
            <div title="Expenses" style="width:10px;height:${Math.max(2,m.exp/maxV*128)}px;background:var(--ex-warn);border-radius:2px 2px 0 0"></div>
          </div>
          <div class="text-[10px]" style="color:var(--ex-ink-soft)">${m.label}</div>
        </div>`).join('')}
      </div>
      <div class="flex gap-4 mt-2 text-xs" style="color:var(--ex-ink-soft)"><span><span class="ex-badge-dot" style="background:var(--ex-blue-500)"></span> Revenue</span><span><span class="ex-badge-dot" style="background:var(--ex-warn)"></span> Expenses</span></div>
    </div>
    <div class="ex-card p-5">
      <div class="font-display font-bold text-sm mb-3">Receivables Aging</div>
      ${Object.entries(aging).map(([b,v])=>`<div class="flex items-center justify-between text-sm py-1"><span style="color:var(--ex-ink-soft)">${b} days</span><span class="tnum font-medium">${EX.fmtMoney(v)}</span></div>`).join('')}
    </div>
  </div>
  <div class="ex-card p-5">
    <div class="flex items-center justify-between mb-3"><div class="font-display font-bold text-sm">Client Profitability Ranking</div><span class="text-xs" style="color:var(--ex-ink-soft)">Margin is assumption-based (${Math.round(((EX.data.companyConfig&&EX.data.companyConfig.assumedCostRatio)||0.6)*100)}% cost ratio) — set a real ratio in Settings once delivery costs are tracked per client.</span></div>
    <table class="ex-table"><thead><tr><th>Client</th><th>Monthly Revenue</th><th>Est. Profit</th><th>Est. Margin</th><th>Health</th></tr></thead>
    <tbody>${clientsRanked.map(c=>{const h=EX.computeClientHealth(c); return `<tr onclick="EX.route('clients','${c.id}')" style="cursor:pointer"><td>${c.companyName}</td><td class="tnum">${EX.fmtMoney(c.rev,c.currency)}</td><td class="tnum">${EX.fmtMoney(c.estProfit,c.currency)}</td><td class="tnum">${c.estMargin}%</td><td>${EX.pill(h.label)}</td></tr>`;}).join('')||`<tr><td colspan="5">${EX.empty('No active clients yet')}</td></tr>`}</tbody></table>
  </div>`;
};

/* ================= MONTH-END PAYABLES (salaries + vendors) ================= */
EX.payMonth = ()=> EX.ui.payMonth || EX.monthKey();
EX.setPayMonth = (v)=>{ if(/^\d{4}-\d{2}$/.test(v||'')){ EX.ui.payMonth = v; EX.scheduleRender(); } };
EX.monthEndTs = (ym)=>{ const [y,m]=ym.split('-').map(Number); return Date.UTC(y,m,1)-1; };
EX.payrollExpense = (key)=> EX.get('expenses').find(e=>e.payrollKey===key);
// everything owed for a month: salaries (from each active employee's monthly salary) and vendor bills due by month end
EX.payablesFor = function(ym){
  const end = EX.monthEndTs(ym);
  const emps = EX.get('employees').filter(e=>e.status==='Active' || e.status==='On Leave');
  const salaries = emps.filter(e=>Number(e.salary)>0).map(e=>{ const key = 'salary|'+e.id+'|'+ym; const exp = EX.payrollExpense(key); return {emp:e, amount:Number(e.salary), key, paid:!!exp, paidAt:exp?exp.date:null, expId:exp?exp.id:null}; });
  const noSalary = emps.filter(e=>!(Number(e.salary)>0));
  const bills = EX.get('vendorInvoices').filter(b=>{
    if(b.status==='Paid'){ const pm = EX.monthKey(new Date(b.paidAt || b._updatedAt || b._createdAt || EX.now())); return pm===ym; }
    return !b.dueDate || b.dueDate<=end;
  }).map(b=>{ const v = EX.get('vendors').find(x=>x.id===b.vendorId)||{}; return {bill:b, vendor:v, amount:Number(b.amount)||0, paid:b.status==='Paid', overdue: !!(b.status!=='Paid' && b.dueDate && b.dueDate<EX.now())}; });
  const sum = (arr, onlyPending)=> arr.filter(x=>!onlyPending||!x.paid).reduce((n,x)=>n+x.amount,0);
  return {ym, salaries, noSalary, bills, totalSalary:sum(salaries), pendingSalary:sum(salaries,true), totalVendor:sum(bills), pendingVendor:sum(bills,true)};
};

      <td class="text-right">${x.paid?'':`<button onclick="EX.markVendorBillPaid('${x.bill.id}')" class="ex-btn ex-btn-primary ex-btn-sm">Mark paid</button>`}</td></tr>`).join('') + `<tr style="font-weight:600"><td>Total</td><td></td><td></td><td class="text-right tnum">${EX.fmtMoney(p.totalVendor)}</td><td></td><td></td></tr>`

EX.markSalaryPaid = function(empId, ym){
  const e = EX.byId('employees', empId); if(!e) return;
  const key = 'salary|'+empId+'|'+ym;
  if(EX.payrollExpense(key)){ EX.toast('Already marked paid.','warn'); return; }

// ---- Create a real Supabase Auth login for a teammate ----
// This goes through the server-side api/create-user.js function (service_role
// key) rather than calling sb.auth.signUp() directly from the browser, because
// signUp() would create a session for the NEW user right here and sign the
// admin doing this OUT of their own account. See api/create-user.js.
EX.setupLogin = function(id){
  const emp = EX.byId('employees', id);
  if(!emp) return;
  if(!emp.email){ EX.toast("This employee has no email on file — add one via Edit profile first, then set up their login.", 'bad'); return; }
  EX.openModal(`${EX.modalHeader('Set up login for '+emp.name, "Creates a Supabase Auth account so they can sign in with their own email and password. This doesn't affect your own session.")}
    <form onsubmit="EX.submitSetupLogin(event,'${id}')" class="p-5 space-y-3">
      <div><label class="ex-label">Email</label><input class="ex-input" value="${emp.email}" disabled/></div>
      <div><label class="ex-label">Temporary password</label><input required name="password" type="text" minlength="8" class="ex-input" placeholder="At least 8 characters"/></div>
      <p class="text-xs" style="color:var(--ex-ink-soft)">Share this password with ${emp.name} privately (there's no "change on first login" step yet — a password manager works well here).</p>
      <div class="flex justify-end gap-2 pt-3 mt-2 border-t" style="border-color:var(--ex-line)"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Create login</button></div>
    </form>`);
};
EX.submitSetupLogin = async function(ev, id){
  ev.preventDefault();
  const emp = EX.byId('employees', id);
  if(!emp) return;
  const fd = new FormData(ev.target);
  const password = fd.get('password');
  const btn = ev.target.querySelector('button.ex-btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Creating…'; }
  try{
    if(!EX.sb) throw new Error('Not connected to the workspace database.');
    const { data } = await EX.sb.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if(!token) throw new Error('Your own session looks expired — sign out and back in, then try again.');
    const res = await fetch('/api/create-user', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({email: emp.email, password}),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok || json.error) throw new Error(json.error || ('Request failed ('+res.status+')'));
    EX.closeModal();
    EX.toast('Login created for '+emp.name+' — share the password with them privately.', 'good');
    await EX.addAudit('Set up login', 'employees', id, null, {email: emp.email});
  }catch(e){
    EX.toast('Could not create the login: '+((e && e.message) || 'unknown error'), 'bad');
    if(btn){ btn.disabled = false; btn.textContent = 'Create login'; }
  }
};

EX.downloadMonthlyReviewPdf = async function(ym, empId){
  ym = ym || EX.monthKey();
  const emps = EX.get('employees').filter(e=>e.status!=='Removed' && (!empId || e.id===empId));
  const rows = emps.map(e=> Object.assign({emp:e}, EX.employeeMonthStats(e.id, ym))).sort((a,b)=>b.productivityScore-a.productivityScore);
  const doc = EX.pdfNew(empId? 'Monthly Employee Report' : 'Monthly Team Performance Report', (empId&&emps[0]? emps[0].name+'  |  ' : '')+EX.monthLabel(ym));
  const tot = (k)=> rows.reduce((n,r)=>n+r[k],0);
  if(!empId){
    doc.stats([{label:'Employees',value:String(rows.length)},{label:'Total leave days',value:String(tot('leaveDays'))},{label:'Total WFH days',value:String(tot('wfhDays'))},{label:'Avg productivity',value:String(rows.length? Math.round(tot('productivityScore')/rows.length):0)}],4);
  }
  doc.table([{label:'Employee',w:2.9},{label:'Present',w:1,align:'right'},{label:'WFH',w:0.9,align:'right'},{label:'Leave',w:0.9,align:'right'},{label:'Late',w:0.8,align:'right'},{label:'Hours',w:1,align:'right'},{label:'Tasks',w:1.1,align:'right'},{label:'On-time',w:1.1,align:'right'},{label:'Rev.',w:0.8,align:'right'},{label:'EOD',w:0.9,align:'right'},{label:'Score',w:1,align:'right'}],
    rows.map(r=>[r.emp.name+' ('+((EX.ROLES[r.emp.role]||{}).label||r.emp.role)+')', r.daysPresent, r.wfhDays, r.leaveDays, r.lateDays, r.hoursWorked, r.tasksCompleted+'/'+r.tasksAssigned, Math.round(r.onTimeRate*100)+'%', r.revisions, r.eodDays, r.productivityScore]),
    {size:7.5, empty:'No employees'});
  doc.paragraph(`Present = days with a check-in. WFH and Leave = approved requests (Sundays excluded). Late = check-in after ${EX.officeStart()} + 15 minutes. Score = task completion 40%, on-time delivery 30%, attendance 20%, low revisions 10%.`, {size:7.5, color:[90,102,122]});
  if(empId && emps[0]){
    const e = emps[0];
    doc.heading('Day-by-day attendance');
    const days = EX.attDayKeys(e.id, ym);
    const wfh = EX.approvedDaySet(e.id,'wfhRequests',ym), lv = EX.approvedDaySet(e.id,'leaveRequests',ym);
    const all = Array.from(new Set(days.concat(Array.from(wfh), Array.from(lv)))).sort();
    doc.table([{label:'Date',w:1.6},{label:'Status',w:1.4},{label:'Check-in',w:1.2},{label:'Check-out',w:1.2},{label:'Hours',w:0.8,align:'right'},{label:'EOD',w:1}],

    const tasks = EX.get('tasks').filter(t=>t.assignedTo===e.id && t._createdAt && EX.monthKey(new Date(t._createdAt))===ym);
    doc.heading('Tasks this month');
    doc.table([{label:'Task',w:3.2},{label:'Client',w:2},{label:'Deadline',w:1.3},{label:'Status',w:1.2}], tasks.map(t=>[t.title,(EX.byId('clients',t.clientId)||{}).companyName||'-',EX.fmtDate(t.deadline),t.status]), {empty:'No tasks assigned this month'});
  }
  await EX.saveDoc(doc, `${empId&&emps[0]?'Employee-Report-'+EX.safeFile(emps[0].name):'Team-Performance'}-${ym}.pdf`);
};

/* ================= WORK REPORT ================= */
/* One place to review completed work: client deliverables (committed vs delivered vs pending balance), employee output, and a log of everything completed in the month.
   Scope: management (Super Admin/MD, Ops Head/CEO, DMM, Creative Head, HR) see everybody; a DME sees their own team; everyone else sees their own work.
   Client deliverables are visible to everyone who can see the client (view-only — only Super Admin/MD and CEO/Ops Head can change commitments). Retainer amounts never appear here. */
EX.workReportScope = function(){
  const role = EX.currentRole();
  if(['super_admin','ops_head','creative_head','hr'].includes(role)) return 'all';
  if(role==='dme') return 'team';
  return 'self';
};
EX.workReportEmployees = function(){
  const scope = EX.workReportScope(), me = EX.session.employeeId;
  let emps = EX.get('employees').filter(e=>e.status!=='Removed');
  if(scope==='team') emps = emps.filter(e=>e.id===me || e.managerId===me);
  else if(scope==='self') emps = emps.filter(e=>e.id===me);
  return emps.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
};
EX.workReportData = function(ym){
  const trs = EX.trackerClients().map(c=>EX.contentTrackerFor(c, ym));
  const emps = EX.workReportEmployees(); const ids = new Set(emps.map(e=>e.id));
  const scope = EX.workReportScope();
  const inScope = (empId)=> scope==='all' || (empId && ids.has(empId));
  const empRows = emps.map(e=>{
    const st = EX.employeeMonthStats(e.id, ym);
    const mine = EX.get('content').filter(x=>x.assignedTo===e.id && EX.contentMonth(x)===ym);
    return {emp:e, st, contentCreated:mine.length, contentDelivered:mine.filter(x=>EX.isDelivered(x)||EX.contentApproval(x)==='Approved').length, contentApproved:mine.filter(x=>EX.contentApproval(x)==='Approved').length};
  });
  const log = [];
  EX.get('tasks').forEach(t=>{ if(t.status==='Done' && t.completedAt && EX.monthKey(new Date(t.completedAt))===ym && inScope(t.assignedTo))
    log.push({date:t.completedAt, kind:'Task', title:t.title, client:(EX.byId('clients',t.clientId)||{}).companyName||'', who:t.assignedToName||((EX.byId('employees',t.assignedTo)||{}).name)||'', status:'Done'}); });
  EX.get('content').forEach(x=>{ if(EX.contentMonth(x)===ym && (EX.isDelivered(x)||EX.contentApproval(x)==='Approved') && inScope(x.assignedTo))
    log.push({date:x.clientApprovalAt||x._updatedAt||x._createdAt||0, kind:'Content ('+(x.type||'—')+')', title:x.title, client:(EX.byId('clients',x.clientId)||{}).companyName||'', who:((EX.byId('employees',x.assignedTo)||{}).name)||x._createdByName||'', status:EX.contentApproval(x)==='Approved'?'Approved':x.status}); });
  log.sort((a,b)=>(b.date||0)-(a.date||0));
  const active = trs.filter(t=>!t.paused);
  const tot = active.reduce((a,t)=>{ a.committed+=t.tot.committed; a.delivered+=t.tot.delivered; a.approved+=t.tot.approved; a.balance+=t.tot.shortfall; return a; },{committed:0,delivered:0,approved:0,balance:0});
  return {ym, trs, empRows, log, tot, tasksDone: log.filter(l=>l.kind==='Task').length};
};

EX.downloadWorkReportCsv = async function(ym){
  ym = ym || EX.ui.contentMonth || EX.monthKey();
  const d = EX.workReportData(ym); const scope = EX.workReportScope();
  let tab = EX.ui.wrTab || 'clients'; if(scope==='self' && tab==='employees') tab='log';
  let csv, name;
  if(tab==='clients'){
    const rows = []; d.trs.forEach(t=> t.rows.forEach(r=> rows.push({client:t.client.companyName, type:r.type, committed:r.committed, delivered:r.delivered, balance:r.committed? r.shortfall : '', approved:r.approved, paused:t.paused?'Yes':''})));
    csv = EX.toCsv(rows, [{label:'Client',key:'client'},{label:'Deliverable',key:'type'},{label:'Committed',key:'committed'},{label:'Delivered',key:'delivered'},{label:'Pending balance',key:'balance'},{label:'Approved',key:'approved'},{label:'Work paused',key:'paused'}]); name='client-deliverables';
  } else if(tab==='employees'){
    csv = EX.toCsv(d.empRows, [{label:'Employee',get:r=>r.emp.name},{label:'Role',get:r=>(EX.ROLES[r.emp.role]||{}).label||r.emp.role},{label:'Tasks completed',get:r=>r.st.tasksCompleted},{label:'Tasks assigned',get:r=>r.st.tasksAssigned},{label:'On-time %',get:r=>r.st.tasksCompleted?Math.round(r.st.onTimeRate*100):''},{label:'Content delivered',get:r=>r.contentDelivered},{label:'Days present',get:r=>r.st.daysPresent},{label:'EOD reports',get:r=>r.st.eodDays},{label:'Score',get:r=>r.st.productivityScore}]); name='employee-performance';
  } else {

EX.saveEod = async function(ev, day){
  ev.preventDefault();
  const me = EX.currentEmployee(); if(!me) return;
  const f = new FormData(ev.target);
  const summary = (f.get('summary')||'').trim();
  if(!summary){ EX.toast('Please write what you worked on.','bad'); return; }
  const done = EX.tasksCompletedOn(me.id, day).map(t=>({title:t.title, client:(EX.byId('clients',t.clientId)||{}).companyName||''}));
  try{
    await EX.writeAttDay(me.id, day, (rec)=>{ rec.eod = {summary, blockers:(f.get('blockers')||'').trim(), tomorrow:(f.get('tomorrow')||'').trim(), tasksDone:done, submittedAt:EX.now()}; });
  }catch(e){ return; }
  EX.toast('EOD report saved','good');
};
EX.eodBlock = function(doc, emp, day){
  const rec = EX.attDay(emp.id, day); const eod = rec.eod || {};
  doc.heading(`${emp.name}  -  ${(EX.ROLES[emp.role]||{}).label||emp.role}`);
  doc.paragraph(`${EX.dayStatus(emp.id, day)}  |  In: ${EX.timeOnly(rec.checkIn)}  |  Out: ${EX.timeOnly(rec.checkOut)}  |  Hours: ${rec.hours||'-'}`, {size:8.5, color:[90,102,122]});
  if(!eod.summary){ doc.paragraph('No EOD report submitted for this day.', {size:9, color:[220,38,38]}); return; }
  doc.paragraph('Work completed', {size:9, bold:true, after:1}); doc.paragraph(eod.summary, {size:9.5, indent:6});
  const tasks = eod.tasksDone||[];
  if(tasks.length){ doc.paragraph('Tasks completed', {size:9, bold:true, after:1}); tasks.forEach(t=> doc.paragraph('- '+t.title+(t.client?'  ('+t.client+')':''), {size:9, indent:6, after:0})); doc.spacer(4); }
  if(eod.blockers){ doc.paragraph('Blockers / issues', {size:9, bold:true, after:1}); doc.paragraph(eod.blockers, {size:9.5, indent:6}); }
  if(eod.tomorrow){ doc.paragraph('Plan for tomorrow', {size:9, bold:true, after:1}); doc.paragraph(eod.tomorrow, {size:9.5, indent:6}); }
};
EX.downloadEodPdf = async function(empId, day){
  const emp = EX.byId('employees', empId); if(!emp) return;
  const doc = EX.pdfNew('Daily EOD Report', `${emp.name}  |  ${EX.fmtDate(new Date(day+'T00:00:00').getTime())}`);
  EX.eodBlock(doc, emp, day);
  await EX.saveDoc(doc, `EOD-${EX.safeFile(emp.name)}-${day}.pdf`);
};
EX.downloadTeamEodPdf = async function(day){
  day = day || EX.todayKey();
  const emps = EX.get('employees').filter(e=>e.status==='Active');
  const done = emps.filter(e=>{ const r=EX.attDay(e.id,day); return r.eod && r.eod.summary; });
  const doc = EX.pdfNew('Team EOD Report', EX.fmtDate(new Date(day+'T00:00:00').getTime()));
  doc.stats([{label:'Team members',value:String(emps.length)},{label:'EOD submitted',value:String(done.length),color:[14,159,110]},{label:'Missing',value:String(emps.length-done.length),color:emps.length-done.length?[220,38,38]:[14,26,43]}],3);
  done.forEach(e=>EX.eodBlock(doc, e, day));
  const missing = emps.filter(e=>!done.includes(e));
  if(missing.length){ doc.heading('EOD not submitted'); doc.table([{label:'Employee',w:3},{label:'Role',w:3},{label:'Attendance',w:2}], missing.map(e=>[e.name,(EX.ROLES[e.role]||{}).label||e.role,EX.dayStatus(e.id,day)])); }
  await EX.saveDoc(doc, `Team-EOD-${day}.pdf`);
};

  const end = new Date(base.getTime() + (days-1)*86400000);
  to.min = from.value;
  to.value = end.toISOString().slice(0,10);
};

EX.saveLeaveRequest = async function(ev, col){
  ev.preventDefault();

  if(!data.startDate || !data.endDate){ EX.toast('Please pick both a From and To date.','bad'); return; }
  if(data.endDate < data.startDate){ EX.toast('"To" date cannot be earlier than "From" date — please fix the range.','bad'); return; }
  const me = EX.currentEmployee();
  const days = Math.round((data.endDate-data.startDate)/86400000)+1;
  let id;
  try{ id = await EX.add(col, Object.assign({employeeId:me.id, employeeName:me.name, status:'Pending', days}, data)); }

  await EX.addNotification({targetRole:'ops_head', message:`${me.name} submitted a ${col==='wfhRequests'?'WFH':'leave'} request.`, link:'leave'});

  await EX.patch(col, id, {status});
  await EX.addAudit((col==='wfhRequests'?'WFH':'Leave')+' request '+status,col,id,{status:rec.status},{status});
  if(status==='Approved'||status==='Rejected') await EX.addNotification({targetEmployeeId:rec.employeeId, message:`Your ${col==='wfhRequests'?'WFH':'leave'} request (${EX.fmtDate(rec.startDate)}) was ${status.toLowerCase()}.`, link:'leave'});

};

EX.updateForecast = function(applyPreset){
  const scenario = document.getElementById('fc-scenario').value;
  const presets = {conservative:{g:1,c:3},realistic:{g:4,c:2},aggressive:{g:8,c:1}};
  const growthInput = document.getElementById('fc-growth'), churnInput = document.getElementById('fc-churn');
  if(applyPreset){ growthInput.value = presets[scenario].g; churnInput.value = presets[scenario].c; }
  const g = Number(growthInput.value)/100, c = Number(churnInput.value)/100;
  const k = EX.computeKPIs();
  let mrr = k.mrr||50000, exp = k.expenseMonth||30000;
  const rows = [];
  [3,6,12,24].forEach(months=>{
    let m=mrr, e=exp;
    for(let i=0;i<months;i++){ m = m*(1+g-c); e = e*1.01; }
    rows.push({months, revenue:m, expenses:e, profit:m-e});
  });
  document.getElementById('fc-out').innerHTML = `<table class="ex-table"><thead><tr><th>Horizon</th><th>Revenue</th><th>Expenses</th><th>Profit</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.months} mo</td><td class="tnum">${EX.fmtMoney(r.revenue)}</td><td class="tnum">${EX.fmtMoney(r.expenses)}</td><td class="tnum" style="color:${r.profit>=0?'var(--ex-good)':'var(--ex-bad)'}">${EX.fmtMoney(r.profit)}</td></tr>`).join('')}
  </tbody></table><div class="text-[11px] mt-2" style="color:var(--ex-ink-soft)">A projection based on the assumptions above — not a guarantee.</div>`;
};
EX.updateProfitEngine = function(){

  const reqRevenue = margin>0? target/margin : 0;
  const reqExpenses = reqRevenue-target;

EX.exportFullBackup = async function(){
  const payload = {
    exportedAt: new Date().toISOString(),
    app: 'Engage X Business Solutions',
    collections: {},
  };
  EX.COLLECTIONS.forEach(c=>{ payload.collections[c] = EX.get(c); });
  const stamp = new Date().toISOString().slice(0,10);
  await EX.downloadFile(`EngageX-Backup-${stamp}.json`, JSON.stringify(payload, null, 2));
  await EX.addAudit('Downloaded full data backup', 'system', null, null, null);
};
EX.importBackupFile = async function(ev){
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = ''; // allow re-selecting the same file later
  if(!file) return;
  let parsed;
  try{
    const text = await file.text();
    parsed = JSON.parse(text);
  }catch(e){ EX.toast('That file could not be read as a backup — it does not look like valid JSON.', 'bad'); return; }
  const collections = parsed && parsed.collections;
  if(!collections || typeof collections !== 'object'){ EX.toast('That file does not look like an Engage X backup.', 'bad'); return; }
  const summary = Object.keys(collections)
    .filter(k=> EX.COLLECTIONS.includes(k) && Array.isArray(collections[k]) && collections[k].length)
    .map(k=> `${collections[k].length} ${k}`).join(', ') || 'no recognizable records';
  const when = parsed.exportedAt ? EX.fmtDateTime(new Date(parsed.exportedAt).getTime()) : 'an unknown date';
  EX.confirmAction(
    'Restore from backup?',
    `This backup is from ${when} and contains: ${summary}. Restoring overwrites any existing record that shares an ID with one in the backup, and adds back anything in the backup that's currently missing — it does not delete records that only exist in the workspace right now. This can't be undone automatically, so consider downloading a fresh backup of today's data first.`,
    async ()=>{ await EX.performRestore(collections); },
    true
  );
};
EX.performRestore = async function(collections){
  let written = 0, failed = 0;
  for(const col of Object.keys(collections)){
    if(!EX.COLLECTIONS.includes(col) || !Array.isArray(collections[col])) continue;
    for(const row of collections[col]){
      if(!row || !row.id) continue;
      const payload = Object.assign({}, row);
      delete payload.id;
      try{ await EX.setId(col, row.id, payload); written++; }
      catch(e){ failed++; }
    }
  }
  await EX.addAudit('Restored data from backup file', 'system', null, null, {written, failed});
  EX.toast(`Restore complete: ${written} record${written===1?'':'s'} written${failed?`, ${failed} failed`:''}.`, failed ? 'warn' : 'good');
};

EX.portalViews['portal-dashboard'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('No client selected');
  const invs = EX.get('invoices').filter(i=>i.clientId===c.id);
  const outstanding = invs.filter(i=>!['Paid','Cancelled','Refunded','Draft'].includes(i.status)).reduce((s,i)=>s+(i.total-EX.paidTotalForInvoice(i.id)),0);
  const nextDue = invs.filter(i=>!['Paid','Cancelled','Refunded'].includes(i.status)).sort((a,b)=>(a.dueDate||0)-(b.dueDate||0))[0];
  const content = EX.get('content').filter(x=>x.clientId===c.id);
  const pendingApproval = content.filter(x=>x.status==='Submitted').length;
  const nextMeeting = EX.get('meetings').filter(m=>m.clientId===c.id && m.status==='Scheduled').sort((a,b)=>a.date-b.date)[0];
  const tasks = EX.get('tasks').filter(t=>t.clientId===c.id);
  const donePct = tasks.length? Math.round(tasks.filter(t=>t.status==='Done').length/tasks.length*100) : 0;
  return `<div class="mb-5"><h1 class="font-display text-xl font-bold">Welcome to Engage X</h1><p class="text-sm" style="color:var(--ex-ink-soft)">Your Business Growth Dashboard — ${c.companyName}</p></div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${EX.statCard('Active services', (c.services||[]).length,'','info','briefcase')}
    ${EX.statCard('Platforms connected', (c.platforms||[]).filter(p=>p.url).length+'/'+(c.platforms||[]).length,'','info','link')}
    ${EX.statCard('Monthly deliverables', donePct+'%','complete this cycle','good','check-square')}
    ${EX.statCard('Content pending your approval', pendingApproval,'','warn','image')}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="ex-card p-4"><div class="ex-label">Outstanding payment</div><div class="font-display text-2xl font-bold tnum" style="color:${outstanding>0?'var(--ex-bad)':'var(--ex-good)'}">${EX.fmtMoney(outstanding,c.currency)}</div>${nextDue?`<div class="text-xs mt-1" style="color:var(--ex-ink-soft)">Due ${EX.fmtDate(nextDue.dueDate)}</div><a href="#/portal-payments" class="ex-btn ex-btn-primary ex-btn-sm mt-2">Pay now</a>`:''}</div>
    <div class="ex-card p-4"><div class="ex-label">Next review meeting</div><div class="font-semibold text-sm mt-1">${nextMeeting?EX.fmtDateTime(nextMeeting.date):'None scheduled'}</div><a href="#/portal-meetings" class="text-xs underline mt-2 inline-block" style="color:var(--ex-blue-600)">View meetings</a></div>
    <div class="ex-card p-4"><div class="ex-label">Service status</div><div class="mt-1">${EX.pill(c.serviceStatus||'Active')}</div>${c.serviceStatus==='On Hold'?`<div class="text-xs mt-1" style="color:var(--ex-ink-soft)">Since ${EX.fmtDate(c.serviceStatusChangedAt)}</div>`:''}</div>
  </div>`;
};

EX.clientRequestRevision = function(id){
  EX.openModal(`${EX.modalHeader('Request revision')}<form onsubmit="EX.saveRevisionRequest(event,'${id}')" class="p-5 space-y-3"><textarea required name="text" class="ex-textarea" rows="3" placeholder="What would you like changed?"></textarea><div class="flex justify-end gap-2"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Send</button></div></form>`);
};
EX.saveRevisionRequest = async function(ev,id){
  ev.preventDefault();
  const text = new FormData(ev.target).get('text');
  const x = EX.byId('content', id);
  const comments = (x.comments||[]).concat([{by:'Client', text, ts:EX.now()}]);
  await EX.patch('content', id, {status:'Revision', clientApproval:'Re-work', clientApprovalAt:EX.now(), clientApprovalBy:'Client', comments});
  EX.closeModal(); EX.toast('Revision requested','good');
};
