/* ============ DESIGN TOKENS ============ */
:root{

  :root:not([data-theme="light"]){
    --ex-blue-900:#DCE6FF; --ex-blue-700:#AFC4FA; --ex-blue-600:#7DA0FF; --ex-blue-500:#8FB0FF;
    --ex-blue-400:#6C93F5; --ex-blue-100:#16233F; --ex-blue-50:#111B31;
    --ex-ink:#EAF0FC; --ex-ink-soft:#A9B7D3; --ex-line:#233252; --ex-line-soft:#1B2740;
    --ex-paper:#0A1120; --ex-surface:#0F1930; --ex-surface-raised:#132040;
    --ex-good:#3ED9A0; --ex-good-bg:#0E2A20; --ex-warn:#F2B84B; --ex-warn-bg:#332507;
    --ex-bad:#F87171; --ex-bad-bg:#3A1414; --ex-info:#8FB0FF; --ex-info-bg:#101E3D;
    --ex-demo:#C4A4FF; --ex-demo-bg:#241536;
    --ex-shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ex-blue-900:#DCE6FF; --ex-blue-700:#AFC4FA; --ex-blue-600:#7DA0FF; --ex-blue-500:#8FB0FF;
  --ex-blue-400:#6C93F5; --ex-blue-100:#16233F; --ex-blue-50:#111B31;
  --ex-ink:#EAF0FC; --ex-ink-soft:#A9B7D3; --ex-line:#233252; --ex-line-soft:#1B2740;
  --ex-paper:#0A1120; --ex-surface:#0F1930; --ex-surface-raised:#132040;
  --ex-good:#3ED9A0; --ex-good-bg:#0E2A20; --ex-warn:#F2B84B; --ex-warn-bg:#332507;
  --ex-bad:#F87171; --ex-bad-bg:#3A1414; --ex-info:#8FB0FF; --ex-info-bg:#101E3D;
  --ex-demo:#C4A4FF; --ex-demo-bg:#241536;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ex-paper);color:var(--ex-ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.font-display{font-family:var(--font-display);text-wrap:balance}
.font-mono,.tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
::selection{background:var(--ex-blue-100)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ex-line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.ex-card{background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:14px;box-shadow:var(--ex-shadow)}
.ex-input,.ex-select,.ex-textarea{width:100%;background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:9px;padding:8px 11px;font-size:13.5px;color:var(--ex-ink);font-family:inherit}
.ex-input:focus,.ex-select:focus,.ex-textarea:focus{outline:2px solid var(--ex-blue-400);outline-offset:0;border-color:var(--ex-blue-400)}
.ex-label{font-size:11.5px;font-weight:600;color:var(--ex-ink-soft);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.ex-btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .12s,background .12s;white-space:nowrap}
.ex-btn:active{filter:brightness(.92)}
.ex-btn-primary{background:var(--ex-blue-600);color:#fff}
.ex-btn-primary:hover{filter:brightness(1.08)}
.ex-btn-ghost{background:var(--ex-surface);border-color:var(--ex-line);color:var(--ex-ink)}
.ex-btn-ghost:hover{background:var(--ex-blue-50)}
.ex-btn-danger{background:var(--ex-bad-bg);color:var(--ex-bad)}
.ex-btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.ex-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.ex-pill-good{background:var(--ex-good-bg);color:var(--ex-good)}
.ex-pill-warn{background:var(--ex-warn-bg);color:var(--ex-warn)}
.ex-pill-bad{background:var(--ex-bad-bg);color:var(--ex-bad)}
.ex-pill-info{background:var(--ex-info-bg);color:var(--ex-info)}
.ex-pill-demo{background:var(--ex-demo-bg);color:var(--ex-demo)}
.ex-pill-neutral{background:var(--ex-line-soft);color:var(--ex-ink-soft)}
.ex-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ex-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ex-ink-soft);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--ex-line);white-space:nowrap}
.ex-table td{padding:11px 12px;border-bottom:1px solid var(--ex-line-soft);vertical-align:middle}
.ex-table tbody tr{transition:background .1s}
.ex-table tbody tr:hover{background:var(--ex-blue-50)}
.ex-nav-link{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ex-ink-soft)}
.ex-nav-link:hover{background:var(--ex-blue-50);color:var(--ex-ink)}
.ex-nav-link.active{background:var(--ex-blue-600);color:#fff}
.ex-nav-link.active svg{color:#fff}
.ex-modal-backdrop{position:fixed;inset:0;background:rgba(10,17,32,.5);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.ex-scrollbar-thin::-webkit-scrollbar{width:6px}
.ex-kanban-col{background:var(--ex-line-soft);border-radius:12px;padding:10px;min-width:250px}
.ex-kcard{background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--ex-shadow);cursor:pointer}
.ex-kcard:hover{border-color:var(--ex-blue-400)}
[hidden]{display:none!important}
.ex-fade-in{animation:exfade .18s ease}
@keyframes exfade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ex-toast{background:var(--ex-ink);color:var(--ex-paper);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--ex-shadow)}
:root[data-theme="dark"] .ex-toast, @media (prefers-color-scheme:dark){.ex-toast{background:var(--ex-surface-raised);border:1px solid var(--ex-line)}}
.ex-spark{stroke-width:2;fill:none}
.ex-badge-dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.ex-focus-ring:focus-visible{outline:2px solid var(--ex-blue-500);outline-offset:2px}
</style>
</head>

<script>
/* ====================================================================
   ENGAGE X BUSINESS OPERATING SYSTEM
   Single-file SPA. Backed by the Artifact db/assets/sample/downloads
   runtime capabilities. See EX.NOTES for build-scope disclosures.
==================================================================== */
const EX = {};
EX.NOTES = "Internal staff sign-in and client portal access codes are application-level gates (no per-viewer identity capability is available to this account) — good for controlled internal use, not a substitute for real credentialed auth.";

/* ---------------- CONFIG / SCHEMA / CONSTANTS ---------------- */
EX.uid = (p)=> (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
EX.now = ()=> Date.now();
EX.fmtDate = (ts)=> ts? new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
EX.fmtDateTime = (ts)=> ts? new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
EX.CURRENCIES = {INR:{symbol:'₹',locale:'en-IN'},AED:{symbol:'AED ',locale:'en-AE'},SAR:{symbol:'SAR ',locale:'en-SA'},KWD:{symbol:'KWD ',locale:'en-KW'},USD:{symbol:'$',locale:'en-US'}};
EX.fmtMoney = (n,ccy)=>{ ccy=ccy||'INR'; const c=EX.CURRENCIES[ccy]||EX.CURRENCIES.INR; n = Math.round((n||0));
  return c.symbol + n.toLocaleString(c.locale); };

EX.ROLES = {
  super_admin:{label:'Super Admin', group:'Leadership'},
  md:{label:'Managing Director (MD)', group:'Leadership'},
  ops_head:{label:'Operations Head / CEO', group:'Leadership'},
  dm_manager:{label:'Digital Marketing Manager', group:'Leadership'},
  hr:{label:'HR', group:'Leadership'},
  accounts:{label:'Accounts', group:'Leadership'},
  creative_head:{label:'Creative Head', group:'Leadership'},
  sales_exec:{label:'Sales Executive', group:'Sales & Delivery'},
  dme:{label:'Digital Marketing Executive', group:'Sales & Delivery'},
  graphic_designer:{label:'Graphic Designer', group:'Sales & Delivery'},
  video_editor:{label:'Video Editor', group:'Sales & Delivery'},
  videographer:{label:'Videographer', group:'Sales & Delivery'},
  intern:{label:'Intern', group:'Limited Access'},
  parttime:{label:'Part-Time Designer / Editor', group:'Limited Access'},
  outsourced_editor:{label:'Outsourced Video Editor', group:'Limited Access'},
};

// Role aliases: an MD has exactly the Super Admin's access; a Digital Marketing Manager has exactly the
// Operations Head's access. Everything permission-related goes through EX.effRole so no screen needs to
// know the extra role names. (The employee record keeps its real role for display.)
EX.ROLE_ALIAS = {md:'super_admin', dm_manager:'ops_head'};
EX.effRole = (r)=> EX.ROLE_ALIAS[r] || r;
// Who may delete tasks / clients etc: Super Admin + MD, Ops Head + Digital Marketing Manager, Creative Head.
EX.DELETE_ROLES = ['super_admin','ops_head','creative_head'];
EX.canDelete = ()=> EX.DELETE_ROLES.includes(EX.currentRole());
// ---- Explicit (raw-role) permissions. These deliberately look at the employee's REAL role, not the alias,
// because the management lists below are exact: MD, Operations Head / CEO and Super Admin only

// Roles whose designated reports (managerId chain) form the "digital marketing" line:
// DME's own interns are addressed as "Digital Marketing Intern" throughout, even though
// they share the generic 'intern' role value — they are distinguished by managerId.
EX.isDmIntern = function(emp){
  if(!emp || emp.role!=='intern') return false;
  const mgr = EX.get('employees').find(e=>e.id===emp.managerId);
  return !!(mgr && mgr.role==='dme');
};
// Creative Head's directly-managed team = interns/part-timers/video editors whose manager is the Creative Head (or, absent that, everyone in those roles who is not a DM intern) — used for scoping dashboards/attention/task-assignment.
EX.isCreativeTeamMember = function(emp, creativeHeadId){
  if(!emp) return false;
  if(!['intern','parttime','video_editor'].includes(emp.role)) return false;
  if(EX.isDmIntern(emp)) return false;
  if(creativeHeadId) return emp.managerId===creativeHeadId;
  return true;
};

// IMPORTANT: EX.dbReady flips true the moment the FIRST of the 23 collections
// finishes its initial load — not specifically 'employees'. Supabase answers
// each collection's query independently and in no guaranteed order, so on a
// real deployment a different, faster table can easily finish before
// 'employees' does. Code that needs to know "do we actually know the real
// employees list yet" (login matching, and the one-time first-admin
// bootstrap-completion below) must NOT use EX.dbReady for that — it must wait
// on EX.employeesReady instead, which is only set once the employees
// collection itself has delivered its first snapshot. Getting this wrong
// previously caused a real bug: EX.get('employees') returns [] both when
// there truly are zero employees AND when employees just hasn't loaded yet,
// and EX.maybeAutoCompleteBootstrap() could not tell those apart — on a slow
// or unlucky load order it would treat an existing workspace as brand new and
// re-run first-time setup (inserting a duplicate super_admin employee and
// resetting company config back to defaults) every time this happened,
// and show a permanently stuck "Finishing your workspace setup…" screen
// whenever it happened without the required pending-bootstrap data in
// localStorage (e.g. a normal login, not a fresh signup) to complete.
EX.employeesReady = false;

EX.watchCollection = function(name){
  try{
    EX.CAP.db.collection(name).onSnapshot((snap)=>{
      EX.data[name] = snap.docs.map(d=> Object.assign({id:d.id}, d.data()));
      EX.dbReady = true;
      if(name==='employees') EX.employeesReady = true;
      EX.scheduleRender();
    }, (err)=>{ console.warn('snapshot error', name, err); });
  }catch(e){ console.warn('watch failed', name, e); }
};

/* ---- Supabase-backed adapter, built to the exact same shape the rest of this app
   already expects from EX.CAP.db (a Firestore-like collection()/doc()/onSnapshot()
   interface) — this is the ONLY layer that changed to make the app self-hostable;
   every EX.get/add/patch/setId/remove/setConfig call above is untouched. ---- */
EX.mapSupabaseError = function(e){
  const msg = (e && e.message) || '';
  let code = 'unavailable';
  if(/JWT|api key|apikey/i.test(msg)) code = 'not_granted';
  else if(/permission denied|RLS|policy/i.test(msg)) code = 'revoked';
  else if(/invalid input|invalid_argument|out of range/i.test(msg)) code = 'invalid_argument';
  else if(/payload too large/i.test(msg)) code = 'resource_exhausted';
  return Object.assign(new Error(msg || 'Supabase request failed'), {code, message: msg});
};
EX.makeSupabaseDb = function(sb){
  function wrapCollection(name){
    return {
      async add(payload){
        const { data, error } = await sb.from(name).insert({ data: payload }).select('id').single();
        if(error) throw EX.mapSupabaseError(error);
        return { id: data.id };
      },
      doc(id){
        return {
          async set(payload){
            const { error } = await sb.from(name).upsert({ id, data: payload });
            if(error) throw EX.mapSupabaseError(error);
          },
          async update(payload){
            const { data: existing, error: selErr } = await sb.from(name).select('data').eq('id', id).maybeSingle();
            if(selErr) throw EX.mapSupabaseError(selErr);
            const merged = Object.assign({}, existing && existing.data, payload);
            const { error } = await sb.from(name).update({ data: merged, updated_at: new Date().toISOString() }).eq('id', id);
            if(error) throw EX.mapSupabaseError(error);
          },
          async delete(){
            const { error } = await sb.from(name).delete().eq('id', id);
            if(error) throw EX.mapSupabaseError(error);
          },
        };
      },
      onSnapshot(onNext, onError){
        // A fresh page load fires a SELECT + a realtime subscribe for all 23
        // collections at once; on a transient hiccup (cold Supabase project,
        // brief network blip) one of those 23 can fail its very first load.
        // Without a retry, that single collection would simply never reach
        // "loaded" until the whole page is refreshed — which, for the
        // 'employees' table specifically, is exactly what caused the "stuck
        // on Finishing your workspace setup" symptom in production. Retrying
        // a few times with backoff lets a transient failure recover on its
        // own instead of requiring a manual reload.
        async function load(attempt){
          attempt = attempt || 0;
          const { data, error } = await sb.from(name).select('id,data,created_at,updated_at').order('created_at', { ascending: true });
          if(error){
            if(attempt < 4){ setTimeout(()=> load(attempt+1), 1000 * Math.pow(2, attempt)); return; }
            onError && onError(EX.mapSupabaseError(error)); return;
          }
          onNext({ docs: (data||[]).map(r => ({ id: r.id, data: () => Object.assign({}, r.data, {
            _createdAt: r.created_at ? new Date(r.created_at).getTime() : undefined,
            _updatedAt: r.updated_at ? new Date(r.updated_at).getTime() : undefined,
          }) })) });
        }
        load();
        try{
          sb.channel('rt_'+name)
            .on('postgres_changes', { event:'*', schema:'public', table:name }, load)
            .subscribe();
        }catch(e){ console.warn('realtime subscribe failed for', name, e); }
      },
    };
  }
  return {
    collection: wrapCollection,
    doc(path){
      const idx = path.indexOf('/');
      const table = idx===-1 ? path : path.slice(0, idx);
      const id = idx===-1 ? null : path.slice(idx+1);
      return {
        async set(payload){
          const { error } = await sb.from(table).upsert({ id, data: payload });
          if(error) throw EX.mapSupabaseError(error);
        },
        async update(payload){
          const { data: existing, error: selErr } = await sb.from(table).select('data').eq('id', id).maybeSingle();
          if(selErr) throw EX.mapSupabaseError(selErr);
          const merged = Object.assign({}, existing && existing.data, payload);
          const { error } = await sb.from(table).update({ data: merged, updated_at: new Date().toISOString() }).eq('id', id);
          if(error) throw EX.mapSupabaseError(error);
        },
        onSnapshot(onNext, onError){
          async function load(){
            const { data, error } = await sb.from(table).select('data').eq('id', id).maybeSingle();
            if(error){ onError && onError(EX.mapSupabaseError(error)); return; }
            onNext({ exists: !!data, data: () => data && data.data });
          }
          load();
          try{
            sb.channel('rt_'+table+'_'+id)
              .on('postgres_changes', { event:'*', schema:'public', table, filter:`id=eq.${id}` }, load)
              .subscribe();
          }catch(e){ console.warn('realtime subscribe failed for', table, e); }
        },
      };
    },
  };
};
EX.makeSupabaseStorage = function(sb){
  const BUCKET = (window.EX_CONFIG && window.EX_CONFIG.STORAGE_BUCKET) || 'assets';
  return {
    async upload(file){
      const ext = ((file.name||'').split('.').pop() || 'bin').toLowerCase();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false, contentType: file.type || undefined });
      if(error) throw EX.mapSupabaseError(error);
      const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
      return { id: path, url: data && data.publicUrl };
    },
  };
};
EX.makeBrowserDownloads = function(){
  return {
    async save({filename, data}){
      let blob;
      if(typeof data==='string') blob = new Blob([data], {type: /\.csv$/i.test(filename||'') ? 'text/csv;charset=utf-8' : 'text/plain;charset=utf-8'});
      else if(data instanceof Uint8Array || data instanceof ArrayBuffer) blob = new Blob([data], {type: /\.pdf$/i.test(filename||'') ? 'application/pdf' : 'application/octet-stream'});
      else blob = new Blob([JSON.stringify(data)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'download.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
    },
  };
};
EX.makeAiClient = function(){
  async function callApi(body){
    let res;
    try{ res = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    catch(e){ throw {code:'unavailable', message:'Could not reach the AI service.'}; }
    if(!res.ok){
      let err = {}; try{ err = await res.json(); }catch(_){ }
      throw { code: err.code || 'unavailable', message: err.error || ('AI request failed ('+res.status+')') };
    }
    return res.json();
  }
  async function sample(input, opts){
    opts = opts || {};
    const messages = Array.isArray(input) ? input.map(m=> typeof m==='string'? {role:'user', content:m} : m) : [{role:'user', content:String(input)}];
    const { text } = await callApi({ mode:'text', messages });
    if(typeof opts.onText === 'function'){
      // This proxy is request/response (not a live token stream), so we reveal the
      // finished answer progressively to keep the existing "typing" UI feeling alive.
      const t = text || '';
      const step = Math.max(10, Math.round(t.length/50));
      for(let i=step;i<t.length;i+=step){ opts.onText({text:t.slice(0,i)}); await new Promise(r=>setTimeout(r,14)); }
      opts.onText({text:t});
    }
    return {text};
  }
  sample.json = async function(input, opts){
    const prompt = Array.isArray(input) ? input.map(m=>(m&&m.role?m.role+': ':'')+(m&&m.content!==undefined?m.content:m)).join('\n') : String(input);
    const { json } = await callApi({ mode:'json', prompt });
    return json;
  };
  return sample;
};

EX.sb = null;
EX.initDb = async function(){
  const cfg = window.EX_CONFIG || {};
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase){
    EX.dbOffline = true; EX.scheduleRender(); return;
  }
  try{
    EX.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    EX.CAP.db = EX.makeSupabaseDb(EX.sb);
  }catch(e){ console.warn('Supabase init failed', e); EX.CAP.db = null; EX.sb = null; }
  if(!EX.CAP.db){ EX.dbOffline = true; EX.scheduleRender(); return; }
  // IMPORTANT: wait for the Supabase Auth session to finish loading/attaching to
  // this client BEFORE subscribing to any table. supabase-js restores a
  // persisted session asynchronously in the background after createClient(), and
  // a request made before that finishes goes out as the anon role — which, under
  // this app's Row Level Security (authenticated-only), silently comes back
  // empty rather than erroring. That previously caused two real, confusing bugs:
  // (1) a page refresh could see an empty employees list for a moment, decide
  // the signed-in employee record was "missing", and sign the user straight back
  // out; (2) a realtime channel subscribed before the session attached could
  // miss postgres_changes events (e.g. a just-added employee not appearing until
  // something else — like signing out and back in — re-established it). A 6s
  // cap keeps a slow/unresponsive Supabase Auth check from blocking the whole
  // app from loading at all.
  await Promise.race([ EX.initAuth(), new Promise(resolve=>setTimeout(resolve, 6000)) ]);
  EX.COLLECTIONS.forEach(EX.watchCollection);
  // config singleton doc
  try{
    EX.CAP.db.doc('config/company').onSnapshot((snap)=>{
      EX.data.companyConfig = snap.exists ? snap.data() : null;
      EX.scheduleRender();
    });
  }catch(e){}
};

EX.copyToClipboard = async function(data, label){
  if(typeof data!=='string' && !(data && typeof data==='object' && !(data instanceof Uint8Array) && !(data instanceof ArrayBuffer))) return false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(typeof data==='string'?data:JSON.stringify(data));
      EX.toast('Copied '+(label||'content')+' to clipboard instead.', 'good');
      return true;
    }
  }catch(e){ /* clipboard blocked too — nothing more we can do from here */ }
  return false;
};
EX.downloadFile = async function(filename, data){
  if(!EX.CAP.downloads){
    const copied = await EX.copyToClipboard(data, filename);
    if(!copied) EX.toast('Downloads are not available in this view, and clipboard access was also blocked.', 'bad');
    return;
  }
  try{
    await EX.CAP.downloads.save({filename, data});
    EX.toast('Saved '+filename, 'good');
  }catch(e){
    if(e && e.code==='declined') return;
    const reason = (e && e.code && EX.DOWNLOADS_ERR_COPY[e.code]) || (e && e.message) || 'an unexpected error occurred';
    const copied = await EX.copyToClipboard(data, filename);
    EX.toast(`Download failed — ${reason}.${copied?' Copied the content to your clipboard instead.':''}`, 'bad');
  }
};
EX.toCsv = function(rows, columns){
  const esc = (v)=>{ v = v===undefined||v===null?'':String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  const head = columns.map(c=>esc(c.label)).join(',');
  const body = rows.map(r=> columns.map(c=> esc(typeof c.get==='function'? c.get(r) : r[c.key])).join(',')).join('\n');
  return head+'\n'+body;
};

  const map = {'₹':'Rs.','–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85',' ':' ','→':'->','←':'<-','✓':'v','✔':'v','×':'\xd7'};
  let out = '';
  for(const ch of String(str===undefined||str===null?'':str)){
    if(map[ch]!==undefined){ out += map[ch]; continue; }
    const code = ch.codePointAt(0);
    if(code===10||code===13||code===9){ out += ' '; continue; }
    out += (code>=32 && code<=255) ? ch : '?';
  }
  return out;
};
EX.pdfTextWidth = function(str, size, bold){
  const tbl = bold? EX.PDF_W_BOLD : EX.PDF_W_REG;
  const s = EX.pdfEncode(str); let w = 0;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); w += (c>=32 && c<=126)? tbl[c-32] : 556; }
  return w*size/1000;
};
EX.pdfWrap = function(str, maxW, size, bold){
  const lines = [];
  String(str===undefined||str===null?'':str).split(/\r?\n/).forEach(par=>{
    const words = par.split(/\s+/).filter(Boolean);
    if(!words.length){ lines.push(''); return; }
    let cur = '';
    words.forEach(w=>{
      // hard-split a single word that is wider than the whole column
      while(EX.pdfTextWidth(w,size,bold) > maxW){
        let cut = w.length-1; while(cut>1 && EX.pdfTextWidth(w.slice(0,cut),size,bold) > maxW) cut--;
        if(cur){ lines.push(cur); cur=''; }
        lines.push(w.slice(0,cut)); w = w.slice(cut);
      }
      const test = cur? cur+' '+w : w;
      if(EX.pdfTextWidth(test,size,bold) <= maxW) cur = test; else { lines.push(cur); cur = w; }
    });
    if(cur) lines.push(cur);
  });
  return lines.length? lines : [''];
};
EX.b64ToBytes = function(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
EX.jpegSize = function(u8){
  let i = 2;
  while(i < u8.length){
    if(u8[i]!==0xFF){ i++; continue; }
    const m = u8[i+1];
    if(m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC) return {h:(u8[i+5]<<8)|u8[i+6], w:(u8[i+7]<<8)|u8[i+8]};
    i += 2 + ((u8[i+2]<<8)|u8[i+3]);
  }
  return {w:320,h:320};
};

EX.PDF = function(opts){
  opts = opts||{};
  const W = 595.28, H = 841.89, M = 40;
  const logo = opts.logoB64 ? EX.b64ToBytes(opts.logoB64) : null;
  const logoDim = logo? EX.jpegSize(logo) : null;
  const doc = {pages:[], title: opts.title||'Report', subtitle: opts.subtitle||'', y:0};
  const BRAND = [30,79,214], INK=[14,26,43], SOFT=[90,102,122], LINE=[218,224,238];
  const num = (n)=> (Math.round(n*100)/100).toString();
  const hex = (s)=>{ let o=''; for(let i=0;i<s.length;i++) o += s.charCodeAt(i).toString(16).padStart(2,'0'); return o; };
  const col = (c)=> c.map(v=>num(v/255)).join(' ');
  function newPage(){
    const p = {ops:[]}; doc.pages.push(p);
    const first = doc.pages.length===1;
    // header band with the Engage X logo on EVERY page
    const ls = first? 54 : 34;
    if(logo) p.ops.push(`q ${num(ls)} 0 0 ${num(ls)} ${num(M)} ${num(H-M-ls+8)} cm /Im1 Do Q`);
    const tx = M + (logo? ls+12 : 0);
    p.ops.push(`BT /F2 ${first?17:12} Tf ${col(INK)} rg ${num(tx)} ${num(H-M-(first?16:10))} Td <${hex(EX.pdfEncode(doc.title))}> Tj ET`);
    if(doc.subtitle) p.ops.push(`BT /F1 ${first?9.5:8.5} Tf ${col(SOFT)} rg ${num(tx)} ${num(H-M-(first?32:22))} Td <${hex(EX.pdfEncode(doc.subtitle))}> Tj ET`);
    const lineY = H-M-ls+2;
    p.ops.push(`${col(BRAND)} RG 1.2 w ${num(M)} ${num(lineY)} m ${num(W-M)} ${num(lineY)} l S`);
    doc.y = (H-lineY) + 16;
  }
  function ensure(h){ if(!doc.pages.length) newPage(); if(doc.y + h > H - M - 22) newPage(); }
  doc.W = W; doc.H = H; doc.M = M; doc.contentW = W-2*M;
  doc.text = function(str, x, y, o){
    o = o||{}; const size = o.size||10, bold = !!o.bold, color = o.color||INK;
    let px = x;
    if(o.align==='right') px = x - EX.pdfTextWidth(str,size,bold);
    else if(o.align==='center') px = x - EX.pdfTextWidth(str,size,bold)/2;
    const p = doc.pages[doc.pages.length-1];
    p.ops.push(`BT /F${bold?2:1} ${size} Tf ${col(color)} rg ${num(px)} ${num(H-y)} Td <${hex(EX.pdfEncode(str))}> Tj ET`);
  };
  doc.rect = function(x,y,w,h,fill,stroke){
    const p = doc.pages[doc.pages.length-1];
    let s = '';
    if(fill) s += `${col(fill)} rg `;
    if(stroke) s += `${col(stroke)} RG 0.6 w `;
    p.ops.push(`${s}${num(x)} ${num(H-y-h)} ${num(w)} ${num(h)} re ${fill&&stroke?'B':fill?'f':'S'}`);
  };
  doc.hline = function(y){ const p = doc.pages[doc.pages.length-1]; p.ops.push(`${col(LINE)} RG 0.6 w ${num(M)} ${num(H-y)} m ${num(W-M)} ${num(H-y)} l S`); };
  doc.spacer = function(h){ if(!doc.pages.length) newPage(); doc.y += h; };
  doc.heading = function(str){
    ensure(34); doc.y += 8;
    doc.rect(M, doc.y-1, 3, 15, BRAND);
    doc.text(str, M+9, doc.y+11, {size:12, bold:true});
    doc.y += 24;
  };
  doc.paragraph = function(str, o){
    o = o||{}; const size = o.size||10, lead = size*1.4, w = (o.width||doc.contentW);
    const lines = EX.pdfWrap(str, w, size, !!o.bold);
    lines.forEach(l=>{ ensure(lead); doc.text(l, M+(o.indent||0), doc.y+size, {size, bold:!!o.bold, color:o.color||INK}); doc.y += lead; });
    doc.y += (o.after===undefined? 4 : o.after);
  };
  // two-column "label ..... value" rows, laid out in a grid of `cols` cards-worth of stats
  doc.stats = function(items, cols){
    cols = cols||3; const gap = 8, cw = (doc.contentW - gap*(cols-1))/cols, ch = 46;
    for(let i=0;i<items.length;i+=cols){
      ensure(ch+6);
      items.slice(i,i+cols).forEach((it,j)=>{
        const x = M + j*(cw+gap);
        doc.rect(x, doc.y, cw, ch, [243,246,254], LINE);
        doc.text(String(it.label).toUpperCase(), x+8, doc.y+14, {size:7, bold:true, color:SOFT});
        doc.text(String(it.value), x+8, doc.y+34, {size:15, bold:true, color:it.color||INK});
      });
      doc.y += ch+8;
    }
  };
  doc.progress = function(label, done, total, o){
    o = o||{}; ensure(26);
    const pct = total>0? Math.max(0,Math.min(1,done/total)) : 0;
    doc.text(label, M, doc.y+9, {size:9, bold:true});
    doc.text(`${done} / ${total}  (${Math.round(pct*100)}%)`, W-M, doc.y+9, {size:9, align:'right', color:SOFT});
    doc.rect(M, doc.y+14, doc.contentW, 6, [228,233,244]);
    if(pct>0) doc.rect(M, doc.y+14, doc.contentW*pct, 6, o.color||[14,159,110]);
    doc.y += 28;
  };
  // cols: [{label, w (relative), align}], rows: [[cell,...]] (cells are strings/numbers)
  doc.table = function(cols, rows, o){
    o = o||{}; const size = o.size||8.5, padX = 5, padY = 4, lead = size*1.32;
    const tot = cols.reduce((s,c)=>s+(c.w||1),0);
    const widths = cols.map(c=> doc.contentW*(c.w||1)/tot);
    const drawHead = ()=>{
      ensure(22);
      doc.rect(M, doc.y, doc.contentW, 18, BRAND);
      let x = M;
      cols.forEach((c,i)=>{ doc.text(c.label, c.align==='right'? x+widths[i]-padX : x+padX, doc.y+12, {size:size-0.5, bold:true, color:[255,255,255], align:c.align==='right'?'right':'left'}); x += widths[i]; });
      doc.y += 18;
    };
    drawHead();
    if(!rows.length){ ensure(24); doc.text(o.empty||'Nothing to show', M+padX, doc.y+14, {size, color:SOFT}); doc.y += 24; doc.hline(doc.y); return; }
    rows.forEach((r,ri)=>{
      const cells = cols.map((c,i)=> EX.pdfWrap(r[i]===undefined||r[i]===null?'':String(r[i]), widths[i]-2*padX, size, !!r.__bold));
      const rh = Math.max(...cells.map(l=>l.length))*lead + 2*padY;
      if(doc.y + rh > H - M - 22){ newPage(); drawHead(); }
      if(ri%2===1) doc.rect(M, doc.y, doc.contentW, rh, [247,249,253]);
      let x = M;
      cells.forEach((lines,i)=>{
        lines.forEach((l,li)=> doc.text(l, cols[i].align==='right'? x+widths[i]-padX : x+padX, doc.y+padY+size+li*lead-1, {size, bold:!!r.__bold, align:cols[i].align==='right'?'right':'left'}));
        x += widths[i];
      });
      doc.y += rh;
      doc.hline(doc.y);
    });
    doc.y += 8;
  };
  doc.build = function(){
    if(!doc.pages.length) newPage();
    const n = doc.pages.length;
    // footers (need the total page count, so they are added last)
    doc.pages.forEach((p,i)=>{
      p.ops.push(`${col(LINE)} RG 0.6 w ${num(M)} ${num(M-6)} m ${num(W-M)} ${num(M-6)} l S`);
      p.ops.push(`BT /F1 7.5 Tf ${col(SOFT)} rg ${num(M)} ${num(M-18)} Td <${hex(EX.pdfEncode('Engage X Business Solutions  |  Confidential  |  Generated '+new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})))}> Tj ET`);
      const pg = `Page ${i+1} of ${n}`;
      p.ops.push(`BT /F1 7.5 Tf ${col(SOFT)} rg ${num(W-M-EX.pdfTextWidth(pg,7.5,false))} ${num(M-18)} Td <${hex(pg)}> Tj ET`);
    });
    // ---- serialise objects ----
    const enc = new TextEncoder();
    const parts = []; let offset = 0; const xref = [];
    const pushStr = (s)=>{ const b = enc.encode(s); parts.push(b); offset += b.length; };
    const pushBytes = (b)=>{ parts.push(b); offset += b.length; };
    const objs = []; // {id, write()}
    // object ids: 1 catalog, 2 pages, 3 font reg, 4 font bold, 5 image (if any), then page+content pairs
    const imgId = logo? 5 : null; const firstPageId = logo? 6 : 5;
    const pageIds = doc.pages.map((_,i)=> firstPageId + i*2);
    pushStr('%PDF-1.4\n%\xe2\xe3\xcf\xd3\n');
    const begin = (id)=>{ xref[id] = offset; pushStr(`${id} 0 obj\n`); };
    begin(1); pushStr(`<< /Type /Catalog /Pages 2 0 R >>\nendobj\n`);
    begin(2); pushStr(`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${n} >>\nendobj\n`);
    begin(3); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n`);
    begin(4); pushStr(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n`);
    if(logo){
      begin(5); pushStr(`<< /Type /XObject /Subtype /Image /Width ${logoDim.w} /Height ${logoDim.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${logo.length} >>\nstream\n`);
      pushBytes(logo); pushStr('\nendstream\nendobj\n');
    }
    doc.pages.forEach((p,i)=>{
      const pid = pageIds[i], cid = pid+1;
      const content = p.ops.join('\n');
      begin(pid); pushStr(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num(W)} ${num(H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${logo?` /XObject << /Im1 ${imgId} 0 R >>`:''} >> /Contents ${cid} 0 R >>\nendobj\n`);
      const cb = enc.encode(content);
      begin(cid); pushStr(`<< /Length ${cb.length} >>\nstream\n`); pushBytes(cb); pushStr('\nendstream\nendobj\n');
    });
    const maxId = firstPageId + n*2 - 1;
    const xrefPos = offset;
    pushStr(`xref\n0 ${maxId+1}\n0000000000 65535 f \n`);
    for(let id=1; id<=maxId; id++) pushStr(String(xref[id]).padStart(10,'0')+' 00000 n \n');
    pushStr(`trailer\n<< /Size ${maxId+1} /Root 1 0 R /Info << /Title <${hex(EX.pdfEncode(doc.title))}> /Producer (Engage X OS) >> >>\nstartxref\n${xrefPos}\n%%EOF`);
    let total = 0; parts.forEach(b=> total += b.length);
    const out = new Uint8Array(total); let pos = 0; parts.forEach(b=>{ out.set(b,pos); pos += b.length; });
    return out;
  };
  newPage();
  return doc;
};

/* ---------------- STATE / AUTH / SESSION ---------------- */
EX.session = { mode:null, employeeId:null, portalClientId:null };
EX.LS_KEY = 'ex_os_session_v1';

EX.saveSessionLocal = function(){
  try{ localStorage.setItem(EX.LS_KEY, JSON.stringify(EX.session)); }catch(e){}
};
EX.restoreSessionLocal = function(){
  try{
    const raw = localStorage.getItem(EX.LS_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && s.mode) EX.session = s;
  }catch(e){}
};

EX.currentEmployee = ()=> EX.session.employeeId ? EX.byId('employees', EX.session.employeeId) : null;
EX.currentRole = ()=>{ const e = EX.currentEmployee(); return e ? EX.effRole(e.role) : null; };
EX.can = (navKey)=> EX.session.mode==='staff' && EX.navAllowed(EX.currentRole(), navKey);

// ---- Real per-employee login (Supabase Auth) ----
// EX.authEmail is the email of whoever is actually signed in to Supabase Auth
// right now (null if nobody is). EX.session (above) is the app's own notion of
// "which employee record is active" — EX.render() keeps the two in sync below:
// as soon as an authenticated email matches an employee record, that employee
// becomes the active session automatically; there is no separate "pick your
// profile" step anymore.
EX.authEmail = null;
EX.authReady = false;
EX.initAuth = async function(){
  if(!EX.sb) return;
  EX.sb.auth.onAuthStateChange((_event, session)=>{
    EX.authEmail = (session && session.user && session.user.email) || null;
    EX.authReady = true;
    EX.maybeAutoCompleteBootstrap();
    EX.scheduleRender();
  });
  try{
    const { data } = await EX.sb.auth.getSession();
    EX.authEmail = (data && data.session && data.session.user && data.session.user.email) || null;
  }catch(e){ console.warn('getSession failed', e); }
  EX.authReady = true;
  EX.maybeAutoCompleteBootstrap();
  EX.scheduleRender();
};
// Finds the employee record matching EX.authEmail (if any) and makes it the
// active session. Called from EX.render() on every render while signed in to
// Supabase Auth but not yet mapped to an employee, so it catches the moment
// either the auth session or the employees list becomes available (whichever
// arrives second).
EX.syncSessionFromAuth = function(){
  if(!EX.authEmail || !EX.employeesReady) return;
  const email = EX.authEmail.toLowerCase();
  const emp = EX.get('employees').find(e=> (e.email||'').toLowerCase()===email);
  if(emp && (EX.session.mode!=='staff' || EX.session.employeeId!==emp.id)){
    EX.session = {mode:'staff', employeeId:emp.id, portalClientId:null};
    EX.saveSessionLocal();
    EX.addAudit('Signed in', 'employees', emp.id, null, null);
  }
};
// ---- Finishing first-time bootstrap after a deferred/confirmed signup ----
// EX.submitBootstrap (below) can't always create the first employee record
// right when the "Create workspace" form is submitted: if the Supabase
// project requires email confirmation, signUp() returns no active session yet,
// and Row Level Security correctly refuses an unauthenticated write — trying
// to write anyway would throw. So bootstrap only writes the employee record
// once a real session actually exists; EX.PENDING_BOOTSTRAP_KEY remembers the
// name they typed in the meantime, and this function finishes the job the
// moment a real, matching Supabase Auth session shows up (confirmation click,
// or a plain sign-in) for a workspace that still has zero employees.
EX.PENDING_BOOTSTRAP_KEY = 'ex_pending_bootstrap_v1';
EX.completeBootstrap = async function(email, name){
  await EX.add('employees', {name: name || (email.split('@')[0]), email, role:'super_admin', department:'Leadership', status:'Active', employmentType:'Full-time', joiningDate:EX.now(), skills:[], managerId:null});
  await EX.setConfig({name:'Engage X Business Solutions', createdAt:EX.now(), baseCurrency:'INR', countries:['India','UAE','Saudi Arabia','Kuwait'], reminderSchedule:[7,3,1,0,-1,-3,-7], bank:{}, qrAssetId:null, taxLabel:'GST', taxRate:18});
  try{ localStorage.removeItem(EX.PENDING_BOOTSTRAP_KEY); }catch(e){}
};
// IMPORTANT: this is the ONLY place that's allowed to call EX.completeBootstrap.
// There used to be two separate call sites — EX.submitBootstrap called
// EX.completeBootstrap directly right after signUp() returned a session, and
// EX.maybeAutoCompleteBootstrap (triggered by the onAuthStateChange listener)
// called it too, guarded by EX._bootstrapCompleting. In a real Supabase
// client, the SIGNED_IN auth event from signUp() can fire (and start this
// function running) BEFORE signUp()'s own promise resolves back in
// EX.submitBootstrap — so both call sites could race, each seeing zero
// employees, and both insert a super_admin record: every brand-new workspace
// could silently end up with two duplicate admin accounts. Routing both
// triggers through this single guarded function (checked synchronously,
// before any `await`) makes the second caller see EX._bootstrapCompleting
// already true, or the employee already inserted, and back off.
EX._bootstrapCompleting = false;
EX.completeBootstrapOnce = async function(email, nameHint){
  if(!email) return;
  if(EX.get('employees').length > 0) return; // already done — nothing left to finish
  if(EX._bootstrapCompleting) return;
  EX._bootstrapCompleting = true;
  try{
    let pendingName = nameHint || null;
    if(!pendingName){
      try{
        const raw = localStorage.getItem(EX.PENDING_BOOTSTRAP_KEY);
        if(raw){
          const p = JSON.parse(raw);
          if(p && p.email && p.email.toLowerCase()===email.toLowerCase()) pendingName = p.name;
        }
      }catch(e){}
    }
    await EX.completeBootstrap(email, pendingName);
  }catch(e){
    console.warn('bootstrap completion failed', e);
  }finally{
    EX._bootstrapCompleting = false;
  }
};
EX.maybeAutoCompleteBootstrap = async function(){
  if(!EX.authEmail || !EX.employeesReady) return;
  await EX.completeBootstrapOnce(EX.authEmail);
};
EX.signOut = function(){
  if(EX.sb){ try{ EX.sb.auth.signOut(); }catch(e){} }
  EX.authEmail = null;
  EX.session = {mode:null, employeeId:null, portalClientId:null};
  EX.saveSessionLocal();
  EX.route('');
};
EX.enterPortalPreview = function(clientId){
  EX.session.portalClientId = clientId;
  EX.session.priorMode = EX.session.mode;
  EX.session.mode = 'portal';
  EX.saveSessionLocal();
  EX.route('portal-dashboard');
};
EX.exitPortalPreview = function(){
  EX.session.mode = EX.session.priorMode || 'staff';
  EX.session.portalClientId = null;
  EX.saveSessionLocal();
  EX.route('clients');
};

EX.renderSignIn = function(){
  const emps = EX.get('employees');
  if(!EX.dbReady && !EX.dbOffline){
    return `<div class="min-h-screen flex items-center justify-center"><div class="text-center">
      ${EX.spinner()}<div class="mt-3 text-sm" style="color:var(--ex-ink-soft)">Connecting to Engage X workspace…</div></div></div>`;
  }
  if(EX.dbOffline){
    return `<div class="min-h-screen flex items-center justify-center p-6"><div class="ex-card p-8 max-w-md text-center">
      ${EX.icon('alert','w-8 h-8 mx-auto mb-3')} <h2 class="font-display text-lg font-bold mb-2">Workspace database unavailable</h2>
      <p class="text-sm" style="color:var(--ex-ink-soft)">This deployment could not connect to Supabase. Check that <code>config.js</code> has a valid <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>, that the schema from <code>supabase/schema.sql</code> has been run, and that your network can reach Supabase.</p></div></div>`;
  }
  const hero = `
    <div class="hidden lg:flex flex-col justify-between p-12 w-[42%] text-white" style="background:linear-gradient(160deg,var(--ex-blue-900),#0B2D6B)">
      <div class="flex items-center gap-3 font-display font-bold text-2xl">${EX.brandMark(true,true)}<span>Engage X<span class="block text-xs font-normal opacity-70 tracking-wide">Business Solutions</span></span></div>
      <div>
        <div class="text-3xl font-display font-bold leading-tight mb-4">The operating system<br/>behind your growth.</div>
        <p class="text-sm opacity-80 max-w-sm">Sales, delivery, finance, clients and AI — one connected system for Engage X Business Solutions, across India, UAE, Saudi Arabia and Kuwait.</p>
      </div>
      <div class="text-xs opacity-60">Secured by individual employee logins</div>
    </div>`;
  // Waiting on a confirmation email after first-time bootstrap signup.
  if(EX.ui.bootstrapNeedsConfirm){
    return `<div class="min-h-screen flex">${hero}<div class="flex-1 flex items-center justify-center p-6 sm:p-10"><div class="w-full max-w-lg">
      <div class="lg:hidden flex items-center gap-3 font-display font-bold text-xl mb-8">${EX.brandMark(false,true)}Engage X</div>
      <div class="ex-card p-6 text-center">
        ${EX.icon('info','w-8 h-8 mx-auto mb-3')}
        <h2 class="font-display text-lg font-bold mb-2">Check your email</h2>
        <p class="text-sm mb-4" style="color:var(--ex-ink-soft)">We've created your workspace and your account for <b>${EX.ui.bootstrapNeedsConfirm}</b>. Supabase needs you to confirm that address before you can sign in — check your inbox (and spam folder) for a confirmation email, then come back and sign in below.</p>
        <button onclick="EX.ui.bootstrapNeedsConfirm=null;EX.scheduleRender()" class="ex-btn ex-btn-primary">Back to sign in</button>
      </div>
    </div></div></div>`;
  }
  // Signed in to Supabase Auth, but no employee record uses this email.
  if(EX.authEmail){
    const email = EX.authEmail.toLowerCase();
    const matched = EX.get('employees').find(e=> (e.email||'').toLowerCase()===email);
    if(!matched){
      if(!EX.employeesReady){
        // The employees table itself hasn't delivered its first snapshot yet —
        // EX.dbReady can already be true from a different, faster collection,
        // so this is NOT yet a reliable signal that the workspace is empty.
        // Just keep waiting for the real employees list; EX.scheduleRender()
        // fires again the moment it arrives.
        return `<div class="min-h-screen flex items-center justify-center"><div class="text-center">
          ${EX.spinner()}<div class="mt-3 text-sm" style="color:var(--ex-ink-soft)">Loading your workspace…</div></div></div>`;
      }
      if(emps.length===0){
        // Employees list has genuinely loaded and is empty: a brand-new
        // workspace with a real signed-in session is mid auto-bootstrap-
        // completion (EX.maybeAutoCompleteBootstrap) — not an error, just a
        // moment of work in progress.
        return `<div class="min-h-screen flex items-center justify-center"><div class="text-center">
          ${EX.spinner()}<div class="mt-3 text-sm" style="color:var(--ex-ink-soft)">Finishing your workspace setup…</div></div></div>`;
      }
      return `<div class="min-h-screen flex">${hero}<div class="flex-1 flex items-center justify-center p-6 sm:p-10"><div class="w-full max-w-lg">
        <div class="lg:hidden flex items-center gap-3 font-display font-bold text-xl mb-8">${EX.brandMark(false,true)}Engage X</div>

          ${EX.icon('alert','w-8 h-8 mx-auto mb-3')}

          <button onclick="EX.signOut()" class="ex-btn ex-btn-ghost">Sign out</button>
        </div>
      </div></div></div>`;
    }
    // matched: EX.render() will pick this up via EX.syncSessionFromAuth() and
    // move past the sign-in screen entirely — nothing further to render here.
  }
  const hasEmployees = emps.length > 0;
  // Recovery escape hatch: if a first "Create workspace" attempt got partway
  // through (e.g. the Supabase account was created but confirming email /
  // finishing setup was interrupted), trying to bootstrap again just fails
  // with "already registered". Signing in with those same credentials instead

  const showLogin = hasEmployees || EX.ui.showLoginInstead;

    </form>
  </div>`;
  return `<div class="min-h-screen flex">
    ${hero}
    <div class="flex-1 flex items-center justify-center p-6 sm:p-10">
      <div class="w-full max-w-lg">
        <div class="lg:hidden flex items-center gap-3 font-display font-bold text-xl mb-8">${EX.brandMark(false,true)}Engage X</div>

        ${showLogin ? loginForm : EX.renderBootstrap()}
        ${!hasEmployees ? `<div class="mt-3 text-center"><button onclick="EX.ui.showLoginInstead=!EX.ui.showLoginInstead;EX.scheduleRender()" class="text-xs underline" style="color:var(--ex-ink-soft)">${EX.ui.showLoginInstead? '← Back to creating the first account' : 'Already started creating an account? Sign in instead'}</button></div>` : ''}

EX.renderBootstrap = function(){
  return `<div class="ex-card p-5">
    <div class="font-semibold text-sm mb-3">Create the first Super Admin login</div>
    <form onsubmit="EX.submitBootstrap(event)" class="space-y-3">
      <div><label class="ex-label">Full name</label><input required name="name" class="ex-input" placeholder="e.g. Aarav Mehta"/></div>
      <div><label class="ex-label">Email</label><input required type="email" name="email" class="ex-input" placeholder="you@engagex.co" autocomplete="username"/></div>
      <div><label class="ex-label">Password</label><input required type="password" name="password" minlength="8" class="ex-input" placeholder="At least 8 characters" autocomplete="new-password"/></div>
      ${EX.ui.bootstrapError? `<div class="text-xs" style="color:var(--ex-bad)">${EX.ui.bootstrapError}</div>` : ''}
      <button class="ex-btn ex-btn-primary w-full justify-center">${EX.icon('arrow-right','w-4 h-4')} Create workspace</button>
    </form>
  </div>`;

EX.submitBootstrap = async function(ev){
  ev.preventDefault();
  if(!EX.sb){ EX.toast('Not connected to the workspace database.', 'bad'); return; }
  const fd = new FormData(ev.target);
  const name = fd.get('name');
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  EX.ui.bootstrapError = null;
  // Remember the name they typed BEFORE calling signUp(), not after: signUp()
  // can fire its own SIGNED_IN auth event (which tries to auto-complete
  // bootstrap) before signUp()'s own promise resolves back here — see
  // EX.completeBootstrapOnce. If that race wins, it looks up the pending name
  // from localStorage, so that name needs to already be on disk or the
  // workspace gets created with a name guessed from the email address instead
  // of what was actually typed in this form.
  // NOTE: deliberately NOT cleared if signUp() below fails — an "already
  // registered" error on retry (the exact trap this screen recovers from)
  // means a previous attempt's pending data is likely still sitting here and
  // still needed by the "Sign in instead" recovery path; wiping it on this
  // retry's own failure would throw away the originally-typed name for no
  // reason, same bug as not saving it early enough.
  try{ localStorage.setItem(EX.PENDING_BOOTSTRAP_KEY, JSON.stringify({email, name})); }catch(e){}
  let signUpData = null;
  try{
    const { data, error } = await EX.sb.auth.signUp({ email, password });
    if(error){ EX.ui.bootstrapError = error.message || 'Could not create your login.'; EX.scheduleRender(); return; }
    signUpData = data;
  }catch(e){
    EX.ui.bootstrapError = 'Could not create your login.'; EX.scheduleRender(); return;
  }
  if(signUpData && signUpData.session){
    // We already have a real, active session (email confirmation is off, or
    // wasn't required) — finish right away rather than waiting for the next
    // auth-state event. Goes through the same guarded EX.completeBootstrapOnce
    // as the auto-complete path (not EX.completeBootstrap directly) because
    // signUp()'s own SIGNED_IN auth event can already be racing to finish
    // bootstrap on its own — see the comment on EX.completeBootstrapOnce.
    await EX.completeBootstrapOnce(email, name);
  }else{
    // Supabase project requires email confirmation — there's no active session
    // yet, so writing the employee record now would be rejected by Row Level
    // Security (correctly — an unconfirmed signup isn't a real signed-in user
    // yet). EX.maybeAutoCompleteBootstrap() finishes this the moment they
    // confirm and a real session shows up.
    EX.ui.bootstrapNeedsConfirm = email;
  }
  EX.scheduleRender();
};
EX.submitLogin = async function(ev){
  ev.preventDefault();
  if(!EX.sb){ EX.toast('Not connected to the workspace database.', 'bad'); return; }
  const fd = new FormData(ev.target);
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  EX.ui.loginError = null;
  EX.ui.loginBusy = true;
  EX.scheduleRender();
  try{
    const { error } = await EX.sb.auth.signInWithPassword({ email, password });
    if(error) EX.ui.loginError = /invalid/i.test(error.message||'') ? 'Incorrect email or password.' : (error.message || 'Sign-in failed.');
  }catch(e){
    EX.ui.loginError = 'Sign-in failed — please try again.';
  }
  EX.ui.loginBusy = false;
  EX.scheduleRender();
};

/* ---------------- GLOBAL ERROR SURFACING ----------------
   Every write goes through EX.CAP.db (a Claude Artifact capability call), which can
   reject with a stable error code. Previously nothing here awaited those rejections
   with a catch, so a failed save just did nothing visible — it looked like a broken
   button. This maps known error codes to plain-English toasts and, as a safety net,
   catches ANY promise rejection anywhere in the app that nothing else handled. */
EX.DB_ERR_COPY = {
  invalid_argument: 'some of the data entered looks invalid — please check the fields and try again',
  resource_exhausted: 'this record has too much data attached — try trimming it and saving again',
  quota_exceeded: 'this workspace has reached its data limit — please remove old records first',
  unavailable: 'the workspace database is temporarily unavailable — please try again in a moment',
  revoked: 'database access was denied — check the Supabase row-level-security policies for this table',
  not_granted: 'this needs database access that has not been configured yet — check SUPABASE_URL/SUPABASE_ANON_KEY in config.js',
  capability_disabled: 'database features are currently disabled for this workspace',
  capability_removed: 'database features were removed — ask an admin to re-enable them',
  transform_error: 'that data could not be saved in this format — please check the fields and try again',
  not_declared: 'this feature is not available in this view',
};
EX.friendlyErrorMessage = function(e, action){
  const prefix = action ? (action+' failed — ') : 'That did not work — ';
  const code = e && e.code;
  if(code && EX.DB_ERR_COPY[code]) return prefix + EX.DB_ERR_COPY[code] + '.';
  if(e && e.message) return prefix + e.message;
  return prefix + 'an unexpected error occurred. Please try again.';
};
window.addEventListener('unhandledrejection', function(ev){
  const e = ev.reason;
  console.warn('Unhandled promise rejection:', e);
  if(!(e && e._exHandled)){
    try{ EX.toast(EX.friendlyErrorMessage(e), 'bad'); }catch(_){}
  }
  ev.preventDefault();
});

/* ---- generic schema-driven form (uncontrolled; read via FormData on submit) ---- */
EX.formField = function(f, value){
  const v = value===undefined||value===null?'':value;
  const id = 'f_'+f.key;
  const req = f.required?'required':'';
  let input;
  if(f.type==='select'){
    input = `<select id="${id}" name="${f.key}" class="ex-select" ${req}>${(f.options||[]).map(o=>{
      const ov = typeof o==='object'?o.value:o; const ol = typeof o==='object'?o.label:o;
      return `<option value="${ov}" ${String(ov)===String(v)?'selected':''}>${ol}</option>`;
    }).join('')}</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="${id}" name="${f.key}" class="ex-textarea" rows="${f.rows||3}" placeholder="${f.placeholder||''}" ${req}>${v}</textarea>`;
  } else if(f.type==='checkbox'){
    return `<label class="flex items-center gap-2 text-sm py-1"><input type="checkbox" id="${id}" name="${f.key}" ${v?'checked':''} class="w-4 h-4"/> ${f.label}</label>`;
  } else if(f.type==='date'){
    input = `<input type="date" id="${id}" name="${f.key}" class="ex-input" value="${v?new Date(v).toISOString().slice(0,10):''}" ${req}/>`;
  } else {
    input = `<input type="${f.type||'text'}" id="${id}" name="${f.key}" class="ex-input" placeholder="${f.placeholder||''}" value="${String(v).replace(/"/g,'&quot;')}" ${req} ${f.step?`step="${f.step}"`:''}/>`;
  }
  return `<div>${f.label?`<label class="ex-label" for="${id}">${f.label}${f.required?' *':''}</label>`:''}${input}${f.hint?`<div class="text-[11px] mt-1 leading-snug" style="color:var(--ex-ink-soft)">${f.hint}</div>`:''}</div>`;
};
EX.formGrid = function(fields, data, cols){
  data = data||{};
  return `<div class="grid grid-cols-1 ${cols===2?'sm:grid-cols-2':''} gap-3">${fields.map(f=> f.full? `<div class="${cols===2?'sm:col-span-2':''}">${EX.formField(f,data[f.key])}</div>` : EX.formField(f,data[f.key])).join('')}</div>`;
};
EX.readForm = function(formEl, fields){
  const fd = new FormData(formEl);
  const out = {};
  fields.forEach(f=>{
    if(f.type==='checkbox'){ out[f.key] = formEl.querySelector('#f_'+f.key).checked; }
    else if(f.type==='number'){ const n = fd.get(f.key); out[f.key] = n===''||n===null? null : Number(n); }
    else if(f.type==='date'){ const d = fd.get(f.key); out[f.key] = d? new Date(d).getTime() : null; }
    else out[f.key] = fd.get(f.key);
  });
  return out;
};

EX.render = function(){
  const root = document.getElementById('app');
  // Keep EX.session in sync with whoever is actually signed in to Supabase
  // Auth — this is what replaces the old "pick a profile" step with real login.
  if(EX.session.mode!=='portal') EX.syncSessionFromAuth();
  EX.maybeAutoCompleteBootstrap();
  // Defense in depth: a 'staff'/'portal' session is only legitimate if there is
  // a live Supabase Auth session behind it. The locally-cached ex_os_session_v1
  // session (EX.session) can otherwise outlive the real Supabase session — e.g.
  // it was signed out on another device/tab, the token was revoked, or it just
  // expired while the browser was closed — in which case EX.authEmail comes
  // back null. Row Level Security would eventually block all data access for
  // such a session too, but don't rely on that alone to catch it client-side;
  // check for it directly once we actually know the auth state (EX.authReady).
  if((EX.session.mode==='staff' || EX.session.mode==='portal') && EX.authReady && !EX.authEmail){
    EX.signOut(); root.innerHTML = EX.renderSignIn(); return;
  }
  if(EX.session.mode!=='staff' && EX.session.mode!=='portal'){
    root.innerHTML = EX.renderSignIn();
    return;
  }
  if(!EX.dbReady && !EX.dbOffline){ root.innerHTML = `<div class="min-h-screen flex items-center justify-center">${EX.spinner()}</div>`; return; }
  // EX.dbReady only means SOME collection has loaded (whichever of the 23
  // answered first) — it does NOT mean 'employees' specifically has. A staff
  // session that was restored from the locally-cached ex_os_session_v1 (e.g.
  // right after a page refresh) can reach here before the real employees list
  // has arrived, and EX.currentEmployee() would wrongly look like "not found"
  // simply because the data isn't loaded yet rather than because the record
  // was actually removed. This used to sign such users straight back out on
  // every refresh — wait for EX.employeesReady before trusting that check.
  if(EX.session.mode==='staff' && !EX.employeesReady){ root.innerHTML = `<div class="min-h-screen flex items-center justify-center">${EX.spinner()}</div>`; return; }
  // if signed-in employee record was removed, sign out (also clears the real Supabase Auth session)
  if(EX.session.mode==='staff' && !EX.currentEmployee()){ EX.signOut(); root.innerHTML = EX.renderSignIn(); return; }

  if(EX.session.mode==='portal'){
    let key = EX.route_.key && EX.route_.key.startsWith('portal-') ? EX.route_.key : 'portal-dashboard';
    const fn = EX.portalViews[key] || EX.portalViews['portal-dashboard'];
    root.innerHTML = EX.portalShell(fn(EX.route_.param));
    if(fn.afterRender) fn.afterRender();
    return;
  }
  // staff mode
  let key = EX.route_.key || 'dashboard';
  if(!EX.can(key)) key = 'dashboard';
  const fn = EX.views[key] || EX.views['dashboard'];
  root.innerHTML = EX.shell(fn(EX.route_.param));
  if(fn.afterRender) fn.afterRender();
};

/* ---- id/number generators ---- */
EX.seqNumber = function(col, prefix, dateField){
  const year = new Date().getFullYear();
  const count = EX.get(col).filter(d=> new Date(d._createdAt||0).getFullYear()===year).length;
  return `${prefix}-${year}-${String(count+1).padStart(4,'0')}`;
};

/* ---- attendance ----
   One check-in and one check-out per employee per day. Every day is stored as its OWN top-level key on the
   employee's attendance document ("d_YYYY-MM-DD" = {checkIn, checkOut, hours, eod}) because EX.patch is a
   shallow merge — nesting days inside one object made every write wipe the other days' history.
   Older records that live under doc.days[...] are still read (legacy). Attendance status is DERIVED
   (checked in / on approved leave / approved WFH / absent) — nobody marks it by hand any more. */
EX.todayKey = (d)=>{ d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
EX.utcDayKey = (ts)=> new Date(ts).toISOString().slice(0,10); // leave/WFH dates come from <input type=date> parsed as UTC midnight
EX.attendanceFor = (empId)=> EX.byId('attendance', empId) || {id:empId, days:{}};
EX.attDay = function(empId, day){
  const a = EX.byId('attendance', empId); if(!a) return {};
  const legacy = (a.days && a.days[day]) || {};
  const k = a['d_'+day];
  return k? Object.assign({}, legacy, k) : legacy;
};
EX.attDayKeys = function(empId, ym){
  const a = EX.byId('attendance', empId); if(!a) return [];
  const set = new Set();
  Object.keys(a.days||{}).forEach(d=>{ if(d.startsWith(ym)) set.add(d); });
  Object.keys(a).forEach(k=>{ if(k.startsWith('d_'+ym)) set.add(k.slice(2)); });
  return Array.from(set).sort();
};
EX.isWeeklyOff = (dateObj)=> dateObj.getDay()===0; // Sunday is the weekly off
EX.officeStart = ()=> ((EX.data.companyConfig||{}).officeStart) || '10:00';
EX.isLate = function(rec){
  if(!rec || !rec.checkIn) return false;
  const [h,m] = EX.officeStart().split(':').map(Number);
  const d = new Date(rec.checkIn);
  const mins = d.getHours()*60+d.getMinutes();
  return mins > (h*60+(m||0)+15); // 15-minute grace period
};
EX._attLast = {};
EX._attQueue = {};
// Serialised, per-employee write of one day's record. mutate(rec) returns false to abort.
EX.writeAttDay = function(empId, day, mutate){
  const prev = EX._attQueue[empId] || Promise.resolve();
  const run = prev.catch(()=>{}).then(async ()=>{
    const cached = EX._attLast[empId+'|'+day];
    let rec = EX.attDay(empId, day);
    if(cached && cached.at > EX.now()-20000) rec = Object.assign({}, rec, cached.rec);
    rec = JSON.parse(JSON.stringify(rec));
    const res = mutate(rec);
    if(res===false) return false;
    const key = 'd_'+day;
    if(EX.byId('attendance', empId)) await EX.patch('attendance', empId, {[key]: rec});
    else await EX.setId('attendance', empId, {[key]: rec});
    EX._attLast[empId+'|'+day] = {rec, at: EX.now()};
    return true;
  });
  EX._attQueue[empId] = run;
  return run;
};
EX.clockIn = async function(empId){
  const day = EX.todayKey(); let blocked = false;
  try{
    const ok = await EX.writeAttDay(empId, day, (rec)=>{ if(rec.checkIn){ blocked = true; return false; } rec.checkIn = EX.now(); });
    if(!ok){ if(blocked) EX.toast('You have already checked in today — only one check-in per day is allowed.','warn'); return; }
  }catch(e){ return; }
  EX.toast('Checked in for today','good');
};
EX.clockOut = async function(empId){
  const day = EX.todayKey(); let why = null;
  try{
    const ok = await EX.writeAttDay(empId, day, (rec)=>{
      if(!rec.checkIn){ why = 'Please check in first.'; return false; }
      if(rec.checkOut){ why = 'You have already checked out today — only one check-out per day is allowed.'; return false; }
      rec.checkOut = EX.now(); rec.hours = Math.round(((rec.checkOut-rec.checkIn)/3600000)*10)/10;
    });
    if(!ok){ if(why) EX.toast(why,'warn'); return; }
  }catch(e){ return; }
  EX.toast('Checked out — have a good day','good');
};
// approved leave / WFH days (as YYYY-MM-DD, Sundays skipped) for one employee
EX.approvedDaySet = function(empId, col, ym){
  const set = new Set();
  EX.get(col).filter(r=>r.employeeId===empId && r.status==='Approved' && r.startDate && r.endDate).forEach(r=>{
    for(let t=r.startDate; t<=r.endDate && t-r.startDate<400*86400000; t+=86400000){
      const k = EX.utcDayKey(t); if(ym && !k.startsWith(ym)) continue;
      const [y,m,d] = k.split('-').map(Number); if(EX.isWeeklyOff(new Date(y,m-1,d))) continue;
      set.add(k);
    }
  });
  return set;
};
// Derived status for a single day: Present | Late | WFH | Leave | Absent | Not checked in | Weekly off
EX.dayStatus = function(empId, day){
  const rec = EX.attDay(empId, day);
  const [y,m,d] = day.split('-').map(Number);
  const isToday = day===EX.todayKey();
  if(rec.checkIn) return EX.isLate(rec)||rec.status==='Late' ? 'Late' : 'Present';
  if(EX.approvedDaySet(empId,'leaveRequests',day.slice(0,7)).has(day)) return 'Leave';
  if(EX.approvedDaySet(empId,'wfhRequests',day.slice(0,7)).has(day)) return 'WFH';
  if(rec.status && ['Leave','WFH','Half Day','Late','Present'].includes(rec.status)) return rec.status; // legacy hand-marked record
  if(EX.isWeeklyOff(new Date(y,m-1,d))) return 'Weekly off';
  return isToday? 'Not checked in' : (day>EX.todayKey()? '—' : 'Absent');
};
EX.monthKey = (d)=>{ d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
EX.monthLabel = (ym)=>{ const [y,m]=String(ym).split('-').map(Number); return new Date(y,(m||1)-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'}); };
EX.shiftMonth = (ym,delta)=>{ const [y,m]=ym.split('-').map(Number); return EX.monthKey(new Date(y,m-1+delta,1)); };
EX.employeeMonthStats = function(empId, ym){
  ym = ym || EX.monthKey();
  let daysPresent=0, hoursWorked=0, lateDays=0, eodDays=0;
  const leaveSet = EX.approvedDaySet(empId,'leaveRequests',ym), wfhSet = EX.approvedDaySet(empId,'wfhRequests',ym);
  const attended = new Set();
  EX.attDayKeys(empId, ym).forEach(d=>{
    const rec = EX.attDay(empId, d);
    if(rec.checkIn){ daysPresent++; attended.add(d); if(EX.isLate(rec)||rec.status==='Late') lateDays++; }
    else if(rec.status==='Present'){ daysPresent++; attended.add(d); }
    else if(rec.status==='Late'){ daysPresent++; lateDays++; attended.add(d); }
    else if(rec.status==='Leave') leaveSet.add(d);
    else if(rec.status==='WFH') wfhSet.add(d);
    if(rec.hours) hoursWorked += rec.hours;
    if(rec.eod && rec.eod.summary) eodDays++;
  });
  wfhSet.forEach(d=> attended.add(d));
  const tasks = EX.get('tasks').filter(t=> t.assignedTo===empId && t._createdAt && EX.monthKey(new Date(t._createdAt))===ym);
  const completed = tasks.filter(t=> t.status==='Done');
  const onTime = completed.filter(t=> t.deadline && t.completedAt && t.completedAt<=t.deadline);
  const revisions = tasks.reduce((s,t)=> s+(t.revisionCount||0),0);
  const completionRate = tasks.length? completed.length/tasks.length : (daysPresent?1:0);
  const onTimeRate = completed.length? onTime.length/completed.length : 1;
  // working days = non-Sunday days in the month so far, minus approved leave
  const [Y,M] = ym.split('-').map(Number); const today = new Date();
  const lastDay = (today.getFullYear()===Y && today.getMonth()+1===M)? today.getDate() : new Date(Y,M,0).getDate();
  let working = 0; for(let d=1; d<=lastDay; d++){ if(!EX.isWeeklyOff(new Date(Y,M-1,d))) working++; }
  const expected = Math.max(1, working - leaveSet.size);
  const attendanceRate = Math.min(1, attended.size/expected);
  const revisionPenalty = Math.min(1, revisions/Math.max(1,tasks.length)/2);
  const score = Math.round((completionRate*40 + onTimeRate*30 + attendanceRate*20 + (1-revisionPenalty)*10));
  return {ym, daysPresent, hoursWorked: Math.round(hoursWorked*10)/10, lateDays, leaveDays: leaveSet.size, wfhDays: wfhSet.size, eodDays, workingDays: working,
    tasksAssigned:tasks.length, tasksCompleted:completed.length, onTimeCompleted:onTime.length, revisions,
    completionRate, onTimeRate, attendanceRate, productivityScore: Math.max(0,Math.min(100,score))};
};

/* ---- employee lifecycle ---- */
EX.removeEmployee = function(id, hard){
  const emp = EX.byId('employees', id);
  if(!emp) return;
  if(!EX.canDeleteEmployee()){ EX.toast('Only the MD, Operations Head / CEO and Super Admin can delete or remove employees.','bad'); return; }
  EX.confirmAction(hard?'Delete profile permanently':'Deactivate employee',
    hard? `This permanently deletes <b>${emp.name}</b>'s profile. Task, attendance and leave history tied to them is kept for records but their profile disappears from every list. This can't be undone.`
        : `<b>${emp.name}</b> will be moved to <b>Removed</b> status and lose workspace access immediately. Their task and attendance history is kept. You can re-activate them later from Employees → filter: Removed.`,
    async ()=>{
      if(hard){ await EX.remove('employees', id); await EX.addAudit('Deleted employee (permanent)','employees',id,emp,null); }
      else { await EX.patch('employees', id, {status:'Removed', removedAt:EX.now()}); await EX.addAudit('Deactivated employee','employees',id,{status:emp.status},{status:'Removed'}); }
      EX.toast(hard?'Profile deleted':'Employee deactivated','good');
    }, true);
};
EX.reactivateEmployee = async function(id){
  await EX.patch('employees', id, {status:'Active', removedAt:null});
  await EX.addAudit('Reactivated employee','employees',id,{status:'Removed'},{status:'Active'});
  EX.toast('Employee reactivated','good');
};

/* ---- finance helpers ---- */
EX.paidTotalForInvoice = (invoiceId)=> EX.get('payments').filter(p=>p.invoiceId===invoiceId && p.status==='Paid').reduce((s,p)=>s+(p.amountClaimed||0),0);
EX.recomputeInvoiceStatus = async function(invoiceId){
  const inv = EX.byId('invoices', invoiceId); if(!inv) return;
  if(['Draft','Cancelled','Refunded'].includes(inv.status)) return;
  const paid = EX.paidTotalForInvoice(invoiceId);
  const hasPendingVerification = EX.get('payments').some(p=>p.invoiceId===invoiceId && p.status==='Under Verification');
  let status;
  if(paid>=inv.total) status='Paid';
  else if(hasPendingVerification) status='Under Verification';
  else if(paid>0) status='Partially Paid';
  else if(inv.dueDate && EX.now()>inv.dueDate) status='Overdue';
  else status='Due';
  if(status!==inv.status) await EX.patch('invoices', invoiceId, {status});
};

EX.submitClientPayment = async function(invoiceId, data){
  const inv = EX.byId('invoices', invoiceId); if(!inv) return;
  const receiptSeq = EX.seqNumber('payments','PMT');
  await EX.add('payments', Object.assign({invoiceId, clientId: inv.clientId, status:'Under Verification', ref: receiptSeq}, data));
  await EX.recomputeInvoiceStatus(invoiceId);
  await EX.addNotification({targetRole:'accounts', message:`Payment verification required — ${EX.byId('clients',inv.clientId)?.companyName||'Client'} submitted ${EX.fmtMoney(data.amountClaimed, inv.currency)} via ${data.method}.`, link:'payments'});
  await EX.addAudit('Client submitted payment','invoices',invoiceId,null,data);
};
EX.verifyPayment = function(paymentId, approve){
  const p = EX.byId('payments', paymentId); if(!p) return;
  if(approve){
    EX.confirmAction('Verify payment', `Mark this ${EX.fmtMoney(p.amountClaimed)} payment as verified and generate a receipt? This updates the client's invoice and receivables.`, async ()=>{
      const receiptNumber = EX.seqNumber('payments','RCT');
      await EX.patch('payments', paymentId, {status:'Paid', verifiedBy:EX.currentEmployee()?.name, verifiedAt:EX.now(), receiptNumber});
      await EX.recomputeInvoiceStatus(p.invoiceId);
      await EX.addAudit('Payment verified','payments',paymentId,{status:'Under Verification'},{status:'Paid'});
      EX.toast('Payment verified — receipt generated','good');
    });
  } else {
    EX.openRejectPaymentModal(paymentId);
  }
};
EX.openRejectPaymentModal = function(paymentId){
  EX.openModal(`${EX.modalHeader('Reject payment')}
    <form onsubmit="EX.submitRejectPayment(event,'${paymentId}')" class="p-5 space-y-3">
      <div><label class="ex-label">Reason *</label><textarea required name="reason" class="ex-textarea" rows="3" placeholder="e.g. Transaction ID does not match bank record"></textarea></div>
      <div class="flex justify-end gap-2 pt-2"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-danger">Reject payment</button></div>
    </form>`);
};
EX.submitRejectPayment = async function(ev, paymentId){
  ev.preventDefault();
  const reason = new FormData(ev.target).get('reason');
  const p = EX.byId('payments', paymentId);
  await EX.patch('payments', paymentId, {status:'Rejected', rejectionReason:reason, verifiedBy:EX.currentEmployee()?.name, verifiedAt:EX.now()});
  await EX.recomputeInvoiceStatus(p.invoiceId);
  await EX.addAudit('Payment rejected','payments',paymentId,{status:'Under Verification'},{status:'Rejected',reason});
  EX.closeModal();
  EX.toast('Payment rejected','warn');
};

/* ---- lead -> proposal -> won -> client automation ---- */
EX.convertLeadToClient = function(proposalId){
  const prop = EX.byId('proposals', proposalId); if(!prop) return;
  const lead = EX.byId('leads', prop.leadId);
  EX.confirmAction('Convert to Client', `This creates the client profile, billing setup and a starter invoice for <b>${lead?lead.company:prop.company}</b>, and marks the lead & proposal Won. This runs automatically end-to-end.`, async ()=>{
    const country = (lead&&lead.country) || 'India';
    const ccy = (EX.COUNTRIES.find(c=>c.c===country)||{}).ccy || 'INR';
    const dmes = EX.get('employees').filter(e=>e.role==='dme' && e.status==='Active');
    const assignedDme = dmes.length? dmes[Math.floor(Math.random()*dmes.length)].id : null;
    const clientId = await EX.add('clients', {
      companyName: lead?lead.company:prop.company, country, currency:ccy, status:'Active',
      contactPerson: lead?lead.contactPerson:'', email: lead?lead.email:'', phone: lead?lead.phone:'',
      industry: lead?lead.industry:'', assignedDme, assignedSales: lead?lead.assignedTo:null,
      services: prop.services||[], platforms: [], monthlyFee: prop.monthlyFee||0, oneTimeFee: prop.oneTimeFee||0,
      adSpendPassthrough: prop.adSpend||0, billingDay: 5, contractStart: EX.now(), durationMonths: prop.durationMonths||12,
      paymentTerms: prop.paymentTerms||'Net 15', proposalId, healthOverride:null, serviceStatus:'Active',
    });
    await EX.patch('leads', prop.leadId, {stage:'Won'});
    await EX.patch('proposals', proposalId, {status:'Won'});
    // starter invoice for first billing cycle
    const total = (prop.monthlyFee||0);
    const taxRate = (EX.data.companyConfig&&EX.data.companyConfig.taxRate)||18;
    const tax = Math.round(total*taxRate/100);
    await EX.add('invoices', {clientId, invoiceNumber: EX.seqNumber('invoices','INV'), billingPeriod: new Date().toLocaleString('en-IN',{month:'long',year:'numeric'}),
      lineItems:[{desc:'Monthly Retainer — Engage X Service Fee', qty:1, rate:total, amount:total}], subtotal:total, taxRate, taxAmount:tax, total: total+tax,
      currency:ccy, dueDate: EX.now()+15*86400000, status:'Generated'});
    await EX.addNotification({targetRole:'accounts', message:`New client won: ${lead?lead.company:prop.company} — starter invoice generated.`, link:'invoices'});
    await EX.addNotification({targetRole:'ops_head', message:`New client ${lead?lead.company:prop.company} needs onboarding: content calendar, task assignment, platform links.`, link:'clients'});
    await EX.addAudit('Converted proposal to client','proposals',proposalId,null,{clientId});
    EX.toast('Client created — onboarding notifications sent','good');
    EX.route('clients', clientId);
  });
};

/* ---- health scores ---- */
EX.computeClientHealth = function(client){
  const reasons = [];
  let score = 100;
  const invs = EX.get('invoices').filter(i=>i.clientId===client.id);
  const overdue = invs.filter(i=>i.status==='Overdue');
  if(overdue.length){ score-=30; reasons.push(`${overdue.length} overdue invoice(s)`); }
  const content = EX.get('content').filter(c=>c.clientId===client.id);
  const rejected = content.filter(c=>c.status==='Rejected'||c.status==='Revision');
  if(content.length && rejected.length/content.length>0.3){ score-=15; reasons.push('High content revision/rejection rate'); }
  const tickets = EX.get('supportTickets').filter(t=>t.clientId===client.id && t.status!=='Resolved' && t.status!=='Closed');
  if(tickets.length>=2){ score-=15; reasons.push(`${tickets.length} open support tickets`); }
  const meetings = EX.get('meetings').filter(m=>m.clientId===client.id);
  const missed = meetings.filter(m=>m.status==='Client Absent');
  if(missed.length>=2){ score-=15; reasons.push('Repeated missed review meetings'); }
  if(client.serviceStatus==='On Hold'){ score-=25; reasons.push('Service currently on hold'); }
  score = Math.max(0,score);
  const label = score>=75?'Healthy':score>=45?'Watch':'At Risk';
  if(!reasons.length) reasons.push('No risk signals detected — payments current, deliverables on track');
  return {score, label, reasons};
};
EX.computeBusinessHealth = function(kpi){
  const reasons_good=[], reasons_bad=[], actions=[];
  if(kpi.profitMonth>0) reasons_good.push(`Operating profit is positive this month (${EX.fmtMoney(kpi.profitMonth)})`); else reasons_bad.push(`Operating loss this month (${EX.fmtMoney(kpi.profitMonth)})`);
  if(kpi.overdueTotal>0){ reasons_bad.push(`${EX.fmtMoney(kpi.overdueTotal)} sitting in overdue receivables`); actions.push('Chase overdue invoices — see Finance → Receivables'); }
  if(kpi.pipelineValue < kpi.mrr*2){ reasons_bad.push('Sales pipeline is thin relative to current recurring revenue'); actions.push('Sales team to prioritize new discovery calls'); }
  else reasons_good.push('Healthy pipeline coverage relative to recurring revenue');
  if(kpi.atRiskClients>0){ reasons_bad.push(`${kpi.atRiskClients} client(s) flagged At Risk`); actions.push('Account owners to review At Risk clients this week'); }
  const score = Math.max(0,Math.min(100, 60 + (kpi.profitMonth>0?15:-15) + (kpi.overdueTotal>0?-10:5) + (kpi.atRiskClients>0?-10:5) + (kpi.pipelineValue>kpi.mrr*2?10:-5)));
  const label = score>=75?'Healthy':score>=50?'Watch':'At Risk';
  return {score,label,good:reasons_good,bad:reasons_bad,actions};
};

/* ---- dashboard KPI computation (grounded in real db data) ---- */
EX.computeKPIs = function(){
  const invs = EX.get('invoices');
  const pays = EX.get('payments').filter(p=>p.status==='Paid');
  const clients = EX.get('clients');
  const leads = EX.get('leads');
  const now = new Date(); const ymNow = EX.monthKey(now);
  const invMonth = invs.filter(i=> i._createdAt && EX.monthKey(new Date(i._createdAt))===ymNow);
  const revenueMonth = invMonth.reduce((s,i)=>s+(i.total||0),0);
  const cashMonth = pays.filter(p=>p._createdAt && EX.monthKey(new Date(p._createdAt))===ymNow).reduce((s,p)=>s+(p.amountClaimed||0),0);
  const cashAll = pays.reduce((s,p)=>s+(p.amountClaimed||0),0);
  const receivables = invs.filter(i=>!['Draft','Cancelled','Refunded'].includes(i.status)).reduce((s,i)=> s+Math.max(0,(i.total||0)-EX.paidTotalForInvoice(i.id)),0);
  const overdueTotal = invs.filter(i=>i.status==='Overdue').reduce((s,i)=> s+Math.max(0,(i.total||0)-EX.paidTotalForInvoice(i.id)),0);
  const expenses = EX.get('expenses');
  const expenseMonth = expenses.filter(e=> e.date && EX.monthKey(new Date(e.date))===ymNow).reduce((s,e)=>s+(e.amount||0),0);
  const vendorPayables = EX.get('vendorInvoices').filter(v=>v.status!=='Paid').reduce((s,v)=>s+(v.amount||0),0);
  const profitMonth = revenueMonth - expenseMonth;
  const activeClients = clients.filter(c=>c.status==='Active');
  const mrr = activeClients.reduce((s,c)=>s+(c.monthlyFee||0),0);
  const newLeadsMonth = leads.filter(l=> l._createdAt && EX.monthKey(new Date(l._createdAt))===ymNow).length;
  const pipelineValue = leads.filter(l=>!['Won','Lost'].includes(l.stage)).reduce((s,l)=>s+(Number(l.budget)||0),0);
  const wonMonth = leads.filter(l=>l.stage==='Won' && l._updatedAt && EX.monthKey(new Date(l._updatedAt))===ymNow).length;
  const tasks = EX.get('tasks');
  const tasksToday = tasks.filter(t=> t.deadline && new Date(t.deadline).toDateString()===now.toDateString() && t.status!=='Done');
  const tasksOverdue = tasks.filter(t=> t.deadline && t.deadline<EX.now() && t.status!=='Done');
  const contentPending = EX.get('content').filter(c=>c.status==='Submitted');
  const atRiskClients = clients.filter(c=> EX.computeClientHealth(c).label==='At Risk').length;
  const proposalsPendingApproval = EX.get('proposals').filter(p=>p.status==='Admin Approval').length;
  return {revenueMonth,cashMonth,cashAll,receivables,overdueTotal,expenseMonth,vendorPayables,profitMonth,activeClients:activeClients.length,
    mrr,newLeadsMonth,pipelineValue,wonMonth,tasksToday:tasksToday.length,tasksOverdue:tasksOverdue.length,contentPending:contentPending.length,
    atRiskClients, proposalsPendingApproval, totalLeads:leads.length};
};
