/* ---- PDF reports (Engage X logo on every page) ---- */
EX.pdfNew = (title, subtitle)=> EX.PDF({title, subtitle, logoB64: EX.LOGO_B64});
EX.safeFile = (str)=> String(str||'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'file';
EX.saveDoc = async function(doc, filename){ await EX.downloadFile(filename, doc.build()); };
EX.downloadClientWorkReportPdf = async function(clientId, ym){
  const c = EX.byId('clients', clientId); if(!c) return;
  ym = ym || EX.ui.contentMonth || EX.monthKey();
  const ccy = c.currency||'INR';
  const doc = EX.pdfNew('Monthly Work Report', `${c.companyName}  |  ${EX.monthLabel(ym)}`);
  const sel = c.socialPlatforms||[];
  const sum = EX.adsSummary(c, ym);
  const t = EX.contentTrackerFor(c, ym);
  const dme = EX.byId('employees', c.assignedDme);
  doc.paragraph(`Client: ${c.companyName}${c.contactPerson?'   |   Contact: '+c.contactPerson:''}${dme?'   |   Account manager: '+dme.name:''}`, {size:9, color:[90,102,122]});
  doc.paragraph(`Platforms managed: ${sel.length? sel.map(EX.platformLabel).join(', ') : 'none selected'}`, {size:9, color:[90,102,122]});
  if(t.pausedPartly) doc.paragraph(`Note: work was paused ${t.paused?'for this month':'for part of this month'}${t.pausedPartly.reason?' ('+t.pausedPartly.reason+')':''}.`, {size:9, bold:true, color:[217,119,6]});
  doc.heading('Advertising results');
  doc.stats([
    {label:'Total leads', value:String(sum.leads)},
    {label:'Ad amount spent', value:EX.pdfMoney(sum.amount, ccy)},
    {label:'Total ad campaigns', value:String(sum.count)},
    {label:'Cost per lead (CPL)', value: sum.cpl===null? '-' : EX.pdfMoney(sum.cpl, ccy)},
  ], 4);
  doc.table([{label:'Campaign',w:3},{label:'Platform',w:2.2},{label:'Amount',w:1.6,align:'right'},{label:'Leads',w:1,align:'right'},{label:'CPL',w:1.4,align:'right'}],
    sum.campaigns.map(x=>[x.name, x.platform||'', EX.pdfMoney(x.amount,ccy), String(x.leads||0), Number(x.leads)>0? EX.pdfMoney(Number(x.amount)/Number(x.leads),ccy) : '-'])
      .concat(sum.campaigns.length? [Object.assign(['Total','',EX.pdfMoney(sum.amount,ccy),String(sum.leads),sum.cpl===null?'-':EX.pdfMoney(sum.cpl,ccy)],{__bold:true})] : []),
    {empty:'No ad campaigns recorded this month'});
  doc.heading('Social media audience');
  const audItems = EX.SOCIAL_PLATFORMS.filter(p=>p.audience && sel.includes(p.key)).map(p=>{
    const v = sum.audience[p.key], pv = sum.prevAudience[p.key];
    let sub = ''; if(v!==undefined && v!==null && pv!==undefined && pv!==null){ const d=v-pv; sub = (d>=0?'+':'')+d.toLocaleString('en-IN'); }
    return {label:p.audience+(sub?'  ('+sub+')':''), value: (v===undefined||v===null)? '-' : Number(v).toLocaleString('en-IN')};
  });
  if(audItems.length) doc.stats(audItems, 3); else doc.paragraph('No follower / subscriber platforms selected for this client.', {size:9, color:[90,102,122]});
  doc.heading('Content deliverables: committed vs delivered');
  doc.stats([
    {label:'Committed', value:String(t.tot.committed)},
    {label:'Delivered', value:`${t.tot.delivered} / ${t.target||0}`},
    {label:'Client approved', value:String(t.tot.approved), color:[14,159,110]},
    {label:'Re-work / Pending', value:`${t.tot.rework} / ${t.tot.pending}`},
  ], 4);
  doc.progress('Delivery progress', t.tot.delivered, t.target);
  doc.progress('Client approval progress  ('+t.labelFull+')', t.tot.approved, t.target, {color:[47,99,238]});
  doc.table([{label:'Type',w:2},{label:'Committed',w:1.2,align:'right'},{label:'Created',w:1,align:'right'},{label:'Delivered',w:1.1,align:'right'},{label:'Approved',w:1.1,align:'right'},{label:'Re-work',w:1,align:'right'},{label:'Pending',w:1,align:'right'},{label:'Pending balance',w:1.5,align:'right'}],
    t.rows.map(r=>[r.type, r.committed||'-', r.created, r.delivered, r.approved, r.rework, r.pending, r.committed? r.shortfall : '-']).concat(t.rows.length?[Object.assign(['Total',t.tot.committed,t.tot.created,t.tot.delivered,t.tot.approved,t.tot.rework,t.tot.pending,t.tot.shortfall],{__bold:true})]:[]),
    {empty:'No committed deliverables set for this client'});
  if(t.items.length){
    doc.heading('Content items this month');
    doc.table([{label:'Title',w:3.4},{label:'Type',w:1.4},{label:'Work status',w:1.5},{label:'Client approval',w:1.5}],
      t.items.map(x=>[x.title, x.type||'', x.status, EX.contentApproval(x)]));
  }
  const tasks = EX.get('tasks').filter(k=>k.clientId===c.id && ((k.deadline && EX.monthKey(new Date(k.deadline))===ym) || (!k.deadline && k._createdAt && EX.monthKey(new Date(k._createdAt))===ym)));
  doc.heading('Tasks');
  doc.paragraph(`${tasks.filter(k=>k.status==='Done').length} of ${tasks.length} tasks completed this month.`, {size:9});
  if(tasks.length) doc.table([{label:'Task',w:3.4},{label:'Assigned to',w:1.8},{label:'Deadline',w:1.3},{label:'Status',w:1.2}], tasks.map(k=>[k.title, k.assignedToName||'-', EX.fmtDate(k.deadline), k.status]));
  doc.spacer(8);
  doc.paragraph('Ad, lead and audience figures are entered by the Engage X team from platform dashboards.', {size:8, color:[90,102,122]});
  await EX.saveDoc(doc, `Work-Report-${EX.safeFile(c.companyName)}-${ym}.pdf`);
};
EX.downloadContentTrackerPdf = async function(ym){
  ym = ym || EX.ui.contentMonth || EX.monthKey();
  const trs = EX.trackerClients().map(c=>EX.contentTrackerFor(c, ym));
  const doc = EX.pdfNew('Content Delivery Tracker', EX.monthLabel(ym));
  const k = trs.filter(t=>!t.paused).reduce((a,t)=>{ a.committed+=t.tot.committed; a.delivered+=t.tot.delivered; a.approved+=t.tot.approved; a.rework+=t.tot.rework; a.pending+=t.tot.pending; return a; },{committed:0,delivered:0,approved:0,rework:0,pending:0});
  doc.heading('Overall (paused clients excluded)');
  doc.stats([{label:'Committed',value:String(k.committed)},{label:'Delivered',value:`${k.delivered} / ${k.committed}`},{label:'Client approved',value:String(k.approved)},{label:'Re-work',value:String(k.rework)},{label:'Pending approval',value:String(k.pending)}],5);
  doc.progress('Delivery progress', k.delivered, k.committed);
  doc.progress('Client approval progress', k.approved, k.committed, {color:[47,99,238]});
  doc.heading('By client');
  doc.table([{label:'Client',w:3},{label:'Committed',w:1.2,align:'right'},{label:'Delivered',w:1.2,align:'right'},{label:'Approved',w:1.2,align:'right'},{label:'Re-work',w:1,align:'right'},{label:'Pending',w:1,align:'right'},{label:'Balance',w:1.1,align:'right'},{label:'Status',w:2.2}],
    trs.map(t=>[t.client.companyName, t.tot.committed, t.tot.delivered, t.tot.approved, t.tot.rework, t.tot.pending, t.tot.shortfall, t.labelFull]), {empty:'No clients'});
  await EX.saveDoc(doc, `Content-Tracker-${ym}.pdf`);
};
EX.generateMonthlyReport = async function(clientId, ym){
  const c = EX.byId('clients', clientId);
  const btn = document.getElementById('report-gen-btn'); const out = document.getElementById('report-out');
  if(btn) btn.disabled=true; if(out) out.textContent='Generating…';
  const content = EX.get('content').filter(x=>x.clientId===clientId);
  const tasks = EX.get('tasks').filter(t=>t.clientId===clientId);
  const perf = c.performance||{};
  const prompt = `Write a concise, professional monthly performance report for a marketing agency client, using ONLY these facts (never invent numbers):
Client: ${c.companyName}
Services: ${(c.services||[]).map(s=>s.item).join(', ')||'none listed'}
Content items this period: ${content.length} total, ${content.filter(x=>x.status==='Published').length} published, ${content.filter(x=>x.status==='Approved').length} approved awaiting publish
Tasks: ${tasks.length} total, ${tasks.filter(t=>t.status==='Done').length} completed
Social: ${perf.social? `${perf.social.followers||0} followers, ${perf.social.reach||0} reach, ${perf.social.engagement||0}% engagement` : 'not recorded this month'}
Advertising: ${perf.ads? `spend ${perf.ads.spend||0}, ${perf.ads.leads||0} leads, CPL ${perf.ads.cpl||0}` : 'not recorded this month'}
SEO: ${perf.seo? `${perf.seo.keywordsRanked||0} keywords ranked, ${perf.seo.trafficSessions||0} organic sessions` : 'not recorded this month'}
Write it in 4 short sections: Summary, Deliverables, Performance, Recommendations (recommendations may go beyond the facts but must be labeled as AI suggestions). Keep it under 220 words, plain text, no markdown.`;
  try{
    const {text} = await EX.askAI(prompt, {modelTier:'default'});
    const monthlyReports = Object.assign({}, c.monthlyReports, {[ym]: text});
    await EX.patch('clients', clientId, {monthlyReports});
    EX.toast('Report generated','good');
  }catch(e){ if(out) out.textContent = EX.friendlySampleError(e); }
  finally{ if(btn) btn.disabled=false; }
};
EX.downloadClientReport = async function(clientId, ym){
  const c = EX.byId('clients', clientId);
  const text = (c.monthlyReports||{})[ym] || '';
  await EX.downloadFile(`Report-${c.companyName.replace(/\s+/g,'-')}-${ym}.txt`, text);
};

EX.portalViews['portal-payments'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('');
  const invs = EX.get('invoices').filter(i=>i.clientId===c.id);
  const outstanding = invs.filter(i=>!['Paid','Cancelled','Refunded','Draft'].includes(i.status));
  const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
  const totalPaid = invs.reduce((s,i)=>s+EX.paidTotalForInvoice(i.id),0);
  const cfg = EX.data.companyConfig||{}; const bank = cfg.bank||{};
  const history = EX.get('payments').filter(p=>p.clientId===c.id).sort((a,b)=>(b._createdAt||0)-(a._createdAt||0));
  return `${EX.pageHead('Payments')}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${EX.statCard('Total invoiced', EX.fmtMoney(totalInvoiced,c.currency))}${EX.statCard('Total paid', EX.fmtMoney(totalPaid,c.currency),'','good')}
    ${EX.statCard('Pending', EX.fmtMoney(totalInvoiced-totalPaid,c.currency),'', totalInvoiced>totalPaid?'warn':'good')}${EX.statCard('Overdue', EX.fmtMoney(invs.filter(i=>i.status==='Overdue').reduce((s,i)=>s+(i.total-EX.paidTotalForInvoice(i.id)),0),c.currency),'', 'bad')}
  </div>
  ${outstanding.length? outstanding.map(i=>`
    <div class="ex-card p-4 mb-3 flex flex-wrap items-center justify-between gap-3">
      <div><div class="font-semibold text-sm">${i.invoiceNumber} — ${i.billingPeriod}</div><div class="text-xs" style="color:var(--ex-ink-soft)">Due ${EX.fmtDate(i.dueDate)} · Balance ${EX.fmtMoney(i.total-EX.paidTotalForInvoice(i.id),i.currency)}</div></div>
      <button onclick="EX.openPayNow('${i.id}')" class="ex-btn ex-btn-primary">${EX.icon('credit-card','w-4 h-4')} Pay now</button>
    </div>`).join('') : `<div class="ex-card p-5 mb-4">${EX.empty('Nothing due right now')}</div>`}
  <div class="ex-card p-5">
    <div class="font-semibold text-sm mb-3">Payment history</div>
    ${history.length? `<table class="ex-table"><thead><tr><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Status</th><th></th></tr></thead><tbody>
      ${history.map(p=>`<tr><td>${EX.fmtDate(p._createdAt)}</td><td>${(EX.byId('invoices',p.invoiceId)||{}).invoiceNumber||'—'}</td><td class="tnum">${EX.fmtMoney(p.amountClaimed)}</td><td>${p.method}</td><td>${EX.pill(p.status)}</td><td>${p.status==='Paid'?`<button onclick="EX.viewReceipt('${p.id}')" class="ex-btn ex-btn-ghost ex-btn-sm">Receipt</button>`:''}</td></tr>`).join('')}
    </tbody></table>` : EX.empty('No payments yet')}
  </div>`;
};
EX.openPayNow = function(invoiceId){
  const inv = EX.byId('invoices', invoiceId);
  const cfg = EX.data.companyConfig||{}; const bank = cfg.bank||{};
  const balance = inv.total-EX.paidTotalForInvoice(invoiceId);
  const tab = EX.ui.payTab||'qr';
  EX.openModal(`${EX.modalHeader('Pay Invoice '+inv.invoiceNumber, EX.fmtMoney(balance,inv.currency)+' due '+EX.fmtDate(inv.dueDate))}
    <div class="flex gap-1 px-5 pt-3 border-b" style="border-color:var(--ex-line)">
      ${[['qr','Pay via QR'],['bank','Bank Transfer'],['online','Online Payment']].map(([k,l])=>`<button onclick="EX.ui.payTab='${k}';EX.openPayNow('${invoiceId}')" class="px-3 py-2 text-sm font-medium border-b-2 -mb-px" style="border-color:${tab===k?'var(--ex-blue-600)':'transparent'};color:${tab===k?'var(--ex-blue-600)':'var(--ex-ink-soft)'}">${l}</button>`).join('')}
    </div>
    <div class="p-5">
    ${tab==='online'? `<div class="text-center py-6">${EX.icon('info','w-6 h-6 mx-auto mb-2')}<div class="text-sm font-medium">Online payment gateway not connected yet</div><div class="text-xs mt-1" style="color:var(--ex-ink-soft)">Ask Engage X to enable Razorpay/Stripe/PayU, or use QR / Bank Transfer below.</div></div>` : ''}
    ${tab==='qr'? `<div class="text-center mb-4">
        ${cfg.qrAssetUrl? `<img src="${cfg.qrAssetUrl}" class="w-44 h-44 object-contain mx-auto border rounded-lg" style="border-color:var(--ex-line)"/>` : `<div class="text-sm" style="color:var(--ex-ink-soft)">${EX.icon('alert','w-5 h-5 inline mr-1')} No QR code uploaded yet — ask Accounts to add one in Settings.</div>`}
        <div class="text-xs mt-2" style="color:var(--ex-ink-soft)">${cfg.bank&&cfg.bank.accountName?('Pay to: '+cfg.bank.accountName):''} · Amount ${EX.fmtMoney(balance,inv.currency)} · Ref: ${inv.invoiceNumber}</div>
      </div>` : ''}
    ${tab==='bank'? `<div class="text-sm space-y-1 mb-4 p-3 rounded-lg" style="background:var(--ex-blue-50)">
        <div><b>Account name:</b> ${bank.accountName||'Not configured yet'}</div><div><b>Bank:</b> ${bank.bankName||'—'}</div><div><b>Account #:</b> ${bank.accountNumber||'—'}</div><div><b>IFSC:</b> ${bank.ifsc||'—'}</div><div><b>Branch:</b> ${bank.branch||'—'}</div><div><b>UPI:</b> ${bank.upi||'—'}</div>
      </div>` : ''}
    ${tab!=='online'? `<form onsubmit="EX.submitPayNow(event,'${invoiceId}','${tab}')" class="space-y-3">
        <div class="text-xs font-semibold">${EX.icon('info','w-3.5 h-3.5 inline mr-1')} I have made payment — submit for verification</div>
        ${EX.formGrid([{key:'amountClaimed',label:'Amount paid',type:'number',required:true},{key:'dateClaimed',label:'Date',type:'date',required:true},{key:'transactionRef',label:'Transaction / reference ID',required:true}],{amountClaimed:balance,dateClaimed:EX.now()},2)}
        <div><label class="ex-label">Payment proof (optional)</label><input type="file" name="proof" accept="image/*,.pdf" id="proof-input"/></div>
        <button class="ex-btn ex-btn-primary w-full justify-center">Submit for verification</button>
      </form>` : ''}
    </div>`, {wide:true});
};
EX.submitPayNow = async function(ev, invoiceId, method){
  ev.preventDefault();
  const data = EX.readForm(ev.target,[{key:'amountClaimed',type:'number'},{key:'dateClaimed',type:'date'},{key:'transactionRef'}]);
  const fileInput = document.getElementById('proof-input');
  let proofAssetId = null;
  if(fileInput && fileInput.files[0]){ const res = await EX.uploadAsset(fileInput.files[0]); proofAssetId = res? res.id : null; }
  data.method = method==='qr'?'QR Code':'Bank Transfer'; data.proofAssetId = proofAssetId;
  await EX.submitClientPayment(invoiceId, data);
  EX.closeModal(); EX.toast('Submitted — status: Under Verification','good');
};
EX.portalViews['portal-contracts'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('');
  const row=(l,v)=>`<div class="flex justify-between py-1.5 border-b text-sm" style="border-color:var(--ex-line-soft)"><span style="color:var(--ex-ink-soft)">${l}</span><span class="font-medium text-right">${v||'—'}</span></div>`;
  return `${EX.pageHead('Contract')}<div class="ex-card p-5 max-w-xl">
    ${row('Package', (c.services||[]).length+' services')}
    ${row('One-time charges', EX.fmtMoney(c.oneTimeFee||0,c.currency))}${row('Ad spend pass-through', EX.fmtMoney(c.adSpendPassthrough||0,c.currency))}
    ${row('Billing date', 'Day '+(c.billingDay||5)+' of month')}${row('Payment terms', c.paymentTerms)}
    ${row('Contract start', EX.fmtDate(c.contractStart))}${row('Duration', (c.durationMonths||'—')+' months')}
    <div class="text-xs mt-3" style="color:var(--ex-ink-soft)">${EX.icon('lock','w-3.5 h-3.5 inline mr-1')} Commercial terms are set by Engage X and cannot be edited from the portal.</div>
  </div>`;
};
EX.portalViews['portal-meetings'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('');
  const items = EX.get('meetings').filter(m=>m.clientId===c.id).sort((a,b)=>(b.date||0)-(a.date||0));
  return `${EX.pageHead('Meetings','', `<button onclick="EX.scheduleMeetingModal('${c.id}')" class="ex-btn ex-btn-primary">${EX.icon('plus','w-4 h-4')} Request a meeting</button>`)}
  <div class="ex-card divide-y" style="border-color:var(--ex-line)">${items.length? items.map(m=>`<div class="flex items-center justify-between p-3"><div><div class="text-sm font-medium">${EX.fmtDateTime(m.date)}</div><div class="text-xs" style="color:var(--ex-ink-soft)">${m.notes||''}</div></div>${EX.pill(m.status)}</div>`).join('') : `<div class="p-6">${EX.empty('No meetings yet')}</div>`}</div>`;
};
EX.portalViews['portal-workrequests'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('');
  return EX.clientExtraWorkTab(c);
};
EX.portalViews['portal-support'] = function(){
  const c = EX.portalClient(); if(!c) return EX.empty('');
  const items = EX.get('supportTickets').filter(t=>t.clientId===c.id).sort((a,b)=>(b._createdAt||0)-(a._createdAt||0));
  return `${EX.pageHead('Support','', `<button onclick="EX.newTicketModal('${c.id}')" class="ex-btn ex-btn-primary">${EX.icon('plus','w-4 h-4')} New request</button>`)}
  <div class="ex-card divide-y" style="border-color:var(--ex-line)">${items.length? items.map(t=>`<div class="p-3.5"><div class="flex items-center justify-between mb-1"><div class="text-sm font-medium">${t.category}</div>${EX.pill(t.status)}</div><div class="text-xs" style="color:var(--ex-ink-soft)">${t.message}</div>${t.resolution?`<div class="text-xs mt-1" style="color:var(--ex-good)">Resolution: ${t.resolution}</div>`:''}</div>`).join('') : `<div class="p-6">${EX.empty('No requests yet')}</div>`}</div>`;
};

EX.restoreSessionLocal();
EX.parseHash();
EX.render();
(async ()=>{
  await EX.initDb();
  await EX.initOtherCaps();
  EX.scheduleRender();
})();
