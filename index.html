/* ============ DESIGN TOKENS ============ */
:root{
  --ex-blue-900:#0B2545; --ex-blue-700:#123A7A; --ex-blue-600:#1E4FD6; --ex-blue-500:#2F63EE;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ex-paper);color:var(--ex-ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.font-display{font-family:var(--font-display);text-wrap:balance}
.font-mono,.tnum{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
::selection{background:var(--ex-blue-100)}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ex-line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.ex-card{background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:14px;box-shadow:var(--ex-shadow)}
.ex-input,.ex-select,.ex-textarea{width:100%;background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:9px;padding:8px 11px;font-size:13.5px;color:var(--ex-ink);font-family:inherit}
.ex-input:focus,.ex-select:focus,.ex-textarea:focus{outline:2px solid var(--ex-blue-400);outline-offset:0;border-color:var(--ex-blue-400)}
.ex-label{font-size:11.5px;font-weight:600;color:var(--ex-ink-soft);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.ex-btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:8px 14px;font-size:13.5px;font-weight:600;border:1px solid transparent;transition:filter .12s,background .12s;white-space:nowrap}
.ex-btn:active{filter:brightness(.92)}
.ex-btn-primary{background:var(--ex-blue-600);color:#fff}
.ex-btn-primary:hover{filter:brightness(1.08)}
.ex-btn-ghost{background:var(--ex-surface);border-color:var(--ex-line);color:var(--ex-ink)}
.ex-btn-ghost:hover{background:var(--ex-blue-50)}
.ex-btn-danger{background:var(--ex-bad-bg);color:var(--ex-bad)}
.ex-btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.ex-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6}
.ex-pill-good{background:var(--ex-good-bg);color:var(--ex-good)}
.ex-pill-warn{background:var(--ex-warn-bg);color:var(--ex-warn)}
.ex-pill-bad{background:var(--ex-bad-bg);color:var(--ex-bad)}
.ex-pill-info{background:var(--ex-info-bg);color:var(--ex-info)}
.ex-pill-demo{background:var(--ex-demo-bg);color:var(--ex-demo)}
.ex-pill-neutral{background:var(--ex-line-soft);color:var(--ex-ink-soft)}
.ex-table{width:100%;border-collapse:collapse;font-size:13.5px}
.ex-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ex-ink-soft);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--ex-line);white-space:nowrap}
.ex-table td{padding:11px 12px;border-bottom:1px solid var(--ex-line-soft);vertical-align:middle}
.ex-table tbody tr{transition:background .1s}
.ex-table tbody tr:hover{background:var(--ex-blue-50)}
.ex-nav-link{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ex-ink-soft)}
.ex-nav-link:hover{background:var(--ex-blue-50);color:var(--ex-ink)}
.ex-nav-link.active{background:var(--ex-blue-600);color:#fff}
.ex-nav-link.active svg{color:#fff}
.ex-modal-backdrop{position:fixed;inset:0;background:rgba(10,17,32,.5);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.ex-scrollbar-thin::-webkit-scrollbar{width:6px}
.ex-kanban-col{background:var(--ex-line-soft);border-radius:12px;padding:10px;min-width:250px}
.ex-kcard{background:var(--ex-surface);border:1px solid var(--ex-line);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--ex-shadow);cursor:pointer}
.ex-kcard:hover{border-color:var(--ex-blue-400)}
[hidden]{display:none!important}
.ex-fade-in{animation:exfade .18s ease}
@keyframes exfade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ex-toast{background:var(--ex-ink);color:var(--ex-paper);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--ex-shadow)}
:root[data-theme="dark"] .ex-toast, @media (prefers-color-scheme:dark){.ex-toast{background:var(--ex-surface-raised);border:1px solid var(--ex-line)}}
.ex-spark{stroke-width:2;fill:none}
.ex-badge-dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.ex-focus-ring:focus-visible{outline:2px solid var(--ex-blue-500);outline-offset:2px}

/* ---------------- CONFIG / SCHEMA / CONSTANTS ---------------- */

EX.fmtMoney = (n,ccy)=>{ ccy=ccy||'INR'; const c=EX.CURRENCIES[ccy]||EX.CURRENCIES.INR; n = Math.round((n||0));
  return c.symbol + n.toLocaleString(c.locale); };

EX.ROLES = {
  super_admin:{label:'Super Admin / Managing Director', group:'Leadership'},
  ops_head:{label:'Operations Head / CEO', group:'Leadership'},
  hr:{label:'HR', group:'Leadership'},
  accounts:{label:'Accounts', group:'Leadership'},
  creative_head:{label:'Creative Head', group:'Leadership'},
  sales_exec:{label:'Sales Executive', group:'Sales & Delivery'},
  dme:{label:'Digital Marketing Executive', group:'Sales & Delivery'},
  graphic_designer:{label:'Graphic Designer', group:'Sales & Delivery'},
  video_editor:{label:'Video Editor', group:'Sales & Delivery'},
  videographer:{label:'Videographer', group:'Sales & Delivery'},

  outsourced_editor:{label:'Outsourced Video Editor', group:'Limited Access'},

// Roles whose designated reports (managerId chain) form the "digital marketing" line:
// DME's own interns are addressed as "Digital Marketing Intern" throughout, even though
// they share the generic 'intern' role value — they are distinguished by managerId.
EX.isDmIntern = function(emp){
  if(!emp || emp.role!=='intern') return false;
  const mgr = EX.get('employees').find(e=>e.id===emp.managerId);
  return !!(mgr && mgr.role==='dme');
};
// Creative Head's directly-managed team = interns/part-timers/video editors whose manager is the Creative Head (or, absent that, everyone in those roles who is not a DM intern) — used for scoping dashboards/attention/task-assignment.
EX.isCreativeTeamMember = function(emp, creativeHeadId){
  if(!emp) return false;
  if(!['intern','parttime','video_editor'].includes(emp.role)) return false;
  if(EX.isDmIntern(emp)) return false;
  if(creativeHeadId) return emp.managerId===creativeHeadId;
  return true;
};

/* ---- Supabase-backed adapter, built to the exact same shape the rest of this app
   already expects from EX.CAP.db (a Firestore-like collection()/doc()/onSnapshot()
   interface) — this is the ONLY layer that changed to make the app self-hostable;
   every EX.get/add/patch/setId/remove/setConfig call above is untouched. ---- */
EX.mapSupabaseError = function(e){
  const msg = (e && e.message) || '';
  let code = 'unavailable';
  if(/JWT|api key|apikey/i.test(msg)) code = 'not_granted';
  else if(/permission denied|RLS|policy/i.test(msg)) code = 'revoked';
  else if(/invalid input|invalid_argument|out of range/i.test(msg)) code = 'invalid_argument';
  else if(/payload too large/i.test(msg)) code = 'resource_exhausted';
  return Object.assign(new Error(msg || 'Supabase request failed'), {code, message: msg});
};
EX.makeSupabaseDb = function(sb){
  function wrapCollection(name){
    return {
      async add(payload){
        const { data, error } = await sb.from(name).insert({ data: payload }).select('id').single();
        if(error) throw EX.mapSupabaseError(error);
        return { id: data.id };
      },
      doc(id){
        return {
          async set(payload){
            const { error } = await sb.from(name).upsert({ id, data: payload });
            if(error) throw EX.mapSupabaseError(error);
          },
          async update(payload){
            const { data: existing, error: selErr } = await sb.from(name).select('data').eq('id', id).maybeSingle();
            if(selErr) throw EX.mapSupabaseError(selErr);
            const merged = Object.assign({}, existing && existing.data, payload);
            const { error } = await sb.from(name).update({ data: merged, updated_at: new Date().toISOString() }).eq('id', id);
            if(error) throw EX.mapSupabaseError(error);
          },
          async delete(){
            const { error } = await sb.from(name).delete().eq('id', id);
            if(error) throw EX.mapSupabaseError(error);
          },
        };
      },
      onSnapshot(onNext, onError){
        async function load(){
          const { data, error } = await sb.from(name).select('id,data,created_at,updated_at').order('created_at', { ascending: true });
          if(error){ onError && onError(EX.mapSupabaseError(error)); return; }
          onNext({ docs: (data||[]).map(r => ({ id: r.id, data: () => Object.assign({}, r.data, {
            _createdAt: r.created_at ? new Date(r.created_at).getTime() : undefined,
            _updatedAt: r.updated_at ? new Date(r.updated_at).getTime() : undefined,
          }) })) });
        }
        load();
        try{
          sb.channel('rt_'+name)
            .on('postgres_changes', { event:'*', schema:'public', table:name }, load)
            .subscribe();
        }catch(e){ console.warn('realtime subscribe failed for', name, e); }
      },
    };
  }
  return {
    collection: wrapCollection,
    doc(path){
      const idx = path.indexOf('/');
      const table = idx===-1 ? path : path.slice(0, idx);
      const id = idx===-1 ? null : path.slice(idx+1);
      return {
        async set(payload){
          const { error } = await sb.from(table).upsert({ id, data: payload });
          if(error) throw EX.mapSupabaseError(error);
        },
        async update(payload){
          const { data: existing, error: selErr } = await sb.from(table).select('data').eq('id', id).maybeSingle();
          if(selErr) throw EX.mapSupabaseError(selErr);
          const merged = Object.assign({}, existing && existing.data, payload);
          const { error } = await sb.from(table).update({ data: merged, updated_at: new Date().toISOString() }).eq('id', id);
          if(error) throw EX.mapSupabaseError(error);
        },
        onSnapshot(onNext, onError){
          async function load(){
            const { data, error } = await sb.from(table).select('data').eq('id', id).maybeSingle();
            if(error){ onError && onError(EX.mapSupabaseError(error)); return; }
            onNext({ exists: !!data, data: () => data && data.data });
          }
          load();
          try{
            sb.channel('rt_'+table+'_'+id)
              .on('postgres_changes', { event:'*', schema:'public', table, filter:`id=eq.${id}` }, load)
              .subscribe();
          }catch(e){ console.warn('realtime subscribe failed for', table, e); }
        },
      };
    },
  };
};
EX.makeSupabaseStorage = function(sb){
  const BUCKET = (window.EX_CONFIG && window.EX_CONFIG.STORAGE_BUCKET) || 'assets';
  return {
    async upload(file){
      const ext = ((file.name||'').split('.').pop() || 'bin').toLowerCase();
      const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:false, contentType: file.type || undefined });
      if(error) throw EX.mapSupabaseError(error);
      const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
      return { id: path, url: data && data.publicUrl };
    },
  };
};
EX.makeBrowserDownloads = function(){
  return {
    async save({filename, data}){
      const blob = (typeof data==='string') ? new Blob([data], {type:'text/plain;charset=utf-8'}) : new Blob([JSON.stringify(data)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'download.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
    },
  };
};
EX.makeAiClient = function(){
  async function callApi(body){
    let res;
    try{ res = await fetch('/api/ai', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }); }
    catch(e){ throw {code:'unavailable', message:'Could not reach the AI service.'}; }
    if(!res.ok){
      let err = {}; try{ err = await res.json(); }catch(_){ }
      throw { code: err.code || 'unavailable', message: err.error || ('AI request failed ('+res.status+')') };
    }
    return res.json();
  }
  async function sample(input, opts){
    opts = opts || {};
    const messages = Array.isArray(input) ? input.map(m=> typeof m==='string'? {role:'user', content:m} : m) : [{role:'user', content:String(input)}];
    const { text } = await callApi({ mode:'text', messages });
    if(typeof opts.onText === 'function'){
      // This proxy is request/response (not a live token stream), so we reveal the
      // finished answer progressively to keep the existing "typing" UI feeling alive.
      const t = text || '';
      const step = Math.max(10, Math.round(t.length/50));
      for(let i=step;i<t.length;i+=step){ opts.onText({text:t.slice(0,i)}); await new Promise(r=>setTimeout(r,14)); }
      opts.onText({text:t});
    }
    return {text};
  }
  sample.json = async function(input, opts){
    const prompt = Array.isArray(input) ? input.map(m=>(m&&m.role?m.role+': ':'')+(m&&m.content!==undefined?m.content:m)).join('\n') : String(input);
    const { json } = await callApi({ mode:'json', prompt });
    return json;
  };
  return sample;
};

EX.sb = null;
EX.initDb = async function(){
  const cfg = window.EX_CONFIG || {};
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase){
    EX.dbOffline = true; EX.scheduleRender(); return;
  }
  try{
    EX.sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    EX.CAP.db = EX.makeSupabaseDb(EX.sb);
  }catch(e){ console.warn('Supabase init failed', e); EX.CAP.db = null; EX.sb = null; }
  if(!EX.CAP.db){ EX.dbOffline = true; EX.scheduleRender(); return; }
  // IMPORTANT: wait for the Supabase Auth session to finish loading/attaching to
  // this client BEFORE subscribing to any table. supabase-js restores a
  // persisted session asynchronously in the background after createClient(), and
  // a request made before that finishes goes out as the anon role — which, under
  // this app's Row Level Security (authenticated-only), silently comes back
  // empty rather than erroring. That previously caused two real, confusing bugs:
  // (1) a page refresh could see an empty employees list for a moment, decide
  // the signed-in employee record was "missing", and sign the user straight back
  // out; (2) a realtime channel subscribed before the session attached could
  // miss postgres_changes events (e.g. a just-added employee not appearing until
  // something else — like signing out and back in — re-established it). A 6s
  // cap keeps a slow/unresponsive Supabase Auth check from blocking the whole
  // app from loading at all.
  await Promise.race([ EX.initAuth(), new Promise(resolve=>setTimeout(resolve, 6000)) ]);
  EX.COLLECTIONS.forEach(EX.watchCollection);
  // config singleton doc
  try{
    EX.CAP.db.doc('config/company').onSnapshot((snap)=>{
      EX.data.companyConfig = snap.exists ? snap.data() : null;
      EX.scheduleRender();
    });
  }catch(e){}
};

EX.copyToClipboard = async function(data, label){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(typeof data==='string'?data:JSON.stringify(data));
      EX.toast('Copied '+(label||'content')+' to clipboard instead.', 'good');
      return true;
    }
  }catch(e){ /* clipboard blocked too — nothing more we can do from here */ }
  return false;
};
EX.downloadFile = async function(filename, data){
  if(!EX.CAP.downloads){
    const copied = await EX.copyToClipboard(data, filename);
    if(!copied) EX.toast('Downloads are not available in this view, and clipboard access was also blocked.', 'bad');
    return;
  }
  try{
    await EX.CAP.downloads.save({filename, data});
    EX.toast('Saved '+filename, 'good');
  }catch(e){
    if(e && e.code==='declined') return;
    const reason = (e && e.code && EX.DOWNLOADS_ERR_COPY[e.code]) || (e && e.message) || 'an unexpected error occurred';
    const copied = await EX.copyToClipboard(data, filename);
    EX.toast(`Download failed — ${reason}.${copied?' Copied the content to your clipboard instead.':''}`, 'bad');
  }
};
EX.toCsv = function(rows, columns){
  const esc = (v)=>{ v = v===undefined||v===null?'':String(v); if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"'; return v; };
  const head = columns.map(c=>esc(c.label)).join(',');
  const body = rows.map(r=> columns.map(c=> esc(typeof c.get==='function'? c.get(r) : r[c.key])).join(',')).join('\n');
  return head+'\n'+body;
};

// Finds the employee record matching EX.authEmail (if any) and makes it the
// active session. Called from EX.render() on every render while signed in to
// Supabase Auth but not yet mapped to an employee, so it catches the moment
// either the auth session or the employees list becomes available (whichever
// arrives second).
EX.syncSessionFromAuth = function(){
  if(!EX.authEmail || !EX.dbReady) return;
  const email = EX.authEmail.toLowerCase();
  const emp = EX.get('employees').find(e=> (e.email||'').toLowerCase()===email);
  if(emp && (EX.session.mode!=='staff' || EX.session.employeeId!==emp.id)){
    EX.session = {mode:'staff', employeeId:emp.id, portalClientId:null};
    EX.saveSessionLocal();
    EX.addAudit('Signed in', 'employees', emp.id, null, null);
  }
};
// ---- Finishing first-time bootstrap after a deferred/confirmed signup ----
// EX.submitBootstrap (below) can't always create the first employee record
// right when the "Create workspace" form is submitted: if the Supabase
// project requires email confirmation, signUp() returns no active session yet,
// and Row Level Security correctly refuses an unauthenticated write — trying
// to write anyway would throw. So bootstrap only writes the employee record
// once a real session actually exists; EX.PENDING_BOOTSTRAP_KEY remembers the
// name they typed in the meantime, and this function finishes the job the
// moment a real, matching Supabase Auth session shows up (confirmation click,
// or a plain sign-in) for a workspace that still has zero employees.
EX.PENDING_BOOTSTRAP_KEY = 'ex_pending_bootstrap_v1';
EX.completeBootstrap = async function(email, name){
  await EX.add('employees', {name: name || (email.split('@')[0]), email, role:'super_admin', department:'Leadership', status:'Active', employmentType:'Full-time', joiningDate:EX.now(), skills:[], managerId:null});
  await EX.setConfig({name:'Engage X Business Solutions', createdAt:EX.now(), baseCurrency:'INR', countries:['India','UAE','Saudi Arabia','Kuwait'], reminderSchedule:[7,3,1,0,-1,-3,-7], bank:{}, qrAssetId:null, taxLabel:'GST', taxRate:18});
  try{ localStorage.removeItem(EX.PENDING_BOOTSTRAP_KEY); }catch(e){}
};
EX._bootstrapCompleting = false;
EX.maybeAutoCompleteBootstrap = async function(){
  if(!EX.authEmail || !EX.dbReady) return;
  if(EX.get('employees').length > 0) return; // not a fresh workspace — nothing to finish
  if(EX._bootstrapCompleting) return;
  EX._bootstrapCompleting = true;
  try{
    let pendingName = null;
    try{
      const raw = localStorage.getItem(EX.PENDING_BOOTSTRAP_KEY);
      if(raw){
        const p = JSON.parse(raw);
        if(p && p.email && p.email.toLowerCase()===EX.authEmail.toLowerCase()) pendingName = p.name;
      }
    }catch(e){}
    await EX.completeBootstrap(EX.authEmail, pendingName);
  }catch(e){
    console.warn('auto-complete bootstrap failed', e);
  }finally{
    EX._bootstrapCompleting = false;
  }
};
EX.signOut = function(){
  if(EX.sb){ try{ EX.sb.auth.signOut(); }catch(e){} }
  EX.authEmail = null;
  EX.session = {mode:null, employeeId:null, portalClientId:null};
  EX.saveSessionLocal();
  EX.route('');
};

  return `<div class="ex-card p-5">

      <button class="ex-btn ex-btn-primary w-full justify-center">${EX.icon('arrow-right','w-4 h-4')} Create workspace</button>
    </form>
  </div>`;

EX.submitBootstrap = async function(ev){
  ev.preventDefault();
  if(!EX.sb){ EX.toast('Not connected to the workspace database.', 'bad'); return; }
  const fd = new FormData(ev.target);
  const name = fd.get('name');
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  EX.ui.bootstrapError = null;
  let signUpData = null;
  try{
    const { data, error } = await EX.sb.auth.signUp({ email, password });
    if(error){ EX.ui.bootstrapError = error.message || 'Could not create your login.'; EX.scheduleRender(); return; }
    signUpData = data;
  }catch(e){
    EX.ui.bootstrapError = 'Could not create your login.'; EX.scheduleRender(); return;
  }
  // Remember the name they typed so EX.completeBootstrap() can use it once a
  // real session exists — see below for why we can't necessarily write the
  // employee record right this instant.
  try{ localStorage.setItem(EX.PENDING_BOOTSTRAP_KEY, JSON.stringify({email, name})); }catch(e){}
  if(signUpData && signUpData.session){
    // We already have a real, active session (email confirmation is off, or
    // wasn't required) — finish right away rather than waiting for the next
    // auth-state event.
    await EX.completeBootstrap(email, name);
  }else{
    // Supabase project requires email confirmation — there's no active session
    // yet, so writing the employee record now would be rejected by Row Level
    // Security (correctly — an unconfirmed signup isn't a real signed-in user
    // yet). EX.maybeAutoCompleteBootstrap() finishes this the moment they
    // confirm and a real session shows up.
    EX.ui.bootstrapNeedsConfirm = email;
  }
  EX.scheduleRender();
};
EX.submitLogin = async function(ev){
  ev.preventDefault();
  if(!EX.sb){ EX.toast('Not connected to the workspace database.', 'bad'); return; }
  const fd = new FormData(ev.target);
  const email = (fd.get('email')||'').trim();
  const password = fd.get('password');
  EX.ui.loginError = null;
  EX.ui.loginBusy = true;
  EX.scheduleRender();
  try{
    const { error } = await EX.sb.auth.signInWithPassword({ email, password });
    if(error) EX.ui.loginError = /invalid/i.test(error.message||'') ? 'Incorrect email or password.' : (error.message || 'Sign-in failed.');
  }catch(e){
    EX.ui.loginError = 'Sign-in failed — please try again.';
  }
  EX.ui.loginBusy = false;
  EX.scheduleRender();
};

/* ---------------- GLOBAL ERROR SURFACING ----------------
   Every write goes through EX.CAP.db (a Claude Artifact capability call), which can
   reject with a stable error code. Previously nothing here awaited those rejections
   with a catch, so a failed save just did nothing visible — it looked like a broken
   button. This maps known error codes to plain-English toasts and, as a safety net,
   catches ANY promise rejection anywhere in the app that nothing else handled. */
EX.DB_ERR_COPY = {
  invalid_argument: 'some of the data entered looks invalid — please check the fields and try again',
  resource_exhausted: 'this record has too much data attached — try trimming it and saving again',
  quota_exceeded: 'this workspace has reached its data limit — please remove old records first',
  unavailable: 'the workspace database is temporarily unavailable — please try again in a moment',
  revoked: 'database access was denied — check the Supabase row-level-security policies for this table',
  not_granted: 'this needs database access that has not been configured yet — check SUPABASE_URL/SUPABASE_ANON_KEY in config.js',
  capability_disabled: 'database features are currently disabled for this workspace',
  capability_removed: 'database features were removed — ask an admin to re-enable them',
  transform_error: 'that data could not be saved in this format — please check the fields and try again',
  not_declared: 'this feature is not available in this view',
};
EX.friendlyErrorMessage = function(e, action){
  const prefix = action ? (action+' failed — ') : 'That did not work — ';
  const code = e && e.code;
  if(code && EX.DB_ERR_COPY[code]) return prefix + EX.DB_ERR_COPY[code] + '.';
  if(e && e.message) return prefix + e.message;
  return prefix + 'an unexpected error occurred. Please try again.';
};
window.addEventListener('unhandledrejection', function(ev){
  const e = ev.reason;
  console.warn('Unhandled promise rejection:', e);
  if(!(e && e._exHandled)){
    try{ EX.toast(EX.friendlyErrorMessage(e), 'bad'); }catch(_){}
  }
  ev.preventDefault();
});

EX.formField = function(f, value){
  const v = value===undefined||value===null?'':value;
  const id = 'f_'+f.key;
  const req = f.required?'required':'';
  let input;
  if(f.type==='select'){
    input = `<select id="${id}" name="${f.key}" class="ex-select" ${req}>${(f.options||[]).map(o=>{
      const ov = typeof o==='object'?o.value:o; const ol = typeof o==='object'?o.label:o;
      return `<option value="${ov}" ${String(ov)===String(v)?'selected':''}>${ol}</option>`;
    }).join('')}</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="${id}" name="${f.key}" class="ex-textarea" rows="${f.rows||3}" placeholder="${f.placeholder||''}" ${req}>${v}</textarea>`;
  } else if(f.type==='checkbox'){
    return `<label class="flex items-center gap-2 text-sm py-1"><input type="checkbox" id="${id}" name="${f.key}" ${v?'checked':''} class="w-4 h-4"/> ${f.label}</label>`;
  } else if(f.type==='date'){
    input = `<input type="date" id="${id}" name="${f.key}" class="ex-input" value="${v?new Date(v).toISOString().slice(0,10):''}" ${req}/>`;
  } else {
    input = `<input type="${f.type||'text'}" id="${id}" name="${f.key}" class="ex-input" placeholder="${f.placeholder||''}" value="${String(v).replace(/"/g,'&quot;')}" ${req} ${f.step?`step="${f.step}"`:''}/>`;
  }
  return `<div>${f.label?`<label class="ex-label" for="${id}">${f.label}${f.required?' *':''}</label>`:''}${input}${f.hint?`<div class="text-[11px] mt-1 leading-snug" style="color:var(--ex-ink-soft)">${f.hint}</div>`:''}</div>`;
};
EX.formGrid = function(fields, data, cols){
  data = data||{};
  return `<div class="grid grid-cols-1 ${cols===2?'sm:grid-cols-2':''} gap-3">${fields.map(f=> f.full? `<div class="${cols===2?'sm:col-span-2':''}">${EX.formField(f,data[f.key])}</div>` : EX.formField(f,data[f.key])).join('')}</div>`;
};
EX.readForm = function(formEl, fields){
  const fd = new FormData(formEl);
  const out = {};
  fields.forEach(f=>{
    if(f.type==='checkbox'){ out[f.key] = formEl.querySelector('#f_'+f.key).checked; }
    else if(f.type==='number'){ const n = fd.get(f.key); out[f.key] = n===''||n===null? null : Number(n); }
    else if(f.type==='date'){ const d = fd.get(f.key); out[f.key] = d? new Date(d).getTime() : null; }
    else out[f.key] = fd.get(f.key);
  });
  return out;
};

EX.render = function(){
  const root = document.getElementById('app');
  // Keep EX.session in sync with whoever is actually signed in to Supabase
  // Auth — this is what replaces the old "pick a profile" step with real login.
  if(EX.session.mode!=='portal') EX.syncSessionFromAuth();
  EX.maybeAutoCompleteBootstrap();
  // Defense in depth: a 'staff'/'portal' session is only legitimate if there is
  // a live Supabase Auth session behind it. The locally-cached ex_os_session_v1
  // session (EX.session) can otherwise outlive the real Supabase session — e.g.
  // it was signed out on another device/tab, the token was revoked, or it just
  // expired while the browser was closed — in which case EX.authEmail comes
  // back null. Row Level Security would eventually block all data access for
  // such a session too, but don't rely on that alone to catch it client-side;
  // check for it directly once we actually know the auth state (EX.authReady).
  if((EX.session.mode==='staff' || EX.session.mode==='portal') && EX.authReady && !EX.authEmail){
    EX.signOut(); root.innerHTML = EX.renderSignIn(); return;
  }
  if(EX.session.mode!=='staff' && EX.session.mode!=='portal'){
    root.innerHTML = EX.renderSignIn();
    return;
  }
  if(!EX.dbReady && !EX.dbOffline){ root.innerHTML = `<div class="min-h-screen flex items-center justify-center">${EX.spinner()}</div>`; return; }
  // if signed-in employee record was removed, sign out (also clears the real Supabase Auth session)
  if(EX.session.mode==='staff' && !EX.currentEmployee()){ EX.signOut(); root.innerHTML = EX.renderSignIn(); return; }

  if(EX.session.mode==='portal'){
    let key = EX.route_.key && EX.route_.key.startsWith('portal-') ? EX.route_.key : 'portal-dashboard';
    const fn = EX.portalViews[key] || EX.portalViews['portal-dashboard'];
    root.innerHTML = EX.portalShell(fn(EX.route_.param));
    if(fn.afterRender) fn.afterRender();
    return;
  }
  // staff mode
  let key = EX.route_.key || 'dashboard';
  if(!EX.can(key)) key = 'dashboard';
  const fn = EX.views[key] || EX.views['dashboard'];
  root.innerHTML = EX.shell(fn(EX.route_.param));
  if(fn.afterRender) fn.afterRender();
};

EX.seqNumber = function(col, prefix, dateField){
  const year = new Date().getFullYear();
  const count = EX.get(col).filter(d=> new Date(d._createdAt||0).getFullYear()===year).length;
  return `${prefix}-${year}-${String(count+1).padStart(4,'0')}`;

/* ---- attendance ---- */
EX.todayKey = ()=> new Date().toISOString().slice(0,10);
EX.attendanceFor = (empId)=> EX.byId('attendance', empId) || {id:empId, days:{}};
EX.clockIn = async function(empId){
  const day = EX.todayKey();
  const existing = EX.byId('attendance', empId);
  const patchBody = {days:{[day]:{checkIn: EX.now(), status:'Present'}}};
  if(existing) await EX.patch('attendance', empId, patchBody);
  else await EX.setId('attendance', empId, patchBody);
  EX.toast('Clocked in for today','good');
};
EX.clockOut = async function(empId){
  const day = EX.todayKey();
  const existing = EX.byId('attendance', empId);
  const checkIn = existing && existing.days && existing.days[day] && existing.days[day].checkIn;
  const hours = checkIn ? Math.round(((EX.now()-checkIn)/3600000)*10)/10 : null;
  const patchBody = {days:{[day]:{checkOut: EX.now(), hours}}};
  if(existing) await EX.patch('attendance', empId, patchBody);
  else await EX.setId('attendance', empId, patchBody);
  EX.toast('Clocked out — have a good day','good');
};
EX.setAttendanceStatus = async function(empId, day, status){
  if(!status) return;
  const existing = EX.byId('attendance', empId);
  const body = {days:{[day]:{status}}};
  try{
    if(existing) await EX.patch('attendance', empId, body); else await EX.setId('attendance', empId, body);
  }catch(e){ return; }
  EX.toast(`Attendance set to ${status}`,'good');
};
EX.monthKey = (d)=> (d||new Date()).toISOString().slice(0,7);
EX.employeeMonthStats = function(empId, ym){
  ym = ym || EX.monthKey();
  const att = EX.byId('attendance', empId);
  const days = (att && att.days) || {};
  let daysPresent=0, hoursWorked=0, lateDays=0, leaveDays=0, wfhDays=0;
  Object.keys(days).forEach(d=>{
    if(!d.startsWith(ym)) return;
    const rec = days[d];
    if(rec.status==='Present'||rec.checkIn) daysPresent++;
    if(rec.status==='Late') lateDays++;
    if(rec.status==='Leave') leaveDays++;
    if(rec.status==='WFH') wfhDays++;
    if(rec.hours) hoursWorked += rec.hours;
  });
  const tasks = EX.get('tasks').filter(t=> t.assignedTo===empId && t._createdAt && EX.monthKey(new Date(t._createdAt))===ym);
  const completed = tasks.filter(t=> t.status==='Done');
  const onTime = completed.filter(t=> t.deadline && t.completedAt && t.completedAt<=t.deadline);
  const revisions = tasks.reduce((s,t)=> s+(t.revisionCount||0),0);
  const completionRate = tasks.length? completed.length/tasks.length : (daysPresent?1:0);
  const onTimeRate = completed.length? onTime.length/completed.length : 1;
  const workingDaysInMonth = 22;
  const attendanceRate = Math.min(1, daysPresent/workingDaysInMonth);
  const revisionPenalty = Math.min(1, revisions/Math.max(1,tasks.length)/2);
  const score = Math.round((completionRate*40 + onTimeRate*30 + attendanceRate*20 + (1-revisionPenalty)*10));
  return {ym, daysPresent, hoursWorked: Math.round(hoursWorked*10)/10, lateDays, leaveDays, wfhDays,
    tasksAssigned:tasks.length, tasksCompleted:completed.length, onTimeCompleted:onTime.length, revisions,
    completionRate, onTimeRate, attendanceRate, productivityScore: Math.max(0,Math.min(100,score))};
};

/* ---- finance helpers ---- */
EX.paidTotalForInvoice = (invoiceId)=> EX.get('payments').filter(p=>p.invoiceId===invoiceId && p.status==='Paid').reduce((s,p)=>s+(p.amountClaimed||0),0);
EX.recomputeInvoiceStatus = async function(invoiceId){
  const inv = EX.byId('invoices', invoiceId); if(!inv) return;
  if(['Draft','Cancelled','Refunded'].includes(inv.status)) return;
  const paid = EX.paidTotalForInvoice(invoiceId);
  const hasPendingVerification = EX.get('payments').some(p=>p.invoiceId===invoiceId && p.status==='Under Verification');
  let status;
  if(paid>=inv.total) status='Paid';
  else if(hasPendingVerification) status='Under Verification';
  else if(paid>0) status='Partially Paid';
  else if(inv.dueDate && EX.now()>inv.dueDate) status='Overdue';
  else status='Due';
  if(status!==inv.status) await EX.patch('invoices', invoiceId, {status});
};

EX.submitClientPayment = async function(invoiceId, data){
  const inv = EX.byId('invoices', invoiceId); if(!inv) return;
  const receiptSeq = EX.seqNumber('payments','PMT');
  await EX.add('payments', Object.assign({invoiceId, clientId: inv.clientId, status:'Under Verification', ref: receiptSeq}, data));
  await EX.recomputeInvoiceStatus(invoiceId);
  await EX.addNotification({targetRole:'accounts', message:`Payment verification required — ${EX.byId('clients',inv.clientId)?.companyName||'Client'} submitted ${EX.fmtMoney(data.amountClaimed, inv.currency)} via ${data.method}.`, link:'payments'});
  await EX.addAudit('Client submitted payment','invoices',invoiceId,null,data);
};
EX.verifyPayment = function(paymentId, approve){
  const p = EX.byId('payments', paymentId); if(!p) return;
  if(approve){
    EX.confirmAction('Verify payment', `Mark this ${EX.fmtMoney(p.amountClaimed)} payment as verified and generate a receipt? This updates the client's invoice and receivables.`, async ()=>{
      const receiptNumber = EX.seqNumber('payments','RCT');
      await EX.patch('payments', paymentId, {status:'Paid', verifiedBy:EX.currentEmployee()?.name, verifiedAt:EX.now(), receiptNumber});
      await EX.recomputeInvoiceStatus(p.invoiceId);
      await EX.addAudit('Payment verified','payments',paymentId,{status:'Under Verification'},{status:'Paid'});
      EX.toast('Payment verified — receipt generated','good');
    });
  } else {
    EX.openRejectPaymentModal(paymentId);
  }
};
EX.openRejectPaymentModal = function(paymentId){
  EX.openModal(`${EX.modalHeader('Reject payment')}
    <form onsubmit="EX.submitRejectPayment(event,'${paymentId}')" class="p-5 space-y-3">
      <div><label class="ex-label">Reason *</label><textarea required name="reason" class="ex-textarea" rows="3" placeholder="e.g. Transaction ID does not match bank record"></textarea></div>
      <div class="flex justify-end gap-2 pt-2"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-danger">Reject payment</button></div>
    </form>`);

EX.submitRejectPayment = async function(ev, paymentId){
  ev.preventDefault();
  const reason = new FormData(ev.target).get('reason');
  const p = EX.byId('payments', paymentId);
  await EX.patch('payments', paymentId, {status:'Rejected', rejectionReason:reason, verifiedBy:EX.currentEmployee()?.name, verifiedAt:EX.now()});
  await EX.recomputeInvoiceStatus(p.invoiceId);
  await EX.addAudit('Payment rejected','payments',paymentId,{status:'Under Verification'},{status:'Rejected',reason});
  EX.closeModal();
  EX.toast('Payment rejected','warn');
};

/* ---- lead -> proposal -> won -> client automation ---- */
EX.convertLeadToClient = function(proposalId){
  const prop = EX.byId('proposals', proposalId); if(!prop) return;
  const lead = EX.byId('leads', prop.leadId);
  EX.confirmAction('Convert to Client', `This creates the client profile, billing setup and a starter invoice for <b>${lead?lead.company:prop.company}</b>, and marks the lead & proposal Won. This runs automatically end-to-end.`, async ()=>{
    const country = (lead&&lead.country) || 'India';
    const ccy = (EX.COUNTRIES.find(c=>c.c===country)||{}).ccy || 'INR';
    const dmes = EX.get('employees').filter(e=>e.role==='dme' && e.status==='Active');
    const assignedDme = dmes.length? dmes[Math.floor(Math.random()*dmes.length)].id : null;
    const clientId = await EX.add('clients', {
      companyName: lead?lead.company:prop.company, country, currency:ccy, status:'Active',
      contactPerson: lead?lead.contactPerson:'', email: lead?lead.email:'', phone: lead?lead.phone:'',
      industry: lead?lead.industry:'', assignedDme, assignedSales: lead?lead.assignedTo:null,
      services: prop.services||[], platforms: [], monthlyFee: prop.monthlyFee||0, oneTimeFee: prop.oneTimeFee||0,
      adSpendPassthrough: prop.adSpend||0, billingDay: 5, contractStart: EX.now(), durationMonths: prop.durationMonths||12,
      paymentTerms: prop.paymentTerms||'Net 15', proposalId, healthOverride:null, serviceStatus:'Active',
    });
    await EX.patch('leads', prop.leadId, {stage:'Won'});
    await EX.patch('proposals', proposalId, {status:'Won'});
    // starter invoice for first billing cycle
    const total = (prop.monthlyFee||0);
    const taxRate = (EX.data.companyConfig&&EX.data.companyConfig.taxRate)||18;
    const tax = Math.round(total*taxRate/100);
    await EX.add('invoices', {clientId, invoiceNumber: EX.seqNumber('invoices','INV'), billingPeriod: new Date().toLocaleString('en-IN',{month:'long',year:'numeric'}),
      lineItems:[{desc:'Monthly Retainer — Engage X Service Fee', qty:1, rate:total, amount:total}], subtotal:total, taxRate, taxAmount:tax, total: total+tax,
      currency:ccy, dueDate: EX.now()+15*86400000, status:'Generated'});
    await EX.addNotification({targetRole:'accounts', message:`New client won: ${lead?lead.company:prop.company} — starter invoice generated.`, link:'invoices'});
    await EX.addNotification({targetRole:'ops_head', message:`New client ${lead?lead.company:prop.company} needs onboarding: content calendar, task assignment, platform links.`, link:'clients'});
    await EX.addAudit('Converted proposal to client','proposals',proposalId,null,{clientId});
    EX.toast('Client created — onboarding notifications sent','good');
    EX.route('clients', clientId);
  });
};

/* ---- health scores ---- */
EX.computeClientHealth = function(client){
  const reasons = [];
  let score = 100;
  const invs = EX.get('invoices').filter(i=>i.clientId===client.id);
  const overdue = invs.filter(i=>i.status==='Overdue');
  if(overdue.length){ score-=30; reasons.push(`${overdue.length} overdue invoice(s)`); }
  const content = EX.get('content').filter(c=>c.clientId===client.id);
  const rejected = content.filter(c=>c.status==='Rejected'||c.status==='Revision');
  if(content.length && rejected.length/content.length>0.3){ score-=15; reasons.push('High content revision/rejection rate'); }
  const tickets = EX.get('supportTickets').filter(t=>t.clientId===client.id && t.status!=='Resolved' && t.status!=='Closed');
  if(tickets.length>=2){ score-=15; reasons.push(`${tickets.length} open support tickets`); }
  const meetings = EX.get('meetings').filter(m=>m.clientId===client.id);
  const missed = meetings.filter(m=>m.status==='Client Absent');
  if(missed.length>=2){ score-=15; reasons.push('Repeated missed review meetings'); }
  if(client.serviceStatus==='On Hold'){ score-=25; reasons.push('Service currently on hold'); }
  score = Math.max(0,score);
  const label = score>=75?'Healthy':score>=45?'Watch':'At Risk';
  if(!reasons.length) reasons.push('No risk signals detected — payments current, deliverables on track');
  return {score, label, reasons};
};
EX.computeBusinessHealth = function(kpi){
  const reasons_good=[], reasons_bad=[], actions=[];
  if(kpi.profitMonth>0) reasons_good.push(`Operating profit is positive this month (${EX.fmtMoney(kpi.profitMonth)})`); else reasons_bad.push(`Operating loss this month (${EX.fmtMoney(kpi.profitMonth)})`);
  if(kpi.overdueTotal>0){ reasons_bad.push(`${EX.fmtMoney(kpi.overdueTotal)} sitting in overdue receivables`); actions.push('Chase overdue invoices — see Finance → Receivables'); }
  if(kpi.pipelineValue < kpi.mrr*2){ reasons_bad.push('Sales pipeline is thin relative to current recurring revenue'); actions.push('Sales team to prioritize new discovery calls'); }
  else reasons_good.push('Healthy pipeline coverage relative to recurring revenue');
  if(kpi.atRiskClients>0){ reasons_bad.push(`${kpi.atRiskClients} client(s) flagged At Risk`); actions.push('Account owners to review At Risk clients this week'); }
  const score = Math.max(0,Math.min(100, 60 + (kpi.profitMonth>0?15:-15) + (kpi.overdueTotal>0?-10:5) + (kpi.atRiskClients>0?-10:5) + (kpi.pipelineValue>kpi.mrr*2?10:-5)));
  const label = score>=75?'Healthy':score>=50?'Watch':'At Risk';
  return {score,label,good:reasons_good,bad:reasons_bad,actions};
};

/* ---- dashboard KPI computation (grounded in real db data) ---- */
EX.computeKPIs = function(){
  const invs = EX.get('invoices');
  const pays = EX.get('payments').filter(p=>p.status==='Paid');
  const clients = EX.get('clients');
  const leads = EX.get('leads');
  const now = new Date(); const ymNow = EX.monthKey(now);
  const invMonth = invs.filter(i=> i._createdAt && EX.monthKey(new Date(i._createdAt))===ymNow);
  const revenueMonth = invMonth.reduce((s,i)=>s+(i.total||0),0);
  const cashMonth = pays.filter(p=>p._createdAt && EX.monthKey(new Date(p._createdAt))===ymNow).reduce((s,p)=>s+(p.amountClaimed||0),0);
  const cashAll = pays.reduce((s,p)=>s+(p.amountClaimed||0),0);
  const receivables = invs.filter(i=>!['Draft','Cancelled','Refunded'].includes(i.status)).reduce((s,i)=> s+Math.max(0,(i.total||0)-EX.paidTotalForInvoice(i.id)),0);
  const overdueTotal = invs.filter(i=>i.status==='Overdue').reduce((s,i)=> s+Math.max(0,(i.total||0)-EX.paidTotalForInvoice(i.id)),0);
  const expenses = EX.get('expenses');
  const expenseMonth = expenses.filter(e=> e.date && EX.monthKey(new Date(e.date))===ymNow).reduce((s,e)=>s+(e.amount||0),0);
  const vendorPayables = EX.get('vendorInvoices').filter(v=>v.status!=='Paid').reduce((s,v)=>s+(v.amount||0),0);
  const profitMonth = revenueMonth - expenseMonth;
  const activeClients = clients.filter(c=>c.status==='Active');
  const mrr = activeClients.reduce((s,c)=>s+(c.monthlyFee||0),0);
  const newLeadsMonth = leads.filter(l=> l._createdAt && EX.monthKey(new Date(l._createdAt))===ymNow).length;
  const pipelineValue = leads.filter(l=>!['Won','Lost'].includes(l.stage)).reduce((s,l)=>s+(Number(l.budget)||0),0);
  const wonMonth = leads.filter(l=>l.stage==='Won' && l._updatedAt && EX.monthKey(new Date(l._updatedAt))===ymNow).length;
  const tasks = EX.get('tasks');
  const tasksToday = tasks.filter(t=> t.deadline && new Date(t.deadline).toDateString()===now.toDateString() && t.status!=='Done');
  const tasksOverdue = tasks.filter(t=> t.deadline && t.deadline<EX.now() && t.status!=='Done');
  const contentPending = EX.get('content').filter(c=>c.status==='Submitted');
  const atRiskClients = clients.filter(c=> EX.computeClientHealth(c).label==='At Risk').length;
  const proposalsPendingApproval = EX.get('proposals').filter(p=>p.status==='Admin Approval').length;
  return {revenueMonth,cashMonth,cashAll,receivables,overdueTotal,expenseMonth,vendorPayables,profitMonth,activeClients:activeClients.length,
    mrr,newLeadsMonth,pipelineValue,wonMonth,tasksToday:tasksToday.length,tasksOverdue:tasksOverdue.length,contentPending:contentPending.length,
    atRiskClients, proposalsPendingApproval, totalLeads:leads.length};
};

// Builds a simple indented org chart from each employee's "Reports to" (managerId) field.
EX.buildReportingWorkflow = function(){
  const emps = EX.get('employees');
  if(!emps.length) return EX.empty('No employees yet');
  const byManager = {};
  emps.forEach(e=>{ if(e.managerId) (byManager[e.managerId]=byManager[e.managerId]||[]).push(e); });
  const topLevel = emps.filter(e=>!e.managerId || !EX.byId('employees', e.managerId));
  const seen = new Set();
  function renderNode(e, depth){
    if(seen.has(e.id)) return ''; // guard against accidental cycles
    seen.add(e.id);
    const reports = (byManager[e.id]||[]).slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    return `<div style="margin-left:${depth*18}px;border-color:var(--ex-line)" class="py-1 border-l ${depth?'':'border-transparent'}">
      <div class="flex items-center gap-2 text-sm py-0.5" style="padding-left:${depth?10:0}px">
        <span class="ex-pill ex-pill-neutral">${(EX.ROLES[e.role]||{}).label||e.role}</span>
        <span class="font-medium">${e.name}</span>
      </div>
      ${reports.map(r=>renderNode(r, depth+1)).join('')}
    </div>`;
  }
  const html = topLevel.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(e=>renderNode(e,0)).join('');
  return html || EX.empty('No reporting structure set yet','Set "Reports to" on each employee to build this chart.');
};

EX.submitLeadForm = async function(ev, existingId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, EX.LEAD_FIELDS);
  data.goals = EX.GOALS.filter(g=> ev.target.querySelector(`[name="goal_${g}"]`).checked);
  const compRaw = new FormData(ev.target).get('competitors')||'';
  data.competitors = compRaw.split(',').map(s=>s.trim()).filter(Boolean);
  EX.closeModal();
  if(existingId){
    const before = EX.byId('leads', existingId);
    await EX.patch('leads', existingId, data);
    await EX.addAudit('Edited lead','leads',existingId, before, data);
    EX.toast('Lead updated','good');
  } else {
    data.stage='New'; data.activities=[{ts:EX.now(), note:'Lead created', byName: EX.currentEmployee()?.name}];
    const id = await EX.add('leads', data);
    await EX.addNotification({targetRole:'sales_exec', message:`New lead assigned: ${data.company}`, link:'crm'});
    await EX.addAudit('Created lead','leads',id,null,data);
    EX.toast('Lead created','good');
    EX.route('crm', id);
  }
};

EX.runProspectAnalysis = async function(leadId){
  const lead = EX.byId('leads', leadId);
  const btn = document.getElementById('ai-analysis-btn');
  const out = document.getElementById('ai-analysis-out');
  if(btn) btn.disabled = true;
  if(out) out.innerHTML = `<div class="flex items-center gap-2 text-sm" style="color:var(--ex-ink-soft)">${EX.spinner(true)} Analyzing…</div>`;
  const prompt = `You are a growth-marketing analyst at Engage X Business Solutions. Analyze this SALES LEAD using ONLY the facts given below — you cannot browse the internet, so never invent facts about their actual website, competitors, or performance. Where you must infer or recommend rather than state a known fact, phrase it as a recommendation, not an observation.

LEAD FACTS:
Company: ${lead.company}
Industry: ${lead.industry||'unknown'}
Location: ${lead.location||''}, ${lead.country||''}
Website: ${lead.website||'not provided'}
Stated requirements: ${lead.requirements||'none provided'}
Goals: ${(lead.goals||[]).join(', ')||'none provided'}
Budget: ${lead.budget?('approx '+lead.budget):'not provided'}
Timeline: ${lead.timeline||'not provided'}
Competitors they mentioned: ${(lead.competitors||[]).join(', ')||'none mentioned / unknown'}
Notes from sales: ${lead.notes||'none'}

Reply with ONLY a JSON object with these keys (arrays of short strings unless noted):
overview (string, 2-3 sentences restating only the given facts), digitalPresenceAudit (array, cautious inferences clearly hedged e.g. "Likely..." — say plainly if there isn't enough info), topProblems (array, max 5), topOpportunities (array, max 5), priorities90d (array, max 5), recommendedServices (array, service names from a typical digital marketing agency catalog), leadTemp (one of "Hot","Warm","Cold"), rationale (1-2 sentences on why that temperature, referencing budget/timeline/fit).`;
  try{
    const analysis = await EX.askAIJson(prompt, {modelTier:'default'});
    analysis.generatedAt = EX.now();
    await EX.patch('leads', leadId, {aiAnalysis: analysis, leadScore: lead.leadScore || (analysis.leadTemp==='Hot'?80:analysis.leadTemp==='Warm'?55:30)});
    await EX.addAudit('Ran AI prospect analysis','leads',leadId,null,{leadTemp:analysis.leadTemp});
    EX.toast('AI analysis complete','good');
  }catch(e){
    if(out) out.innerHTML = `<div class="text-sm" style="color:var(--ex-bad)">${EX.friendlySampleError(e)}</div>`;
  } finally { if(btn) btn.disabled=false; }
};
EX.salesChatHistory = {};
EX.quickAsk = function(q, leadId){
  const form = document.querySelector(`#sales-chat-log`).closest('.ex-card').querySelector('form input[name=q]');
  form.value = q;
  form.closest('form').dispatchEvent(new Event('submit', {cancelable:true}));

EX.askSalesAssistant = async function(ev, leadId){
  ev.preventDefault();
  const q = new FormData(ev.target).get('q');
  ev.target.reset();
  const lead = EX.byId('leads', leadId);
  const log = document.getElementById('sales-chat-log');
  const hist = EX.salesChatHistory[leadId] = EX.salesChatHistory[leadId]||[];
  const rowUser = document.createElement('div'); rowUser.className='text-sm'; rowUser.innerHTML = `<div class="font-semibold text-xs mb-0.5">You</div><div>${q}</div>`;
  log.appendChild(rowUser);
  const rowAi = document.createElement('div'); rowAi.className='text-sm'; rowAi.innerHTML = `<div class="font-semibold text-xs mb-0.5" style="color:var(--ex-blue-600)">AI Sales Assistant</div><div class="ai-live">Thinking…</div>`;
  log.appendChild(rowAi); log.scrollTop = log.scrollHeight;
  const context = `Lead: ${lead.company}, industry ${lead.industry||'unknown'}, requirements: ${lead.requirements||'none'}, goals: ${(lead.goals||[]).join(', ')}, budget: ${lead.budget||'unknown'}, competitors mentioned: ${(lead.competitors||[]).join(', ')||'none'}. Notes: ${lead.notes||'none'}.`;
  hist.push({role:'user', content: (hist.length?q: `You are a senior sales coach at Engage X Business Solutions, a 360° marketing/tech/AI growth agency. Give concrete, specific sales advice for THIS lead. Keep answers under 150 words, practical, no fluff. Never approve pricing or discounts yourself — you may only suggest. Context:\n${context}\n\nQuestion: ${q}`)});
  try{
    const {text} = await EX.askAI(hist, {modelTier:'quick', onText:({text})=>{ rowAi.querySelector('.ai-live').textContent = text; log.scrollTop = log.scrollHeight; }});
    hist.push({role:'assistant', content:text});
  }catch(e){ rowAi.querySelector('.ai-live').textContent = EX.friendlySampleError(e); hist.pop(); }
};

EX.submitCreateProposal = async function(ev){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const leadId = fd.get('leadId') || null;
  let company = (fd.get('company')||'').trim();
  if(leadId){
    return EX.createProposalFromLead(leadId).then(()=> EX.closeModal());
  }
  if(!company){ EX.toast('Please pick a lead or type a company name.','bad'); return; }
  let id;
  try{
    id = await EX.add('proposals', {leadId:null, company, status:'Draft', services:[], monthlyFee:0, oneTimeFee:0, adSpend:0,
      durationMonths:12, paymentTerms:'Net 15', sections:{}, versions:[]});
  }catch(e){ return; }
  await EX.addAudit('Created proposal','proposals',id,null,{company});
  EX.closeModal();
  EX.toast('Proposal created','good');
  EX.route('proposals', id);
};

EX.proposalActions = function(p, role, isAdmin){
  const canSalesReview = ['sales_exec','ops_head','super_admin'].includes(role);
  const btn = (label,fn,cls)=>`<button onclick="${fn}" class="ex-btn ${cls||'ex-btn-ghost'} ex-btn-sm">${label}</button>`;
  const out = [];
  if(p.status==='Draft'||p.status==='Proposal Draft') out.push(btn('Submit for Sales Review', `EX.setProposalStatus('${p.id}','Sales Review')`, 'ex-btn-primary'));
  if(p.status==='Sales Review' && canSalesReview) out.push(btn('Request Admin Approval', `EX.setProposalStatus('${p.id}','Admin Approval')`, 'ex-btn-primary'));
  if(p.status==='Admin Approval' && isAdmin) { out.push(btn('Approve', `EX.setProposalStatus('${p.id}','Approved')`, 'ex-btn-primary')); out.push(btn('Send back to Draft', `EX.setProposalStatus('${p.id}','Proposal Draft')`)); }
  if(p.status==='Admin Approval' && !isAdmin){
    const admins = EX.get('employees').filter(e=>e.role==='super_admin' && e.status!=='Inactive').map(e=>e.name);
    const who = admins.length? admins.join(' or ') : 'a Super Admin';
    out.push(`<span class="text-xs" style="color:var(--ex-ink-soft)">Waiting on ${who} to approve</span>`);
  }
  if(p.status==='Approved') out.push(btn('Mark as Sent', `EX.setProposalStatus('${p.id}','Sent')`, 'ex-btn-primary'));
  if(['Sent'].includes(p.status)) out.push(btn('Move to Negotiation', `EX.setProposalStatus('${p.id}','Negotiation')`));
  if(['Sent','Negotiation'].includes(p.status)){
    out.push(btn('Mark Won → Convert to Client', `EX.convertLeadToClient('${p.id}')`, 'ex-btn-primary'));
    out.push(btn('Mark Lost', `EX.setProposalStatus('${p.id}','Lost')`, 'ex-btn-danger'));
    out.push(btn('Put On Hold', `EX.setProposalStatus('${p.id}','On Hold')`));
  }
  if(p.status==='On Hold') out.push(btn('Resume — back to Negotiation', `EX.setProposalStatus('${p.id}','Negotiation')`, 'ex-btn-primary'));
  return out.join('');
};
EX.setProposalStatus = async function(id, status){
  const p = EX.byId('proposals', id);
  const versions = (p.versions||[]).concat([{ts:EX.now(), note:`Status → ${status}`, byName:EX.currentEmployee()?.name}]).slice(-30);
  await EX.patch('proposals', id, {status, versions});
  await EX.addAudit('Proposal status changed','proposals',id,{status:p.status},{status});
  if(status==='Admin Approval') await EX.addNotification({targetRole:'super_admin', message:`Proposal for ${p.company} needs your approval.`, link:'proposals'});
  if(status==='Sent') await EX.addNotification({targetRole:'sales_exec', message:`Proposal for ${p.company} marked Sent — track opens & follow up.`, link:'proposals'});
  EX.toast(`Status → ${status}`,'good');
};

EX.renderProposalSections = function(s){
  const block = (t,c)=> c? `<div class="mb-3"><div class="text-xs font-semibold mb-1">${t}</div><div class="text-sm leading-relaxed" style="color:var(--ex-ink-soft)">${c}</div></div>`:'';
  return block('Executive Summary', s.executiveSummary)+block('Market & Competitor Context (hedged — not verified web research)', s.marketAnalysis)+
    block('Growth Opportunities', s.growthOpportunities)+block('Recommended Strategy', s.recommendedStrategy)+
    block('90-Day Roadmap', s.roadmap)+block('KPIs We Will Track', s.kpis)+block('Why Engage X', s.whyEngageX);
};
EX.generateProposalAI = async function(id){
  const p = EX.byId('proposals', id);
  const lead = EX.byId('leads', p.leadId);
  const btn = document.getElementById('prop-ai-btn'); const out = document.getElementById('prop-ai-out');
  if(btn) btn.disabled=true;
  if(out) out.innerHTML = `<div class="flex items-center gap-2 text-sm" style="color:var(--ex-ink-soft)">${EX.spinner(true)} Drafting proposal narrative…</div>`;
  const prompt = `Draft proposal narrative sections for Engage X Business Solutions, a 360° sales+marketing+technology+AI growth partner (not just a vendor). Client: ${p.company}. Known facts: industry ${lead?lead.industry:'unknown'}, requirements: ${lead?lead.requirements:'n/a'}, goals: ${lead&&lead.goals?lead.goals.join(', '):'n/a'}. Selected services: ${(p.services||[]).map(s=>s.item).join(', ')||'to be finalized'}. Do not invent facts about the client's actual current performance or real competitors — hedge anything not explicitly given ("likely", "based on typical businesses in this category"). Position Engage X as a strategic growth partner, confident but not overpromising results.
Reply with ONLY a JSON object, each value a short paragraph (2-4 sentences) of plain text (no markdown): executiveSummary, marketAnalysis, growthOpportunities, recommendedStrategy, roadmap (a 90-day plan in prose), kpis (what will be measured), whyEngageX.`;
  try{
    const sections = await EX.askAIJson(prompt, {modelTier:'default'});
    const versions = (p.versions||[]).concat([{ts:EX.now(), note:'AI narrative generated', byName:EX.currentEmployee()?.name}]).slice(-30);
    await EX.patch('proposals', id, {sections, status: p.status==='Draft'?'Proposal Draft':p.status, versions});
    EX.toast('Proposal narrative drafted — review before sending','good');
  }catch(e){ if(out) out.innerHTML = `<div class="text-sm" style="color:var(--ex-bad)">${EX.friendlySampleError(e)}</div>`; }
  finally{ if(btn) btn.disabled=false; }
};

EX.saveProposalSections = async function(ev,id){
  ev.preventDefault();

EX.saveProposalServices = async function(ev,id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const checked = fd.getAll('svc');
  const services = checked.map(v=>{ const [cat,item]=v.split('|||'); const qty = fd.get('qty|||'+item); return {cat,item,qty:qty?Number(qty):null}; });
  await EX.patch('proposals', id, {services});
  EX.closeModal(); EX.toast('Services updated','good');
};

EX.exportProposal = async function(id){
  const p = EX.byId('proposals', id); const s = p.sections||{};
  const text = `ENGAGE X BUSINESS SOLUTIONS — PROPOSAL\nPrepared for: ${p.company}\nDate: ${EX.fmtDate(EX.now())}\nStatus: ${p.status}\n\nEXECUTIVE SUMMARY\n${s.executiveSummary||''}\n\nMARKET & COMPETITOR CONTEXT\n${s.marketAnalysis||''}\n\nGROWTH OPPORTUNITIES\n${s.growthOpportunities||''}\n\nRECOMMENDED STRATEGY\n${s.recommendedStrategy||''}\n\n90-DAY ROADMAP\n${s.roadmap||''}\n\nKPIs\n${s.kpis||''}\n\nWHY ENGAGE X\n${s.whyEngageX||''}\n\nSERVICES\n${(p.services||[]).map(x=>'- '+x.item+(x.qty?(' ('+x.qty+'/mo)'):'')).join('\n')}\n\nCOMMERCIALS\nEngage X Service Fee (monthly): ${EX.fmtMoney(p.monthlyFee||0)}\nOne-time fee: ${EX.fmtMoney(p.oneTimeFee||0)}\nThird-party ad spend (pass-through): ${EX.fmtMoney(p.adSpend||0)}\nPayment terms: ${p.paymentTerms||''}\n`;
  await EX.downloadFile(`Proposal-${p.company.replace(/\s+/g,'-')}.txt`, text);
};

EX.PLATFORM_TYPES = ['Instagram','Facebook','LinkedIn','TikTok','YouTube','Google Business Profile','Website','WhatsApp','E-commerce Store','CRM','Booking System','Other'];
EX.canSeeFinancials = function(){
  return ['super_admin','ops_head','accounts','sales_exec','dme'].includes(EX.currentRole());
};

EX.views['clients'] = function(param){
  if(param) return EX.clientDetail(param);
  const clients = EX.get('clients');
  const finance = EX.canSeeFinancials();
  return `${EX.pageHead('Clients', `${clients.length} clients · ${clients.filter(c=>c.status==='Active').length} active`, finance?`<button onclick="EX.showAddClientModal()" class="ex-btn ex-btn-primary">${EX.icon('plus','w-4 h-4')} Add client</button>`:'')}
  ${EX.dataTable({id:'clientTable', rows:clients, searchKey:c=>c.companyName, rowClick:c=>`EX.route('clients','${c.id}')`,
    filterOptions:['Active','On Hold','Churned'], filterKey:c=>c.status, filterLabel:'status',
    columns:[
      {label:'Company', get:c=>`<div class="flex items-center gap-2">${EX.avatar(c.companyName,26)}<div><div class="font-medium">${c.companyName}</div><div class="text-xs" style="color:var(--ex-ink-soft)">${c.industry||''}</div></div></div>`},
      {label:'Status', get:c=>EX.pill(c.status)},
      {label:'Health', get:c=>{const h=EX.computeClientHealth(c); return EX.pill(h.label);}},
      {label:'Country', get:c=>c.country||'—'},
      ...(finance? [{label:'Monthly fee', get:c=>EX.fmtMoney(c.monthlyFee||0,c.currency)}] : []),
      {label:'DME', get:c=>{const e=EX.byId('employees',c.assignedDme); return e?e.name:'—';}},
    ], emptyLabel:'No clients yet', emptySub:'Clients are created automatically when a proposal is marked Won.'})}`;
};
EX.showAddClientModal = function(){
  if(!EX.canSeeFinancials()){ EX.toast('You do not have permission to add clients.','bad'); return; }
  const fields = EX.CLIENT_FIELDS.map(f=> f.key==='assignedDme'? Object.assign({},f,{options:EX.get('employees').filter(e=>e.role==='dme').map(e=>({value:e.id,label:e.name}))}) : f);
  EX.openModal(`${EX.modalHeader('Add client directly', 'For clients onboarded outside the standard lead → proposal flow.')}
    <form onsubmit="EX.submitAddClient(event)" class="p-5 max-h-[70vh] overflow-y-auto">${EX.formGrid(fields,{status:'Active',serviceStatus:'Active',currency:'INR'},2)}
    <div class="flex justify-end gap-2 pt-3 mt-2 border-t" style="border-color:var(--ex-line)"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Create client</button></div></form>`,{wide:true});
};
EX.submitAddClient = async function(ev){
  ev.preventDefault();
  if(!EX.canSeeFinancials()){ EX.toast('You do not have permission to add clients.','bad'); return; }
  const data = EX.readForm(ev.target, EX.CLIENT_FIELDS);
  data.services=[]; data.platforms=[]; data.contractStart=EX.now(); data.durationMonths=12;
  let id;
  try{ id = await EX.add('clients', data); }catch(e){ return; }
  await EX.addAudit('Added client directly','clients',id,null,data);
  EX.closeModal(); EX.toast('Client created','good'); EX.route('clients', id);
};

  if(!finance) tabs = tabs.filter(([k])=>k!=='invoices');

      <button onclick="EX.enterPortalPreview('${c.id}')" class="ex-btn ex-btn-ghost">${EX.icon('external','w-4 h-4')} Preview client portal</button>
      ${finance?`<button onclick="EX.editClientModal('${c.id}')" class="ex-btn ex-btn-ghost">${EX.icon('edit','w-4 h-4')} Edit</button>`:''}
    </div>
  </div>

    ${tabs.map(([k,l])=>`<button onclick="EX.ui.clientTab='${k}';EX.scheduleRender()" class="px-3 py-2 text-sm font-medium border-b-2 -mb-px whitespace-nowrap" style="border-color:${activeTab===k?'var(--ex-blue-600)':'transparent'};color:${activeTab===k?'var(--ex-blue-600)':'var(--ex-ink-soft)'}">${l}</button>`).join('')}

  ${activeTab==='content'?EX.clientContentTab(c):''}${activeTab==='tasks'?EX.clientTasksTab(c):''}${activeTab==='performance'?EX.clientPerformanceTab(c):''}
  ${activeTab==='invoices'&&finance?EX.clientBillingTab(c):''}${activeTab==='meetings'?EX.clientMeetingsTab(c):''}${activeTab==='extrawork'?EX.clientExtraWorkTab(c):''}${activeTab==='support'?EX.clientSupportTab(c):''}${activeTab==='health'?EX.clientHealthTab(c,health):''}`;
};
EX.editClientModal = function(id){
  if(!EX.canSeeFinancials()){ EX.toast('You do not have permission to edit client accounts.','bad'); return; }
  const c = EX.byId('clients', id);
  const fields = EX.CLIENT_FIELDS.map(f=> f.key==='assignedDme'? Object.assign({},f,{options:EX.get('employees').filter(e=>e.role==='dme').map(e=>({value:e.id,label:e.name}))}) : f);
  EX.openModal(`${EX.modalHeader('Edit client')}<form onsubmit="EX.submitEditClient(event,'${id}')" class="p-5 max-h-[70vh] overflow-y-auto">${EX.formGrid(fields,c,2)}

EX.submitEditClient = async function(ev,id){
  ev.preventDefault();
  if(!EX.canSeeFinancials()){ EX.toast('You do not have permission to edit client accounts.','bad'); return; }
  const before = EX.byId('clients', id);
  const data = EX.readForm(ev.target, EX.CLIENT_FIELDS);
  try{ await EX.patch('clients', id, data); }catch(e){ return; }
  await EX.addAudit('Edited client','clients',id,before,data);
  EX.closeModal(); EX.toast('Client updated','good');
};

EX.editClientServices = function(id){
  const c = EX.byId('clients', id); const sel = c.services||[];
  EX.openModal(`${EX.modalHeader('Active services for '+c.companyName)}
    <form onsubmit="EX.saveClientServices(event,'${id}')" class="p-5 max-h-[65vh] overflow-y-auto">
      ${Object.keys(EX.SERVICE_CATALOG).map(cat=>`<div class="mb-3"><div class="text-xs font-semibold mb-1.5">${cat}</div><div class="space-y-1">${EX.SERVICE_CATALOG[cat].map(item=>{const existing=sel.find(s=>s.item===item); const qtyable=EX.QUANTIFIABLE.includes(item);
        return `<label class="flex items-center gap-2 text-sm py-0.5"><input type="checkbox" name="svc" value="${cat}|||${item}" ${existing?'checked':''}/> ${item} ${qtyable?`<input type="number" name="qty|||${item}" value="${existing&&existing.qty||''}" placeholder="qty/mo" class="ex-input !w-20 !py-1 ml-auto"/>`:''}</label>`;
      }).join('')}</div></div>`).join('')}

};
EX.saveClientServices = async function(ev,id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const services = fd.getAll('svc').map(v=>{const [cat,item]=v.split('|||'); const qty=fd.get('qty|||'+item); return {cat,item,qty:qty?Number(qty):null};});
  await EX.patch('clients', id, {services});
  await EX.addAudit('Updated client services','clients',id,null,services);
  EX.closeModal(); EX.toast('Services saved','good');
};

EX.saveAddPlatform = async function(ev, clientId){
  ev.preventDefault();
  const data = EX.readForm(ev.target, [{key:'platform'},{key:'url'}]);
  const c = EX.byId('clients', clientId);
  const platforms = (c.platforms||[]).concat([{platform:data.platform, url:data.url||'', active:true, lastVerified:EX.now()}]);
  await EX.patch('clients', clientId, {platforms});
  await EX.addAudit('Added platform link','clients',clientId,null,data);
  EX.closeModal(); EX.toast('Platform added','good');
};
EX.removePlatform = async function(clientId, idx){
  const c = EX.byId('clients', clientId);
  const platforms = (c.platforms||[]).filter((_,i)=>i!==idx);
  await EX.patch('clients', clientId, {platforms});
  EX.toast('Platform removed','good');
};

EX.savePerformance = async function(ev,id){
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const n = (k)=> fd.get(k)?Number(fd.get(k)):null;
  const performance = {
    social:{followers:n('followers'),reach:n('reach'),engagement:n('engagement'),updatedAt:EX.now()},
    ads:{spend:n('spend'),leads:n('leads'),cpl:n('cpl'),updatedAt:EX.now()},

  await EX.patch('clients', id, {performance});
  EX.closeModal(); EX.toast('Performance snapshot updated','good');

EX.toggleServiceHold = function(id){
  const c = EX.byId('clients', id);
  const next = c.serviceStatus==='On Hold' ? 'Active' : 'On Hold';
  EX.confirmAction(next==='On Hold'?'Put service on hold':'Resume service', next==='On Hold' ? "This flags the account On Hold in the client portal with today's date. Only an authorized staff change can do this — it is never automatic." : 'This resumes normal active service status.', async ()=>{
    await EX.patch('clients', id, {serviceStatus:next, serviceStatusChangedAt:EX.now()});
    await EX.addAudit('Client service status changed','clients',id,{serviceStatus:c.serviceStatus},{serviceStatus:next});
    EX.toast('Service status updated','good');
  }, next==='On Hold');
};

EX.setContentStatus = async function(id, status){
  const x = EX.byId('content', id);
  const isLate = x.deadline && EX.now()>x.deadline && status==='Published';
  if(isLate && !x.lateReason){ EX.closeModal(); return EX.lateReasonModal(id, status); }
  await EX.patch('content', id, {status});
  await EX.addAudit('Content status changed','content',id,{status:x.status},{status});
  EX.closeModal(); EX.toast(`Status → ${status}`,'good');
};

EX.saveLateReason = async function(ev,id,status){
  ev.preventDefault();
  const reason = new FormData(ev.target).get('reason');

  EX.closeModal(); EX.toast('Status updated','good');

EX.addContentComment = async function(ev,id){
  ev.preventDefault();
  const text = new FormData(ev.target).get('text');
  const x = EX.byId('content', id);
  const comments = (x.comments||[]).concat([{by:EX.currentEmployee()?EX.currentEmployee().name:(EX.session.mode==='portal'?'Client':'—'), text, ts:EX.now()}]).slice(-30);
  await EX.setId('content', id, Object.assign({}, x, {comments}));

};

// Who is allowed to assign a task TO a given target employee. Digital Marketing
// Executives/Interns can only be assigned tasks by a DME or the Ops Head/MD;
// the Creative Head's own team (Interns/Part-Timers/Video Editors who are not
// digital-marketing interns) can only be assigned tasks by the Creative Head or
// Ops Head/MD. Every other target has no extra restriction.
EX.canAssignTo = function(targetEmp){
  if(!targetEmp) return true;
  const role = EX.currentRole();
  if(['super_admin','ops_head'].includes(role)) return true;
  if(targetEmp.role==='dme' || EX.isDmIntern(targetEmp)){
    return role==='dme';
  }
  if(EX.isCreativeTeamMember(targetEmp)){
    return role==='creative_head';
  }
  return true;
};
EX.canCreateTasks = function(role){ role = role || EX.currentRole(); return !['intern','parttime'].includes(role); };

  items = items.map(t=>Object.assign({},t,{clientName:(EX.byId('clients',t.clientId)||{}).companyName||''}));
  return `${EX.pageHead('Tasks', isManager?'All tasks across the team':'Tasks assigned to you', EX.canCreateTasks(role)?`<button onclick="EX.showAddTaskModal()" class="ex-btn ex-btn-primary">${EX.icon('plus','w-4 h-4')} New task</button>`:'')}
  ${EX.dataTable({id:'tasksGlobal', rows:items, searchKey:t=>`${t.title} ${t.clientName}`, filterOptions:EX.TASK_STATUSES, filterKey:t=>t.status, filterLabel:'status', rowClick:t=>`EX.openTaskDrawer('${t.id}')`,
    columns:[{label:'Task',get:t=>t.title},{label:'Client',get:t=>t.clientName||'—'},{label:'Type',get:t=>t.type||'—'},{label:'Assigned',get:t=>t.assignedToName||'—'},
      {label:'Priority',get:t=>t.priority?EX.pill(t.priority==='Urgent'||t.priority==='High'?'Overdue':'New'):'—'},{label:'Deadline',get:t=>EX.fmtDate(t.deadline)},{label:'Status',get:t=>EX.pill(t.status)}],
    emptyLabel:'No tasks yet'})}`;
};
EX.showAddTaskModal = function(taskId, clientId){
  const t = taskId? EX.byId('tasks', taskId) : (clientId? {clientId} : null);

};

    const rev = invs.filter(i=>i._createdAt && EX.monthKey(new Date(i._createdAt))===m.ym).reduce((s,i)=>s+(i.total||0),0);
    const exp = EX.get('expenses').filter(e=>e.date && EX.monthKey(new Date(e.date))===m.ym).reduce((s,e)=>s+(e.amount||0),0);
    return Object.assign({},m,{rev,exp,profit:rev-exp});
  });
  const maxV = Math.max(1,...monthly.map(m=>Math.max(m.rev,m.exp)));
  const aging = {'0-7':0,'8-30':0,'31-60':0,'61-90':0,'90+':0};
  invs.filter(i=>!['Draft','Cancelled','Refunded','Paid'].includes(i.status)).forEach(i=>{
    const bal = i.total-EX.paidTotalForInvoice(i.id); if(bal<=0) return;
    const days = Math.floor((EX.now()-(i.dueDate||EX.now()))/86400000);
    if(days<=7) aging['0-7']+=bal; else if(days<=30) aging['8-30']+=bal; else if(days<=60) aging['31-60']+=bal; else if(days<=90) aging['61-90']+=bal; else aging['90+']+=bal;
  });
  const clientsRanked = EX.get('clients').filter(c=>c.status==='Active').map(c=>{
    const rev = c.monthlyFee||0; const estCost = rev*((EX.data.companyConfig&&EX.data.companyConfig.assumedCostRatio)||0.6); const estProfit = rev-estCost;
    return Object.assign({},c,{rev,estProfit,estMargin: rev? Math.round(estProfit/rev*100):0});
  }).sort((a,b)=>b.rev-a.rev);
  return `${EX.pageHead('Finance Dashboard', 'Revenue, cash, receivables, payables and profitability — grounded in invoices, payments and logged expenses.')}
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${EX.statCard('Revenue (this mo., accrual)', EX.fmtMoney(k.revenueMonth),'','info','file-text')}
    ${EX.statCard('Cash received (this mo.)', EX.fmtMoney(k.cashMonth),'','good','wallet')}
    ${EX.statCard('Receivables', EX.fmtMoney(k.receivables), `${EX.fmtMoney(k.overdueTotal)} overdue`, k.overdueTotal?'bad':'good','credit-card')}
    ${EX.statCard('Payables (vendor + pending)', EX.fmtMoney(k.vendorPayables),'','warn','truck')}
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-5">
    <div class="lg:col-span-2 ex-card p-5">
      <div class="font-display font-bold text-sm mb-3">Revenue vs Expenses vs Profit — last 6 months</div>
      <div class="flex items-end gap-3 h-40">
        ${monthly.map(m=>`<div class="flex-1 flex flex-col items-center justify-end gap-1">
          <div class="flex items-end gap-0.5 h-32">
            <div title="Revenue" style="width:10px;height:${Math.max(2,m.rev/maxV*128)}px;background:var(--ex-blue-500);border-radius:2px 2px 0 0"></div>
            <div title="Expenses" style="width:10px;height:${Math.max(2,m.exp/maxV*128)}px;background:var(--ex-warn);border-radius:2px 2px 0 0"></div>
          </div>
          <div class="text-[10px]" style="color:var(--ex-ink-soft)">${m.label}</div>
        </div>`).join('')}
      </div>
      <div class="flex gap-4 mt-2 text-xs" style="color:var(--ex-ink-soft)"><span><span class="ex-badge-dot" style="background:var(--ex-blue-500)"></span> Revenue</span><span><span class="ex-badge-dot" style="background:var(--ex-warn)"></span> Expenses</span></div>
    </div>
    <div class="ex-card p-5">
      <div class="font-display font-bold text-sm mb-3">Receivables Aging</div>
      ${Object.entries(aging).map(([b,v])=>`<div class="flex items-center justify-between text-sm py-1"><span style="color:var(--ex-ink-soft)">${b} days</span><span class="tnum font-medium">${EX.fmtMoney(v)}</span></div>`).join('')}
    </div>
  </div>
  <div class="ex-card p-5">
    <div class="flex items-center justify-between mb-3"><div class="font-display font-bold text-sm">Client Profitability Ranking</div><span class="text-xs" style="color:var(--ex-ink-soft)">Margin is assumption-based (${Math.round(((EX.data.companyConfig&&EX.data.companyConfig.assumedCostRatio)||0.6)*100)}% cost ratio) — set a real ratio in Settings once delivery costs are tracked per client.</span></div>
    <table class="ex-table"><thead><tr><th>Client</th><th>Monthly Revenue</th><th>Est. Profit</th><th>Est. Margin</th><th>Health</th></tr></thead>
    <tbody>${clientsRanked.map(c=>{const h=EX.computeClientHealth(c); return `<tr onclick="EX.route('clients','${c.id}')" style="cursor:pointer"><td>${c.companyName}</td><td class="tnum">${EX.fmtMoney(c.rev,c.currency)}</td><td class="tnum">${EX.fmtMoney(c.estProfit,c.currency)}</td><td class="tnum">${c.estMargin}%</td><td>${EX.pill(h.label)}</td></tr>`;}).join('')||`<tr><td colspan="5">${EX.empty('No active clients yet')}</td></tr>`}</tbody></table>
  </div>`;
};

// ---- Create a real Supabase Auth login for a teammate ----
// This goes through the server-side api/create-user.js function (service_role
// key) rather than calling sb.auth.signUp() directly from the browser, because
// signUp() would create a session for the NEW user right here and sign the
// admin doing this OUT of their own account. See api/create-user.js.
EX.setupLogin = function(id){
  const emp = EX.byId('employees', id);
  if(!emp) return;
  if(!emp.email){ EX.toast("This employee has no email on file — add one via Edit profile first, then set up their login.", 'bad'); return; }
  EX.openModal(`${EX.modalHeader('Set up login for '+emp.name, "Creates a Supabase Auth account so they can sign in with their own email and password. This doesn't affect your own session.")}
    <form onsubmit="EX.submitSetupLogin(event,'${id}')" class="p-5 space-y-3">
      <div><label class="ex-label">Email</label><input class="ex-input" value="${emp.email}" disabled/></div>
      <div><label class="ex-label">Temporary password</label><input required name="password" type="text" minlength="8" class="ex-input" placeholder="At least 8 characters"/></div>
      <p class="text-xs" style="color:var(--ex-ink-soft)">Share this password with ${emp.name} privately (there's no "change on first login" step yet — a password manager works well here).</p>
      <div class="flex justify-end gap-2 pt-3 mt-2 border-t" style="border-color:var(--ex-line)"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Create login</button></div>
    </form>`);
};
EX.submitSetupLogin = async function(ev, id){
  ev.preventDefault();
  const emp = EX.byId('employees', id);
  if(!emp) return;
  const fd = new FormData(ev.target);
  const password = fd.get('password');
  const btn = ev.target.querySelector('button.ex-btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Creating…'; }
  try{
    if(!EX.sb) throw new Error('Not connected to the workspace database.');
    const { data } = await EX.sb.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if(!token) throw new Error('Your own session looks expired — sign out and back in, then try again.');
    const res = await fetch('/api/create-user', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
      body: JSON.stringify({email: emp.email, password}),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok || json.error) throw new Error(json.error || ('Request failed ('+res.status+')'));
    EX.closeModal();
    EX.toast('Login created for '+emp.name+' — share the password with them privately.', 'good');
    await EX.addAudit('Set up login', 'employees', id, null, {email: emp.email});
  }catch(e){
    EX.toast('Could not create the login: '+((e && e.message) || 'unknown error'), 'bad');
    if(btn){ btn.disabled = false; btn.textContent = 'Create login'; }
  }
};

EX.exportMonthlyReview = async function(ym){

EX.showAssetModal = function(id, presetEmployeeId){
  const a = id? EX.byId('companyAssets', id) : (presetEmployeeId? {assignedTo:presetEmployeeId, assignedDate:EX.todayKey(), status:'In Use', condition:'Good'} : {status:'In Store', condition:'New'});
  const fields = EX.ASSET_FIELDS.map(f=> f.key==='assignedTo'? Object.assign({},f,{options:[{value:'',label:'— Unassigned —'}].concat(EX.get('employees').filter(e=>e.status==='Active').map(e=>({value:e.id,label:e.name})))}) : f);
  EX.openModal(`${EX.modalHeader(id?'Edit asset':'Add company asset')}
    <form onsubmit="EX.saveAsset(event${id?`,'${id}'`:''})" class="p-5 max-h-[70vh] overflow-y-auto">${EX.formGrid(fields, a, 2)}
    <div class="flex justify-end gap-2 pt-3 mt-2 border-t" style="border-color:var(--ex-line)"><button type="button" class="ex-btn ex-btn-ghost" onclick="EX.closeModal()">Cancel</button><button class="ex-btn ex-btn-primary">Save</button></div></form>`,{wide:true});

EX.saveAsset = async function(ev, id){
  ev.preventDefault();
  const data = EX.readForm(ev.target, EX.ASSET_FIELDS);
  if(data.assignedTo && data.status==='In Store') data.status='In Use';
  if(id){ await EX.patch('companyAssets', id, data); await EX.addAudit('Edited asset','companyAssets',id,null,data); }
  else { const nid = await EX.add('companyAssets', data); await EX.addAudit('Issued asset','companyAssets',nid,null,data); }
  EX.closeModal(); EX.toast('Asset saved','good');
};
EX.returnAsset = async function(id){
  await EX.patch('companyAssets', id, {status:'Returned', assignedTo:null, returnedDate:EX.now()});
  await EX.addAudit('Asset returned','companyAssets',id,null,null);
  EX.toast('Marked as returned','good');
};
EX.confirmDeleteAsset = function(id){
  EX.confirmAction('Delete this asset record?', 'This permanently removes the asset from the register. This cannot be undone.', async ()=>{ await EX.remove('companyAssets', id); EX.toast('Asset deleted','good'); }, true);
};

EX.leaveQuickRange = function(days){
  const from = document.getElementById('f_startDate');
  const to = document.getElementById('f_endDate');
  if(!from || !to) return;
  const base = from.value ? new Date(from.value+'T00:00:00') : new Date();
  if(!from.value) from.value = base.toISOString().slice(0,10);
  const end = new Date(base.getTime() + (days-1)*86400000);
  to.min = from.value;
